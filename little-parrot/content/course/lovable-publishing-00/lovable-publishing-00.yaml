        - type: video
          title: Launch and Grow Your Lovable App
          content:
            videoRemotionId: lesson-vibe-coding-lovable-publish-00-video-00
            vimeoId: 1165274396
            youtubeId: 'CKXnK9Agq18'
            transcript: |-
              You've built an app with Lovable. That's a real achievement. But right now, it
              probably lives on a generic URL, has a default favicon, and maybe still uses test
              data. If you share it with someone, they might wonder: is this a real product?

              That's about to change.

              In this course, you'll go from "I built an app" to "I'm running a product
              that people can find, trust, and use." You'll publish your app properly, set up a
              custom domain, add legal pages, make it discoverable through search engines and AI
              tools, track how people use it, and plan your growth.

              By the end, you won't just have an app. You'll have a live product with a
              professional presence on the internet. And you'll know exactly how to keep
              improving it based on what your users tell you.

              Ready to launch? Let's go!
        - type: text
          title: What "publish" means in Lovable
          content:
            body: |-
              When you **publish** in Lovable, your app becomes accessible on the internet. Anyone with the link can visit it from their phone, tablet, or computer.

              **Before publishing**, your app exists only in Lovable's editor. **After publishing**, it gets a real URL that you can share with anyone.

              Publishing is a bit like opening a shop. Before you open the doors, you want to make sure the shelves are stocked and the sign looks right. That's what the next few steps are about.
            imageUrl: /courses/lovable-publishing-00/publish.gif
          subtitle: From your editor to the internet
        - type: text
          title: 'Preview vs production: two different worlds'
          content:
            body: |-
              Lovable gives you **two environments**:

              **Preview** is your testing playground. It's where you build your product, test how it works, and experiment without consequences. Think of it like a dress rehearsal.

              **Production** is the real thing. It's what your users see when they visit your published URL.

              Changes you make in the editor show up in preview immediately. But they only reach production when you click **Publish**. This separation is your safety net. You can break things in preview, fix them, and your users never see a thing.
          subtitle: Testing vs the real thing
        - type: text
          title: Switch to real API keys before going live
          content:
            body: |-
              If your app connects to **external services** (like Stripe for payments or a third-party email provider), you may have **test API keys** stored in Lovable. These work fine for development, but they won't work properly for real users.

              **Forgetting to switch them** is a common gotcha. Your app will look like it works, but behind the scenes, data might not save, emails might not send, or payments might not process. A quick check now saves confusion later.

              *If API keys are new to you, our [Basics of Software for Vibe Coding](https://littleparrot.app/4794366d-b807-4804-8fd5-64c3a5a03472/course-overview) course explains them in friendly terms.*
          subtitle: A common gotcha to avoid
        - type: text
          title: How to check and update your API keys
          content:
            body: |-
              **Here's how to find and update your API keys in Lovable:**

              1. In your Lovable project, open the **More** tab in the toolbar at the top and select **Cloud**
              2. Go to the **Secrets** section. You'll see every secret your app uses, listed by name and the date it was added. Ones with a **Lovable** badge are managed for you and can't be deleted
              3. To **update a key**, click **Add secret** and save a new value under the **same name** as the old one: the name (e.g. `STRIPE_API_KEY`) in the **Name** field, your production key from the external service in the **Value** field

              There's no edit button, and that's deliberate. **Values are never shown again once saved**, not even to you, so the only way to change one is to write over it. Worth having the new key on your clipboard before you start.

              If a **Not in use** badge appears next to a secret, you've ended up with two of the same name and only one is being used. Delete the old one from its **...** menu.

              If your app doesn't use any external services yet, you can skip this step. Lovable's own API keys are managed automatically.
            imageUrl: /courses/lovable-publishing-00/update-api-key.webp
          subtitle: Finding the Secrets panel
        - type: text
          title: Your app's first address
          content:
            body: |-
              When you publish your app, Lovable gives it a **subdomain URL** like `book-club-pick.lovable.app`. This is the first address your app will have on the internet, and it's completely free.

              A **subdomain** is the part before the main domain name. In `book-club-pick.lovable.app`, `book-club-pick` is the subdomain and `lovable.app` is Lovable's domain. Think of it like an apartment number in a building: `lovable.app` is the building, and your subdomain is your own front door within it.
          imageUrl: /courses/lovable-publishing-00/lovable-subdomain.webp
          subtitle: Your free Lovable subdomain
        - type: text
          title: Customising your subdomain
          content:
            body: |-
              You can **customise this subdomain** to make it cleaner and more recognisable. Where you do it depends on whether you've published yet:

              **Before your first publish:** click the **Publish** button in the top-right corner and edit the **Website URL** field right there in the Publish panel, then publish.

              **After you've published:** open your project settings (press **Cmd + .** on a Mac, **Ctrl + .** on Windows, or use the **More** tab in the toolbar), go to **URL subdomain**, change it to something short and descriptive, and click **Update URL subdomain**.

              This URL works perfectly for **sharing your app early on**. Later, in *Challenge 2*, you'll learn how to connect a custom domain (like `bookcluborganiser.com`) if you want an even more professional address. But the Lovable subdomain is a great starting point, and you can keep using it for as long as you like.
          imageUrl: /courses/lovable-publishing-00/lovable-subdomain-updated.webp
          subtitle: Make it your own
        - type: text
          title: Give your app a favicon
          content:
            body: |-
              A **favicon** is the small icon that appears in browser tabs next to your app's name.

              Lovable generates one for you while it builds your app, so you won't be stuck with Lovable's own icon. But a generated icon is a guess at your brand, and swapping it for your real logo is one of the quickest ways to make your app feel like yours.

              You can **create a favicon for free** using tools like [realfavicongenerator.net](https://realfavicongenerator.net/). Upload your logo, your brand initials, or a simple icon that represents your product. These tools will generate the right file format and sizes for you automatically.

              It's a small detail, but it **makes a noticeable difference**. When Sarah sees the Book Club Organiser tab in her browser with your icon on it, it feels like a real product. Let's see how to set it.
            imageUrl: /courses/lovable-publishing-00/favicon.webp
          subtitle: The small icon that makes a big difference
        - type: text
          title: Set your favicon
          content:
            body: |-
              1. Click the **Publish** button in the top-right corner
              2. Click the **favicon** next to your website URL, or open the **⋮** menu and choose **Social & search appearance**
              3. Upload your generated file in the icon area

              Once your app is live, there's a second route in: click **Edit** next to your site's title on the "Your website is live" screen.

              You can **change your favicon at any time**, so don't worry about getting it perfect on the first try. Once you've uploaded it, publish your app and it will show up in the browser tab when users visit.
            imageUrl: /courses/lovable-publishing-00/upload-favicon.webp
          subtitle: To set your favicon in Lovable
        - type: text
          title: Set your meta tags
          content:
            body: |-
              **Meta tags** control how your app appears when someone shares the link on social media, or messaging services (like WhatsApp, or Slack). They include:

              - **Title:** The name that appears in link previews and browser tabs
              - **Description:** A short summary that appears below the title
              - **Social image:** The image that shows in social media previews

              Lovable writes all three for you while it builds, so your job is to read them and decide whether they're right. They're in **Social & search appearance**, the same place you uploaded your favicon.

              The quickest way to change them is to **ask Lovable in Build mode**:

              ```
              Change my site title to "Book Club Organiser", write a description about collecting and voting on book suggestions, and generate a new social image.
              ```

              Make your title clear (e.g., "Book Club Organiser") and your description inviting (e.g., "The easiest way to pick your book club's next read"). For the social image, 1200x630 pixels works best on social media. You can make your own for free with tools like [Canva](https://www.canva.com/) and upload it, or let Lovable generate one.

              When someone shares your link, these details are the **first impression**.
          subtitle: Control how your link looks when shared
        - type: text
          title: See it the way other people will
          content:
            body: |-
              You don't have to publish and then paste your link into WhatsApp to find out how it looks. Lovable shows you first.

              Open the **page selector** above the preview and hover the preview icon on any page of your app. Two cards appear:

              - The **Social** card shows the title, description and image that social platforms read
              - The **Search** card shows how the page appears in search results

              These reflect your latest changes, even before you publish. If something looks wrong, select **Ask Lovable to edit** and describe the change.

              Worth doing this **per page**, not just your home page. People share the page they were looking at, not your front door.
            imageUrl: /courses/lovable-publishing-00/share-review.webp
          subtitle: Check the Social and Search cards
        - type: text
          title: Test on mobile and desktop before publishing
          content:
            body: |-
              Before you hit Publish, take a moment to check how your app looks on **different screen sizes**. Many of your users will visit from their phones, and what looks great on a laptop can look broken on a smaller screen.

              Lovable makes this easy. In the preview panel, look for the **device toggle** at the top. It lets you switch between a desktop, and mobile view without leaving the editor.

              **Things to check:**
              - Does the **layout** look right on all views?
              - Are **buttons** and **text** large enough to tap on mobile?
              - Does the **navigation** still work on a smaller screen?

              If something looks off, you can prompt Lovable to fix it by **attaching a screenshot** and explaining the issue.

              After publishing, it's also worth opening your app on your actual phone to double-check. The preview is helpful, but nothing beats testing on a real device.
            imageUrl: /courses/lovable-publishing-00/device-toggle.webp
          subtitle: Make sure it looks right everywhere
        - type: quiz-question
          title: 'Quiz: Preview vs production'
          content:
            question: What is the difference between preview and production in Lovable?
            options:
              - Preview is faster, production is slower
              - Preview is free, production costs extra
              - Preview is your testing environment, production is what real users see
              - Preview shows code, production shows the app
            correctAnswer: 2
            explanation: Preview is the environment where you build your app and test changes safely. Production is the live version your users see. Changes only reach production when you click Publish, which means you can experiment in preview without affecting real users.
        - type: quiz-question
          title: 'Quiz: API keys'
          content:
            question: Why should you check your API keys before publishing?
            options:
              - Test keys won't work properly for real users
              - Production keys are cheaper to use
              - Test keys make the app slower
              - Production keys unlock more features in Lovable
            correctAnswer: 0
            explanation: Test API keys are designed for development and testing your app works as expected, not real users. If you forget to switch to production keys, features like payments, or sending emails will not work, even though the app looks fine on the surface.
        - type: reflection
          title: 'Your turn: Publish your app'
          content:
            description: |-
              Time to go live!

              What are you building, and who did you share it with, or are planning to share it with?
            placeholder: |-
              I'm building:

              I shared it with / I'm planning to share it with:

              Their first reaction was:
            subDescription: You've taken your app from preview to production. That's a real milestone.
        - type: challenge-end
          title: 'Your app is live on the internet! 💫'
          content:
            nextModule: "**Next challenge:** Your app is live, but its address is still something like `bookclub.lovable.app`. What if it could be `bookcluborganiser.com`? In the next challenge, you'll claim a custom domain and give your product a professional home on the internet."
            description: You've published your first production-ready app.
            subDescription: |-
              You've checked your API keys, customised your Lovable subdomain, set your own favicon, reviewed your meta tags, seen how your link looks when it's shared, tested on mobile and desktop, and published. Your app has its first real address on the internet, and someone out there can use something you built. That's worth celebrating.

              **Toolkit:** Need to revisit these steps later? Use the [Meta Tags and Favicon Setup Guide](https://littleparrot.app/nest/toolkit/0b1f2dca-14c3-4db6-a653-e139cf8222f4) for a quick reference.

    - title: 'Connect a Custom Domain'
      isFree: false
      skills:
        - Custom Domains
        - Domain Registration
        - Google Site Verification
      description: Give your product a branded address that people can remember.
      completionTime: '8:00'
      steps:
        - type: text
          title: Why a custom domain is useful
          content:
            body: |-
              Right now, your app lives at something like `book-club-picks.lovable.app`. That works, but it might be loo long.

              A **custom domain** like `bookcluborganiser.com` gives your product:
              - **Credibility:** It looks like a real business, not a side project
              - **Memorability:** People can type it from memory
              - **Ownership:** You control the address, even if you move to a different platform later

              A custom domain is not required to launch. But if you're serious about growing your product, it's one of the most impactful steps you can take.

              **Note:** Connecting a custom domain in Lovable requires a paid plan. You can buy the domain through Lovable itself, or from a separate registrar and connect it afterwards. We'll cover both.
          subtitle: More than a vanity URL
        - type: text
          title: How to check if a domain is available
          content:
            body: |-
              Before you buy, you need to check if your desired domain name is available. Here are a few ways to do this:

              - **Ask Lovable in your project, in Build mode.** Describe the kind of name you want and it shows you what's available, with prices
              - Visit a domain registrar like [GoDaddy](https://www.godaddy.com/) and search for your desired domain name
              - Try variations if your first choice is taken (e.g., `getbookclub.com`, `mybookclub.app`, `bookclubhq.com`)

              **Tips for choosing a good domain:**
              - Keep it short and easy to spell
              - Avoid hyphens and numbers if possible
              - `.com` is the most recognised, but `.app`, `.io`, and country-specific domains (like `.co.uk`) work well too
              - Say it out loud. If you have to spell it for someone, it might be too complicated

              **Pro tip:** Check social media platforms too. You want to make sure you can get a matching handle (like @bookcluborganiser) on Instagram, LinkedIn, etc.
          subtitle: Finding the right name
        - type: text
          title: How to buy and connect a domain
          content:
            body: |-
              Most domains cost between $10-15 per year. You have two routes, and both end in the same place.

              **Buying through Lovable.** Ask Lovable in Build mode: `Find me a domain for my book club app`. Lovable shows you what's available with prices, and buying the one you pick continues in checkout. It shows a confirmation card before it buys anything, and it sets up the connection for you afterwards. Only workspace admins and owners on a paid plan can buy this way.

              **Connecting a domain you already own.** Open your project settings, go to the **Domains** tab, and add your domain there. You can also reach it from **Add domain** in the Publish panel, or just ask Lovable in Build mode to connect it. You'll need to log into your registrar, like Porkbun, or GoDaddy, to finish the connection.

              DNS changes can take a few minutes to a few hours to take effect. Don't worry if it doesn't work immediately. This is called **DNS propagation** and it's completely normal.

              Your project's **Domains** tab tells you where things stand. Lovable checks each live domain when you open it, and a domain that stops working shows **Connection issue** with what it found and what to do next. Worth a glance if someone ever tells you your site won't load.

              *DNS (Domain Name System) is like a phone book for the internet. It tells browsers which server to connect to when someone types your domain name.*
          subtitle: From registrar to Lovable
        - type: text
          title: Add Google site verification
          content:
            body: |-
              While you're in your domain settings, it's a good time to set up **Google site verification**. This proves to Google that you own the domain, which is useful for:
              - Submitting your site to **Google Search** (so it can be found)
              - Accessing **Google Search Console** (to see how people find you)
              - Setting up **Google Analytics** later

              **To verify your domain:**
              1. Go to [Google Search Console](https://search.google.com/search-console)
              2. **Sign in** with your Google account
              3. Add your **domain**
              4. Click **Start verification** 
              5. **Sign into** your domain registrar (like Porkbun, or GoDaddy)
              6. **Connect** to verify your domain (Google will automatically check for the verification record in your DNS settings)
              7. Once Google confirms the record is found, **your domain is verified!**

              This step takes less than five minutes and unlocks tools you'll use in later challenges.
          subtitle: Prove ownership to Google
        - type: quiz-question
          title: 'Quiz: Custom domains'
          content:
            question: What's the most important benefit of a custom domain for a new product?
            options:
              - It makes the your product load faster
              - It builds credibility and makes the product easier to share
              - It's required by Lovable before you can publish your app
              - It's the only way for users you don't know to access your app
            correctAnswer: 1
            explanation: A custom domain makes your product look professional and trustworthy. People are more likely to click, share, and remember a clean domain name. It's not required for publishing, but it's one of the most impactful steps for growth.
        - type: quiz-question
          title: 'Quiz: DNS changes'
          content:
            question: What should you do if your custom domain doesn't work immediately after connecting it with Lovable?
            options:
              - Delete the domain you connected to Lovable and start over
              - Contact Lovable support immediately
              - Change your domain name to something else in the Lovable settings
              - Wait a few hours, as DNS changes can take time to propagate
            correctAnswer: 3
            explanation: When you add your custom domain to Lovable, it adds a record to the internet's phonebook. This requires a DNS (Domain Name System) change. DNS changes can take anywhere from a few minutes to several hours to take effect across the internet. This is called DNS propagation and it's completely normal. Give it some time before troubleshooting.
        - type: reflection
          title: 'Your turn: Choose your domain'
          content:
            description: |-
              Search for a domain name for your product on a registrar like GoDaddy.

              If you're ready to commit, buy it and connect it to your Lovable app following the steps in this challenge. If you're not ready to buy yet, that's fine too. Write down your top three choices.

              What domain did you choose (or shortlist), and what made you choose this name? If you decided against a custom domain for now, what are your reasons?
            placeholder: |-
              My domain choice / I decided against a custom domain for now because:

              I chose this name because:
            subDescription: Having a custom domain is a significant step. Even if you're still deciding, thinking about your domain name helps you think about your brand.
        - type: challenge-end
          title: 'Your product has a proper address! 🏠'
          content:
            nextModule: "**Next challenge:** Your product has a proper address and looks professional. But when a stranger lands on it for the first time, will they feel safe enough to sign up? In the next challenge, you'll add the legal pages and trust signals that make visitors feel confident using your product."
            description: You know how to find, buy, and connect a custom domain.
            subDescription: |-
              You've learned how to check domain availability, choose a memorable name, buy and connect a custom domain to your Lovable app, and verify ownership with Google. Whether you've connected one now or have it on your list, you've taken an important step towards building a recognisable brand.

    - title: 'Build Trust: Legal Pages That Protect You and Your Users'
      isFree: false
      skills:
        - Privacy Policy
        - Terms of Use
        - Cookie Banners
        - Legal Compliance
      description: Make strangers feel safe enough to sign up, by adding the legal foundations every serious product needs.
      completionTime: '8:00'
      steps:
        - type: text
          title: Why legal pages are important
          content:
            body: |-
              When someone visits your product for the first time, they're making a quick decision: **do I trust this enough to use it?**

              Legal pages like a **privacy policy** and **terms of use** aren't exciting, but they signal that you take your product (and your users) seriously. They tell visitors:
              - How their data is handled
              - What they can expect from your product
              - That there's a real person or business behind it

              If you're collecting any user data (even email addresses for login), most countries require you to have a privacy policy.
          subtitle: Trust starts with transparency
        - type: text
          title: Generate your privacy policy and terms
          content:
            body: |-
              Writing legal documents from scratch sounds intimidating, but you don't have to. You could **use an AI assistant** (like Gemini, Claude or ChatGPT) to get started, before investing into consulting with a lawyer. You can prompt it with:

              ```
              You are an expert lawyer. What information do you need from me to write a Privacy Policy and Terms of Use for my [brief description of your product] where I collect [data you collect, e.g., email addresses, customers' payment methods]? 

              The Privacy Policy must describe the information collected, its purpose of use, to whom and how to disclose it and reasonable security practices followed to safeguard such information.
              ```

              If you want something more trustworthy, you could use a tool like [Termly](https://termly.io/). It generates legal documents based on your answers to a questionnaire. It's free up to one document, and the generated documents are more reliable than a generic AI response.

              **Tip:** If you're using Google Analytics or Lovable Cloud (for data storage and authentication), you are collecting user data. Make sure to mention these in the questionnaire or the AI assistant.

              *Important note: This step is for educational purposes only. It is not legal advice.*
          subtitle: Legal pages to get started with
        - type: text
          title: Add footer links to your app
          content:
            body: |-
              Once you have your legal pages, you need to make them accessible. The standard place for legal links is the **footer** of your website, the section at the very bottom of the page.

              **Common footer links include:**
              - **Privacy Policy**
              - **Terms of Use** (sometimes called Terms of Service)
              - **Contact** (an email address or contact form)

              You can prompt Lovable to add these:

              ```
              Add a footer to all pages with links to:
              - Privacy Policy: [attach your privacy policy document]
              - Terms of Use: [attach your terms of use document]
              - Contact: [your email address]
              Use a subtle design that doesn't distract from the main content. Open the links in a new tab.
              ```
          subtitle: Where to put your legal links
        - type: text
          title: 'Cookie banners: when you need one'
          content:
            body: |-
              A **cookie banner** is the notification that appears when you first visit a website, asking you to accept or manage cookies. **Cookies** are data that websites store on your browser to remember things like your preferences or login status.

              **When do you need a cookie banner?**
              - If your **users are in the EU or UK**, you likely need one (GDPR and the UK's Privacy and Electronic Communications Regulations require consent for non-essential cookies)
              - If you **use Google Analytics, advertising tools, or third-party tracking**, you need one, and the the tracking cookies must be disabled until the user gives consent
              - If you **only use essential cookies** (like keeping users logged in), you may not need one, but it's often safer to have one

              You can add a cookie banner by **prompting Lovable directly**:

              ```
              Add a GDPR compliant cookie consent banner that appears at the bottom of the screen when a user first visits. 
              - It should have a brief message about using cookies
              - An "Accept" button
              - A "Customise cookies" feature where they can select which types of cookies to allow (e.g., essential, analytics, marketing)
              - Tracking cookies (like Google Analytics) should be disabled until the user gives consent 
              - Save the user's choice so the banner doesn't appear again on their next visit.
              ```

              When in doubt, adding a cookie banner is the safer choice. It shows your users you respect their privacy.
            imageUrl: /courses/lovable-publishing-00/cookie-banner.webp
          subtitle: Respecting your users' privacy
        - type: quiz-question
          title: 'Quiz: Privacy policy'
          content:
            question: When do you need a privacy policy for your web app?
            options:
              - When you collect any user data, including email addresses for login
              - Only when you sell products through your app, and ask for payment information
              - Only when you have more than 1,000 users
              - Only when you're using Google Analytics
            correctAnswer: 0
            explanation: If your app collects any personal data, including email addresses for login, most countries require a privacy policy. It's about being transparent with your users about how their information is handled.
        - type: quiz-question
          title: 'Quiz: Cookie banners'
          content:
            question: Which of the following are good reasons to add a cookie banner?
            options:
              - It makes your website load faster
              - You have users in the EU or UK
              - Your app uses Google Analytics
              - Cookie banners are required by Lovable before publishing for the first time
            correctAnswer: [1, 2]
            explanation: EU and UK privacy regulations (GDPR) require consent for non-essential cookies like those used by analytics tools. If you use Google Analytics and have users in these regions, a cookie banner is the right thing to add.
        - type: reflection
          title: 'Your turn: Think about data protection'
          content:
            description: |-
              Think it through: what data does your app collect from users?
            placeholder: |-
              My app collects:
            subDescription: Thinking about data protection might not be the most exciting part of building a product, but they're an important foundation. You're building something people can trust.
        - type: challenge-end
          title: 'Your product looks trustworthy! 🛡️'
          content:
            nextModule: "**Next challenge:** Right now, only people you share the link with can find your product. In the next challenge, you'll change that. You'll learn how to make your app discoverable through search engines and AI tools, so people you've never met can find what you've built."
            description: You've added the legal essentials that build trust.
            subDescription: |-
              You've generated a privacy policy and terms of use, added footer links so visitors can find them, and learned when and how to set up a cookie banner. These foundations make the difference between a side project and a product people feel safe using.

              **Toolkit:** The [Legal Pages Prompt Library](https://littleparrot.app/nest/toolkit/6f1be631-8fdd-4353-96a1-2d4cdefdad1a) has all the prompts from this challenge ready to copy and paste.

    - title: 'Get Found: SEO and Discoverability'
      isFree: false
      skills:
        - SEO
        - GEO
        - Backlinks
        - Google Business
      description: Make your product discoverable through search engines and AI tools, so people you've never met can find what you've built.
      completionTime: '13:00'
      steps:
        - type: text
          title: How users actually find websites
          content:
            body: |-
              Right now, the only way someone can reach your product is if you share the link directly. That's fine for your first few users, but it **doesn't scale**.

              People **find websites through several channels:**
              - **Search engines** like Google (someone types "book club organiser app")
              - **AI assistants** like Claude, Perplexity, or Google's AI Overview (someone asks "what's a good tool for organising a book club?")
              - **Social media** (someone shares your link on LinkedIn, X, or Instagram)
              - **Word of mouth** (Sarah tells another book club organiser about it)
              - **Backlinks** from other websites that mention your product

              In this challenge, you'll learn **how to improve your chances of being found** through search engines and AI tools. The social media and word-of-mouth parts come down to marketing, which is a whole topic on its own.
          subtitle: Beyond sharing links by hand
        - type: text
          title: SEO basics for your Lovable app
          content:
            body: |-
              **SEO** stands for Search Engine Optimisation. It's the practice of making your website easier for search engines like Google to find and understand.

              The good news? You've already done some SEO work. Setting your meta tags (title and description) in *Challenge 1* was your first step.

              Here are **more things you can do**:
              - **Use clear page titles** that describe what each page does
              - **Write descriptive headings** using heading tags (h1, h2, h3) in your content – *more on this in the next step*
              - **Add alt text to images** by prompting Lovable:
              ```
              Add descriptive alt text to all images in the app for accessibility and SEO.
              ```

              You don't have to work through all of this by hand, though. Lovable has a tool that checks the lot for you, which is the next step.
          subtitle: Help Google understand your product
        - type: text
          title: Let Lovable review your SEO
          content:
            body: |-
              Open the **More** tab in your project toolbar and select **SEO & AI search**, then click **Scan project**.

              Lovable reads through your app and reports back on the things search engines and AI tools look for: your `robots.txt` and sitemap, titles and descriptions, the social preview tags on each page, heading structure, alt text on images, whether your home page can be reached and indexed at all, and whether Google Search Console is set up.

              Findings are sorted with the failing ones at the top, each marked by how much it affects you: a red X blocks indexing entirely, an amber triangle is worth fixing, a blue lightbulb is a nice-to-have.

              **Running the review is free on every plan.** Each finding has a **Try to fix** button, and there's **Try to fix all** for the batch. Those cost credits, because Lovable is changing your code. After a fix, publish and scan again to confirm it worked.

              A status badge tells you whether the results are **Up to date** or **Out of date** after you've made changes, so you know when it's worth rescanning.
          subtitle: A free scan that finds what you missed
        - type: text
          title: 'Heading tags: helping search engines read your pages'
          content:
            body: |-
              We mentioned **heading tags** (h1, h2, h3) in the previous step. These are worth a closer look, because they're one of the easiest ways to improve your SEO.

              Heading tags tell search engines **what your page is about and how the content is structured**. Think of them like a table of contents in a book:
              - **h1** is the main title of the page (there should be only one per page)
              - **h2** tags are section headings
              - **h3** tags are sub-sections within an `h2`

              Search engines **use this hierarchy** to understand which parts of your page are the most important. If your headings are clear and descriptive, Google has a much easier time figuring out what your page offers.

              The good news is that Lovable can sort this out for you. Try this prompt:

              ```
              Review all pages in the app and fix the heading tag hierarchy. Each page should have exactly one h1 tag as the main title. Make sure the heading hierarchy follows HTML structure best practices. List what you changed.
              ```

              *Curious about HTML and how web pages are built? Our [Basics of Software for Vibe Coding](https://littleparrot.app/4794366d-b807-4804-8fd5-64c3a5a03472/course-overview) course explains these concepts in friendly terms.*
          subtitle: Structure your content for Google
        - type: text
          title: If your app was built before May 2026
          content:
            body: |-
              This one is worth checking, because it affects everything else in this challenge.

              Apps Lovable built from **May 2026** onwards put your pages together **on the server** before sending them out. Every visitor, search engine and AI crawler gets the finished page. Older apps, built on a setup called React + Vite, assemble the page **in the browser** instead, which means some tools see very little of your content.

              If your app is one of the older ones, upgrading fixes your social link previews and gives crawlers a readable page on every request. To do it, type `/` in the message box and choose **Migrate to TanStack Start**, or find **Migrate to TanStack Start** in **Project settings → General → Project actions**. You confirm before anything happens, and it costs somewhere between 10 and 35 credits depending on the size of your app.

              Not sure which one you're on? Ask Lovable. Your published site doesn't change until you publish, and you can go back through version history if it doesn't look right.
          subtitle: Check whether your pages are readable to Google
        - type: text
          title: Setting expectations about timing
          content:
            body: |-
              Here's something important to know: **SEO results take time**.

              After you publish and set everything up, it might take:
              - **A few days** in the best case to start appearing in Google results
              - **A few weeks** in the typical case
              - **A few months** if your product is in a competitive space

              This can feel frustrating, but it's normal. Search engines need time to discover, crawl, and index your website. The Google site verification you set up in the previous challenge helps speed this up.

              Don't let the wait discourage you. Every SEO improvement you make now **compounds over time**. The earlier you start, the sooner results arrive.
          subtitle: Patience is part of the process
        - type: text
          title: Submit your sitemap to Google
          content:
            body: |-
              You can **speed things up** by submitting your sitemap through [Google Search Console](https://search.google.com/search-console). A **sitemap** is a file that lists all the pages on your website, making it easier for search engines to find and index them.

              Lovable doesn't always create a sitemap up front, so don't assume you have one. The **SEO & AI search** review from two steps ago checks for it, and can generate or repair it in one click. Publish your latest changes before you click **Try to fix** on the sitemap step, because Google fetches the sitemap from your live site, not from your editor.

              The review can also walk you through connecting Google Search Console and submitting the sitemap for you. If you'd rather do that part yourself:

              1. Open [Google Search Console](https://search.google.com/search-console) and select your property (the domain you verified in *Challenge 2*)
              2. Click **Sitemaps** in the left menu
              3. Enter your **sitemap URL**, usually `https://yourdomain.com/sitemap.xml`
              4. Click **Submit**

              This nudges Google to notice your site sooner rather than waiting for it to discover you on its own.
            imageUrl: /courses/lovable-publishing-00/sitemap.webp
          subtitle: Help Google find your pages faster
        - type: text
          title: 'GEO: Being found by AI tools'
          content:
            body: |-
              **GEO** stands for Generative Engine Optimisation. It's a newer concept that focuses on making your product discoverable by AI tools like ChatGPT, Perplexity, and Google's AI Overview.

              When someone asks an AI assistant *"what's a good tool for organising book clubs?"*, the AI draws from information it has found online. To increase your chances of being mentioned:

              - **Have a clear, descriptive homepage** that explains what your product does and who it's for
              - **Create helpful content** like a blog post or FAQ page that answers questions your target users might ask
              - **Get mentioned on other websites** (more on this in a moment)

              GEO and SEO overlap a lot. The same practices that help search engines understand your product also help AI tools recommend it.
          subtitle: The new frontier of discoverability
        - type: text
          title: Register your business on Google
          content:
            body: |-
              If your product serves a local community or has a physical business location, registering on [Google Business Profile](https://business.google.com/) can boost your discoverability.

              Even if your product is fully online, **having a Google Business Profile can help** because:
              - It makes your business **appear in Google Maps and local search results**
              - It **adds credibility** (Google shows your business info in search results)
              - It gives you another place to **collect reviews** (which can improve your SEO and attract more users)

              Not every product needs this, but if yours has any local component (like a local book club organiser, a neighbourhood service, or a business with a physical address), it's worth the few minutes to set up.
          subtitle: Boost local discoverability
        - type: text
          title: 'Backlinks: getting other sites to link to you'
          content:
            body: |-
              **Backlinks** are links from other websites that point to yours. Search engines treat them as votes of confidence. The more quality backlinks you have, the higher you'll rank.

              **How to start building backlinks:**
              - **List your product on directories** like Product Hunt, Indie Hackers, or niche directories for your industry
              - **Write a guest blog post** for a site that your target users read
              - **Ask partners or collaborators** to link to your product from their website
              - **Create something worth linking to**, like a useful guide, a free tool, or an interesting case study

              Backlink building is a long-term effort, but even a few quality links help.
          subtitle: Votes of confidence from around the web
        - type: quiz-question
          title: 'Quiz: SEO timing'
          content:
            question: After publishing and optimising your app for SEO, how long does it typically take to appear in Google search results?
            options:
              - Immediately, within seconds of publishing
              - Within 24 hours
              - Between a few hours and a few days
              - Usually a few weeks, sometimes longer in competitive spaces
            correctAnswer: 3
            explanation: SEO takes patience. Search engines need time to discover, crawl, and index your website. It typically takes a few weeks, and in competitive spaces it can take months. Submitting your sitemap through Google Search Console can help speed things up.
        - type: quiz-question
          title: 'Quiz: Backlinks'
          content:
            question: What are backlinks, and why do they help with SEO?
            options:
              - Links within your own website that connect your pages together
              - Links from other websites to yours that search engines treat as votes of confidence
              - Links in your footer that point to legal pages, social media profiles, and contact information
              - Links from Google Ads to your website
            correctAnswer: 1
            explanation: Backlinks are links from external websites pointing to yours. Search engines like Google use them as a signal that your content is valuable and trustworthy, which helps improve your search ranking.
        - type: reflection
          title: 'Your turn: Plan your backlink strategy'
          content:
            description: |-
              Think about where your target users spend time online. Where could you share your product or write about it to earn backlinks?

              Consider:
              - Which **online communities** (Reddit, Facebook groups, Slack groups, forums) are your target users active in?
              - Which **blogs or websites** would be a good fit for a guest post about your product or the problem it solves?
              - Which **product directories** (like Product Hunt, Indie Hackers, or niche directories for your industry) could you list on?

              Write down at least three specific places where you could share your product.
            placeholder: |-
              Communities my users are in:

              Blogs or websites I could write for:

              Directories I'll list on:
            subDescription: Having a concrete list of places to share your product is more valuable than a vague plan to "do marketing." You can start with one and build from there.
        - type: challenge-end
          title: 'People can start finding you! 🔍'
          content:
            nextModule: "**Next challenge:** People are starting to find your product. But how many? And what do they do when they get there? In the next challenge, you'll set up analytics and learn how to get feedback that actually helps you improve."
            description: You've laid the foundation for being discovered online.
            subDescription: |-
              You've done a lot in this challenge:

              - You now know how to optimise your pages for search engines with meta tags, heading tags, and alt text, and how to let Lovable's free SEO & AI search review find what you missed
              - You've submitted your sitemap to Google Search Console
              - Learned how AI tools discover products through GEO 
              - You have a plan for building backlinks in communities where your users spend time

              These aren't one-time tasks, but you've started building the habits that will make your product more discoverable over time.

              **Toolkit:** The [SEO and Discoverability Quick-Start Checklist](https://littleparrot.app/nest/toolkit/aceb0958-b112-4abc-8710-5d49e8b60c8b) has every step from this challenge as a tick-box list you can work through at your own pace.

    - title: 'Know Your Users: Metrics, Feedback, and Distribution'
      isFree: false
      skills:
        - Metrics
        - Google Analytics
        - User Feedback
        - Distribution
      description: Find out who's using your product, what they do with it, and how to reach more people like them.
      completionTime: '8:00'
      steps:
        - type: text
          title: Why metrics are essential for growth
          content:
            body: |-
              You've published your product, set up a domain, and started working on discoverability. But here's a question: **do you know what's actually happening?**

              Are people visiting? Which pages do they look at? Where do they drop off? What features do they use most?

              Without data, you're guessing. With data, you're making informed decisions about what to build next, what to fix, and where to focus your energy.

              Tracking doesn't need to be complicated. A few basic metrics can tell you a lot.
          subtitle: Stop guessing, start knowing
        - type: text
          title: Built-in Lovable metrics
          content:
            body: |-
              Lovable provides **built-in metrics** for your published app.

              **To find them:**
              1. Open your project in Lovable
              2. Open the **More** tab in the toolbar at the top
              3. Select **Analytics**

              These metrics **give you a basic picture** of:
              - **How many** people visit your app, and how many are on it right now
              - **Where** they come from (referral source)
              - **Which pages** they visit
              - **Which country** they're in
              - **What device** they're using
              - **How many leave** after seeing only one page (your bounce rate)

              This only works for published apps, and it relies on a setting called **Visitor analytics** in **Project settings → General → Publishing**. It's on by default, so you shouldn't need to touch it. If your dashboard is stubbornly empty, that's the first place to look.

              This is a great starting point. For most early-stage products, built-in metrics are enough to understand whether people are using your app and how often.

              Check your metrics regularly. Even a quick weekly glance helps you spot trends and notice if something changes unexpectedly.
          subtitle: What's already available
        - type: text
          title: Why add Google Analytics?
          content:
            body: |-
              For more detailed insights, you can add **Google Analytics** to your app. It's free and gives you data about:
              - **Where your visitors come from** (search, social media, direct links)
              - **Which pages** they visit and how long they stay
              - **What devices and browsers** they use
              - **Where they drop off** in your user flow

              Lovable's built-in metrics are great for a quick overview, but Google Analytics lets you dig deeper. It's especially useful once you start sharing your product more widely and want to understand which channels bring the most users, and where they leave your site.
          subtitle: Going beyond built-in metrics
        - type: text
          title: How to set up Google Analytics
          content:
            body: |-
              **To set it up:**
              1. Create a free account at [analytics.google.com](https://analytics.google.com/)
              2. Click **Admin** (gear icon at the bottom-left), then click **Create** and select **Property**
              3. Give your property a **name** (e.g., "Book Club Organiser"), select your country and time zone, then click through the setup steps
              4. When asked to choose a platform, select **Web**, enter your app's URL, and give your stream a name
              5. Google will show you a **Measurement ID** that starts with `G-` (e.g., `G-ABC123XYZ`). Copy it.
              6. Back **in Lovable**, prompt: `"Add Google Analytics with Measurement ID G-ABC123XYZ to the app"` (replacing with your actual ID)

              Lovable will add the tracking code to your app. After publishing, data will start appearing in your Google Analytics dashboard within a few hours.

              **Remember:** If you add Google Analytics and have users in the EU or UK, make sure you have a cookie banner (*Challenge 3* covered this).
          subtitle: A step-by-step walkthrough
        - type: text
          title: What to track early on (and what to ignore)
          content:
            body: |-
              It's tempting to get lost in dashboards and numbers. Here's what you could **track** when you're starting out:

              - **Active users:** Are people coming back, or do they visit once and leave?
              - **Traffic sources:** How are people finding you? This tells you where to focus your marketing efforts.
              - **Key actions:** Are users completing the main action your app is designed for? (For Dalmie, that's adding book suggestions and voting.)
              - **Where people leave:** Is your value proposition clear, or are people leaving immediately?

              *Ignore these (for now):*
              - Detailed demographic breakdowns (not useful until you have more visitors)
              - Vanity metrics like total page views without context

              The point isn't to track everything. It's to **find the signals that help you make better decisions.**
          subtitle: Focus on what helps you decide
        - type: text
          title: How to ask users for feedback
          content:
            body: |-
              Analytics tell you **what** people do. Feedback tells you **why**.

              The best feedback comes from real conversations. Here's how to ask without being annoying:

              **Ask specific questions, not generic ones:**
              - Instead of "What do you think?" try *"What's the one thing you'd change?"*
              - Instead of "Is it good?" try *"What frustrated you when you used it?"*
              - Instead of "Any feedback?" try *"What did you try to do that didn't work?"*

              **Ways to collect feedback:**
              - Have a short conversation (in person or video call) with 3-5 users
              - Add a simple feedback form or link in your app
              - Watch someone use your app without guiding them (resist the urge to explain or help, even if they get stuck)

              Every piece of feedback is a gift. It tells you what to change and what to build next.
          subtitle: The "why" behind the numbers
        - type: text
          title: Distribution channels to reach more people
          content:
            body: |-
              Your product won't grow on its own. You need to actively share it where your target users spend time.

              Here are some **distribution channels** to consider:
              - **Social media:** Share your product story on LinkedIn, X, Instagram, or Facebook groups
              - **Online communities:** Post in relevant forums, subreddits, or Slack groups
              - **Product directories:** List on Product Hunt, Indie Hackers, BetaList or niche directories
              - **Email:** If you have a mailing list, share updates and invite people to try your product
              - **Partnerships:** Collaborate with complementary products or creators

              Don't try all of these at once. Pick one or two channels where your target users are most active, and focus your energy there. Share your product, ask for feedback, and listen to what people say. Then iterate based on what you learn.
          subtitle: Where to share your product
        - type: quiz-question
          title: 'Quiz: Analytics'
          content:
            question: Which metric is most useful for an early-stage product?
            options:
              - Total page views
              - Detailed demographic breakdowns
              - Whether users are completing the main action your app is designed for
              - Average time on page for every individual page
            correctAnswer: 2
            explanation: Early on, the most important thing to know is whether users are doing the thing your app was built for. Are they adding book suggestions? Voting? Completing the core action? This tells you whether your product is delivering value.
        - type: quiz-question
          title: 'Quiz: User feedback'
          content:
            question: 'What''s a more effective way to ask for feedback than "What do you think?"'
            options:
              - "What's the one thing you'd change?"
              - 'Do you like it?'
              - 'Is it good enough?'
              - 'Would you recommend it?'
            correctAnswer: 0
            explanation: Specific questions get specific answers. "What's the one thing you'd change?" gives you actionable feedback. Broad questions like "What do you think?", or leading questions like "Is it good enough?" often result in polite but unhelpful responses like "It's nice!"
        - type: reflection
          title: 'Your turn: Plan a feedback conversation'
          content:
            description: |-
              Stop for a moment and think about what you'll ask users when you talk to them about your product. 

              What do you want to learn from them? What questions will help you get that information?
            placeholder: |-
              I'll ask users these questions:
            subDescription: Remember, ask specific, open-ended questions that will give you actionable insights, not just general opinions.
        - type: challenge-end
          title: "You know what's happening with your product! 📊"
          content:
            nextModule: "**Next challenge:** You've got a live product, people can find it, and you know what they're doing. So what separates a side project from a product that keeps growing? In the final challenge, you'll learn the mindset and habits that keep the momentum going."
            description: You can now track usage and gather meaningful feedback.
            subDescription: |-
              You've set yourself up to understand what's really happening with your product:

              - You know where to find **Lovable's built-in metrics** for a quick overview of visits and traffic
              - You've learned how to add **Google Analytics** for deeper insights into where users come from and where they drop off
              - You know **what to track** early on (and what to ignore so you don't get overwhelmed)
              - You have **specific feedback questions** ready that will give you actionable answers, not polite "it's nice" responses
              - You've identified **distribution channels** where your target users spend time

              You're no longer building in the dark. From here, every decision you make can be backed by real data and real conversations.

              **Toolkit:** The [User Feedback Question Bank](https://littleparrot.app/nest/toolkit/ab78ba0e-37bb-4c6c-b21b-a7466df4b19d) has a full collection of questions organised by what you want to learn, plus tips on spotting patterns across conversations.

    - title: 'Launch Early, Grow Steadily'
      isFree: false
      skills:
        - Agile Development
        - Launch Strategy
        - Scaling
        - Production Checklist
      description: Adopt the mindset and habits that turn a side project into a growing product.
      completionTime: '10:00'
      steps:
        - type: text
          title: 'The case for launching "before you''re ready"'
          content:
            body: |-
              If you've been waiting for your product to be "done" before sharing it widely, here's a perspective shift: **your product will never feel done**. The apps you use every day, from Instagram to Google Maps, are constantly updated. "Done" doesn't exist in the world of digital products.

              **Launching early means:**
              - You **learn** from real users sooner
              - You **avoid** building features nobody wants
              - You **build** momentum instead of staying stuck in "almost ready" mode

              There's a famous quote from Reid Hoffman, the co-founder of LinkedIn: *"If you're not embarrassed by the first version of your product, you've launched too late."*

              This doesn't mean shipping broken software. It means **shipping the smallest possible piece of your product that can deliver core user value**. Then getting this limited scope into users' hands to validate whether it's valuable for them.

              *Want to dig deeper into this idea? Our article [The Dilemma of the MVP](https://productkind.substack.com/p/the-dilemma-of-the-mvp) explores how to decide what's "enough" to launch. And if you need help slicing out an Minimum Viable Product from your idea, our [Plan Your Vibe Coded App](https://littleparrot.app/e16d932e-ac1f-4514-b5da-42629acf39ae/course-overview) course walks you through it step by step.*
          subtitle: Perfect is the enemy of launched
        - type: text
          title: 'How Buffer launched with almost nothing'
          content:
            body: |-
              **Buffer**, the social media scheduling tool used by millions, started with a landing page and nothing else.

              The founder, *Joel Gascoigne*, created a simple page that described what Buffer would do and had a "Plans and Pricing" button. When people clicked, they saw a message: "We're not quite ready yet. Leave your email and we'll let you know when we launch."

              That was the entire product. A landing page and an email signup form.

              But it answered the most important question: **do people actually want this?** Enough people signed up that Joel knew it was worth building. He then created a basic version, launched it to those email subscribers, and grew from there.

              The lesson? **You don't need everything figured out before you launch.** You need enough to test whether people are interested. Start small, learn fast, and grow from there.
            imageUrl: /courses/lovable-publishing-00/buffer-mvp.webp
          subtitle: A real-world example of launching lean
        - type: text
          title: 'Agile development: what it means for solo builders'
          content:
            body: |-
              **Agile development** is a way of building software in short cycles instead of one big push. For solo builders, the core idea is:

              1. **Build** one small feature or improvement
              2. **Measure** whether it works (check your analytics, test with users)
              3. **Learn** from user feedback (did users engage with it? Did they find it valuable?)
              4. **Repeat** with the next most important thing (either improving the same feature or building something new)

              This cycle keeps you from spending a lot of time building something your users won't use. It also helps you move forward without getting overwhelmed. Instead of planning months of features, you focus on the **next small step**. You build, see if it works, learn from it, and then decide what to do next. This way, you're always **building based on real user needs and feedback, not assumptions**.
          subtitle: Build, measure, learn, repeat
        - type: text
          title: Scaling with Lovable
          content:
            body: |-
              As your product grows, you might wonder: **can Lovable handle more users?**

              For most products, the answer is yes. Lovable apps are hosted on infrastructure designed to handle growth. Lovable Cloud automatically scales your backend (database, authentication, storage) as your usage increases.

              **One thing to watch: the 512MB deployment limit.**

              Lovable has a hard limit of 512MB on the project size for deployment. You're unlikely to hit this with code and normal assets, but you might run into it if you store large files directly in your project, like MP4 videos, many GIFs, or high-resolution images.

              **If you're approaching this limit:**
              - Host large videos on platforms like YouTube or Vimeo and embed them
              - Use an image hosting service for large image collections
              - Compress images before adding them to your project

              For most products, this limit won't be a concern. But it's good to know about before it surprises you.
          subtitle: What to know as your user base grows
        - type: text
          title: Your production-ready checklist
          content:
            body: |-
              Here's everything you've learned in this course, collected into one checklist. Use it every time you prepare a product for launch:

              **Before publishing:**
              - ☐ Switch to production API keys
              - ☐ Upload your own favicon, if you'd rather not use the generated one
              - ☐ Check your meta tags (title, description, social image) and change anything that's off
              - ☐ Check the Social and Search cards on your main pages
              - ☐ Check your app on mobile and desktop (use the device toggle in Lovable's preview, and test on your own phone after publishing)

              **Professional touches:**
              - ☐ Connect a custom domain
              - ☐ Set up Google site verification
              - ☐ Add privacy policy and terms of use
              - ☐ Add footer links to legal pages
              - ☐ Add a cookie banner (if needed)

              **Discoverability:**
              - ☐ Run the SEO & AI search review and work through the failing findings
              - ☐ Upgrade to TanStack Start, if your app predates May 2026
              - ☐ Submit sitemap to Google Search Console
              - ☐ Register on Google Business Profile (if relevant)
              - ☐ List on at least one product directory

              **Growth:**
              - ☐ Set up analytics (built-in + Google Analytics)
              - ☐ Plan your first feedback conversation
              - ☐ Choose one distribution channel to focus on

              **Toolkit:** This checklist is also available as the [Production-Ready Launch Checklist](https://littleparrot.app/nest/toolkit/5066c12c-66ad-4844-a768-1bdae81c86ec) in your Toolkit, with detailed instructions for each step. Save it and come back to it whenever you launch something new.
          subtitle: Everything in one place
        - type: quiz-question
          title: 'Quiz: Launching early'
          content:
            question: Why is it better to launch early than to wait until your product feels "done"?
            options:
              - It's not better; you should always wait until your product is perfect before launching
              - Because you learn from real users sooner and avoid building features nobody wants
              - Because Lovable gives you more credits for launching quickly
              - Because search engines rank new products higher
            correctAnswer: 1
            explanation: Launching early lets you learn from real users before investing too much time in features that might not be important. You can always improve based on what you learn. The longer you wait for "perfect," the more time you risk spending on the wrong things. Until you get real user feedback on your product, everything you think you know is just an assumption.
        - type: quiz-question
          title: 'Quiz: The agile cycle'
          content:
            question: What is the core cycle of agile development for solo builders?
            options:
              - Plan everything, build everything, launch once
              - Write detailed specifications, then hand them to AI
              - Build fast, ignore feedback, add more features
              - Build one thing, measure the result, learn from it, repeat
            correctAnswer: 3
            explanation: The agile cycle for solo builders is "build, measure, learn, repeat." You build one small feature, check if it works, learn from the result, and then decide what to do next. This keeps you moving forward without getting overwhelmed.
        - type: reflection
          title: 'Your turn: Get ready to launch and grow'
          content:
            description: |-
              Think about this:

              What's the one thing holding you back from launching (or growing) right now?
            placeholder: |-
