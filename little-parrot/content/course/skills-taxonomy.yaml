# Little Parrot skills taxonomy
#
# Two axes, deliberately kept apart:
#   skill    - what a learner can do. Drives skip logic and ordering. Closed list.
#   scenario - the use case a block is written around. Drives niche targeting. Open list.
# The old `skills:` field in the course YAMLs mixed these, which is why it grew to
# 168 distinct tags across 55 challenges with no two blocks agreeing on anything.
#
# block kinds:
#   core    - tool skill, no use case baked in. Shared across paths. One canonical copy.
#   applied - same skill, specific scenario. Authored per niche.
#   frame   - opening or closing of a path (comics, promise, wrap-up). Never shared.
#   mixed   - currently frame + core in one challenge. Split candidate.

version: 1
updated: 2026-09-19

domains:
  ai: Working with AI itself, independent of any one tool
  build: Building an app with an AI app builder
  soft: Software literacy, the vocabulary to describe what you want
  debug: Finding and fixing what went wrong
  workspace: Editing your app outside the app builder
  product: Deciding what to build
  launch: Getting a product in front of people
  biz: Turning a product into a business
  auto: Personal automation on your phone

skills:
  - id: ai.how-models-work
    domain: ai
    name: How AI models work
    description: What a model is, tokens, training, why it makes things up.
  - id: ai.prompt-craft
    domain: ai
    name: Writing a good prompt
    description: Structure, context, specificity, and refining with follow-ups.
  - id: ai.tone-and-voice
    domain: ai
    name: Getting AI to match a voice
    description: Steering tone and style so the output sounds like the person, not a robot.
  - id: ai.agents
    domain: ai
    name: Working with an AI agent
    description: What an agent does differently to a chat assistant, and how to review its work.

  - id: build.prompt-to-app
    domain: build
    name: Describing an app and refining it
    description: Turning an idea into a first build, then improving it with focused follow-ups.
  - id: build.refine-visually
    domain: build
    name: Making targeted changes visually
    description: Preview, device views, the preview toolbar, attaching images as reference.
  - id: build.versioning
    domain: build
    name: Undoing safely
    description: Version history, bookmarking a working version, reverting, comparing versions.
  - id: build.context-and-planning
    domain: build
    name: Planning before building
    description: Plan mode, project knowledge, giving the builder lasting context.
  - id: build.data-and-services
    domain: build
    name: Connecting data and services
    description: Backend, database approval, login, API keys and external services.
  - id: build.publish
    domain: build
    name: Publishing an app
    description: Preview versus production, subdomain, favicon, meta tags, going live.

  - id: soft.app-anatomy
    domain: soft
    name: What an app is made of
    description: Frontend, backend, database, infrastructure and how they fit together.
  - id: soft.design-vocabulary
    domain: soft
    name: Describing how it should look
    description: Wireframes, design systems, colour, type, spacing.
  - id: soft.frontend
    domain: soft
    name: How screens are built
    description: Components, layout, semantic structure.
  - id: soft.backend
    domain: soft
    name: What happens behind the screen
    description: APIs, authentication, the work an app does out of sight.
  - id: soft.databases
    domain: soft
    name: How an app remembers things
    description: Tables, relationships, data types, queries.

  - id: debug.fundamentals
    domain: debug
    name: Reading a bug calmly
    description: What a bug is, the common types, and the mindset that keeps you moving.
  - id: debug.prevention
    domain: debug
    name: Preventing bugs
    description: Small prompts, testing after every change, bookmarking before anything risky.
  - id: debug.investigation
    domain: debug
    name: Investigating a bug
    description: Logs, network requests, status codes, reproducing the problem, checking the data.
  - id: debug.fix-loops
    domain: debug
    name: Escaping a fix-break-fix loop
    description: Knowing when to stop asking, isolate, compare versions, or rebuild the feature.
  - id: debug.security
    domain: debug
    name: Handling security warnings
    description: Reading a security warning, row level security, auth safety, deciding what matters.

  - id: workspace.version-control
    domain: workspace
    name: Version control and GitHub
    description: Repositories, commits, pushing, and keeping the builder and your computer in sync.
  - id: workspace.local-setup
    domain: workspace
    name: Running a project on your own computer
    description: Installing the editor and tools, cloning a project, installing and running it.
  - id: workspace.edit-code
    domain: workspace
    name: Editing code by hand
    description: Finding the right file, changing it, and seeing the change live.
  - id: workspace.coding-agent
    domain: workspace
    name: Using a coding agent
    description: Giving an agent a task in your own project, reviewing its diff, undoing it.

  - id: product.problem-and-user
    domain: product
    name: Defining the problem and who has it
    description: A problem statement grounded in a real need, and the person you are building for.
  - id: product.journey
    domain: product
    name: Mapping the journey
    description: Storyboarding what the user does to get unstuck, then breaking it into buildable steps.
  - id: product.mvp
    domain: product
    name: Scoping a first version
    description: Choosing the smallest set of features worth building now.
  - id: product.user-research
    domain: product
    name: Testing an idea with people
    description: Planning and running a test of something before you commit to building it.

  - id: launch.domain
    domain: launch
    name: Choosing and connecting a domain
    description: Picking a name, weighing the extension, buying it, pointing it at your product.
  - id: launch.legal
    domain: launch
    name: Legal pages
    description: Privacy policy, terms, cookie banner, and what a small product actually needs.
  - id: launch.seo
    domain: launch
    name: Being found
    description: Search and AI discoverability, listings, links in.
  - id: launch.analytics
    domain: launch
    name: Measuring what people do
    description: Installing analytics, choosing events, reading them without drowning.
  - id: launch.user-feedback
    domain: launch
    name: Feedback from real users
    description: Asking live users well, building a feedback route in, collecting testimonials.
  - id: launch.reach-users
    domain: launch
    name: Getting people to your product
    description: Directories, communities, email capture, and staying in touch with visitors.

  - id: biz.value-proposition
    domain: biz
    name: Saying what your product is worth
    description: One sentence of value, tested on real people.
  - id: biz.pricing
    domain: biz
    name: Deciding what to charge
    description: Pricing models and the psychology behind a number.
  - id: biz.ship-steadily
    domain: biz
    name: Launching early and shipping steadily
    description: Releasing before it feels ready, working in small cycles, growing the product over time.
  - id: biz.money
    domain: biz
    name: Knowing your numbers
    description: Break-even, taking payment, keeping money separate, the legal basics of a small business.

  - id: auto.build-shortcut
    domain: auto
    name: Building a phone shortcut
    description: Assembling actions into a working shortcut that calls an AI model.
  - id: auto.shortcut-triggers
    domain: auto
    name: Running a shortcut hands-free
    description: Voice, back tap, action button, automations.
  - id: auto.notes-and-sharing
    domain: auto
    name: Getting the output to other people
    description: Notes, sharing across platforms, making the result usable by someone else.

