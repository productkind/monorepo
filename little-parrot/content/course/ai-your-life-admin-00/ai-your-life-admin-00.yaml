course:
  id: 05900334-0998-4a98-be6d-946653c9b82d
  note: |-
    *This course needs an iPhone with Apple Intelligence (iPhone 15 Pro or 15 Pro Max, any iPhone 16 or newer). Everything runs free, with no subscription and nothing to install.*
  cover: /courses/ai-your-life-admin-00/cover.gif
  title: "Hand Off the Mental Load: Use AI to Turn a Brain Dump into a List"
  learningOutcomes:
    - Build a voice shortcut that sorts everything on your mind into categorised checklists your partner can see and tick off
    - Adapt a ready-made prompt so the AI sorts and formats what you say your way
    - Build a second shortcut that logs your baby's feed, nappy, nap or weight as a timestamped line in one running note
    - Trigger either shortcut hands-free, by voice, a tap on the back of your phone, or the Action Button
    - Reuse the same pattern, talk, let AI sort it, save it, for the next job you'd like your phone to take off you
  challenges:
    - title: The Brain Dump
      isFree: true
      skills:
        - iPhone Shortcuts
        - AI Prompting
        - Voice Capture
      description: Build a shortcut that takes a spoken brain dump and sorts it into organised category checklists you can tick off.
      completionTime: '06:00'
      steps:
        - type: comic
          content:
            imageUrl: /comics/ai-your-life-admin-00/panel-00.png
            altText: |-
              A dalmatian dog (called Dalmie) stands in a cluttered kitchen with a baby asleep in a
              sling on her chest. She holds her phone in one hand. Sticky notes and a swirl of thought
              bubbles float around her head: "dentist", "out of nappies", "call Mum", "6-week check".
              She looks overwhelmed.
        - type: comic
          content:
            imageUrl: /comics/ai-your-life-admin-00/panel-01.png
            altText: |-
              A dim, late-night scene. Dalmie sits in an armchair feeding the baby, both arms full. A
              single thought bubble above her reads, "I must book the 6-week check!" Her phone and a
              pen sit on a table just out of reach.
        - type: comic
          content:
            imageUrl: /comics/ai-your-life-admin-00/panel-02.png
            altText: |-
              Morning light. Dalmie looks at her phone with a flat, deflated expression. The thought
              bubble from the night before is now empty and fading. She says quietly, "I forgot
              again..."
        - type: comic
          content:
            imageUrl: /comics/ai-your-life-admin-00/panel-03.png
            altText: |-
              A brightly coloured bird (called Little Parrot) flutters in cheerfully beside Dalmie.
              Little Parrot says, "What if you could get the mental load out of your head, and into
              an organised list on your phone just by talking about it?" Dalmie looks up, hopeful for the first time.
        - type: video
          title: Hand the mental load to your phone
          content:
            videoRemotionId: lesson-ai-your-life-admin-00-video-00
            vimeoId: ''
            youtubeId: ''
            transcript: |-
              If you're a mum, you already know the feeling. There's a **running list in your head that never switches off**. You've got more things to do, but way less time. And most of the time, both of your hands are full.

              **Your phone can take that list off you and sort each piece into your notes, where it belongs.** It does that with a **shortcut you build once**, rather than a fiddly system you have to keep tending to.

              In this course you'll build **two** shortcuts. The first lets you **talk** about everything on your mind, and your phone uses AI to sort it into tidy checklists you can **share with your partner**, so the mental load is out of your head and where someone else can help carry it. The second lets you **log the things you need to keep track of**: how much your baby fed, the nappies, the naps, their weight, and saves each as a line with date and time in a running record.

              You'll become someone who **offloads the mental load by voice**, in the seconds you have. Let's build the first one.
        - type: text
          title: "See what you'll build"
          subtitle: The finished thing, first
          content:
            body: |-
              Before you build it, here's your **Brain Dump** in action. Dalmie taps hers and rambles through everything on her mind:

              *"Right, we're out of nappies, wipes and barrier cream, I keep meaning to book the six-week check, the health visitor's coming Tuesday at eleven, and the car really needs a wash. Oh, and we need to buy bananas!"*

              A few seconds later, it's sorted into her category notes, each item a tickable checklist line:

              **Logistics**
              - [ ] Book six week check
              - [ ] Health visitor Tuesday at 11
              
              **Food & Household**
              - [ ] Buy bananas
              - [ ] Out of nappies
              - [ ] Out of wipes
              - [ ] Out of barrier cream

              **Misc**
              - [ ] Car really needs a wash

              She didn't sort a thing, and she didn't open a single app. That's what you'll build next, no coding required, and you'll set up sharing it with your partner automatically, so **you won't have to carry the mental load alone**.
            imageUrl: /courses/ai-your-life-admin-00/sorted-result.webp
        - type: text
          title: What you'll need
          subtitle: Not much, honestly
          content:
            body: |-
              There's **nothing to buy and nothing to download**. You build everything in the **Shortcuts** app that's already on your iPhone, by tapping a few blocks together. You don't need to be techy: you follow along one step at a time, and each step tells you exactly what to tap.

              This uses **Apple Intelligence**, Apple's built-in AI, so you'll need an **iPhone 15 Pro or 15 Pro Max, any iPhone 16 or newer, or an iPhone Air**. It's free, with no subscription.

              *Not sure which iPhone you have?* Open **Settings**, tap **General**, then **About**, and look at **Model Name** near the top.
            imageUrl: /courses/ai-your-life-admin-00/shortcut-logo.webp
        - type: text
          title: "Turn on Apple Intelligence"
          subtitle: A one-time setup
          content:
            body: |-
              Your shortcut uses **Apple Intelligence**, Apple's own built-in AI. It's free, with no account and nothing to install. You switch it on once:

              1. Open **Settings**
              2. Tap **Apple Intelligence & Siri**
              3. Turn on **Apple Intelligence**

              *(Apple Intelligence needs to be available in your country and language.)*
            imageUrl: /courses/ai-your-life-admin-00/turn-on-apple-intelligence.webp
        - type: text
          title: "Build it: make your category notes"
          subtitle: One folder, three notes
          content:
            body: |-
              Your shortcut sorts what you say into categories, and each one needs its own note to land in. You'll start with three: **Logistics**, **Food & Household**, and **Misc** (a catch-all for anything that doesn't fit). Create them now:

              1. Open the **Notes** app and make a new folder called **Mental Load**.
              2. Inside it, make one note per category, with each note's first line the category name, exactly as written: **Logistics**, **Food & Household**, and **Misc**.

              You'll use these same three names as your categories in the prompt in a moment, and pick each note as you build, so keep them consistent.

              *Would one list be enough for you?* If you'd rather everything land in a single note than be sorted into three, the [Brain Dump into a Single List](https://littleparrot.app/nest/toolkit/62797a30-4043-4875-96e0-d8efa631a455) guide in the Toolkit is a quicker build.
            imageUrl: /courses/ai-your-life-admin-00/make-folder-and-notes.webp
        - type: text
          title: "Build it: share the folder"
          subtitle: So your partner sees it too
          content:
            body: |-
              This is what makes the mental load a *shared* one: your partner sees the same lists, and can tick things off.

              If your partner has an iPhone, **share the folder now**, so it's done: long-press the **Mental Load** folder, tap **Share Folder**, and invite them by **Messages** or **Mail**. From then on, everything your Brain Dump sorts shows up on their phone too, no extra step.

              If your partner is on **Android**, no problem: skip the sharing for now, and in a later challenge you'll set up a way to send them the list instead.
            imageUrl: /courses/ai-your-life-admin-00/share-folder.webp
        - type: text
          title: "Build it: catch what you say"
          subtitle: The block that captures your words
          content:
            body: |-
              Open the **Shortcuts** app and tap the **+** to start a new shortcut. Now add your first action:

              1. Search for **Dictate Text** and add it. This is the bit that transcribes what you say.
              2. Tap the blue arrow on the action to open its settings: pick your **Language**, and set **Stop Listening** to **On Tap**, so it keeps listening through your pauses and waits until you tap the **stop** button (⏹️).

              *Talk in your own language:* whatever you pick under **Language** is what it listens in. If it's not English, you can add a line to your prompt later asking the AI to reply in that language too, or just write the prompt in that language.
            imageUrl: /courses/ai-your-life-admin-00/build-dictate-text.webp
        - type: text
          title: "Build it: hand it to Apple's model"
          subtitle: The block that sorts
          content:
            body: |-
              Under *Dictate Text*, add the block that does the sorting:

              1. Search for **Use Model** and add it. Tap the model and choose **Cloud (Private Cloud Compute)**.
              2. Tap the blue arrow to open its settings, and set the **Output** to **Dictionary**, so the answer comes back as your labelled categories.

              **Why this one and not ChatGPT?** 
              
              *Private Cloud Compute* is Apple's own AI, already built into your phone. There's nothing to set up and no account to make. It keeps your brain dump private, instead of sending it to another company. And it hands your shortcut a clean, sorted answer nearly every time. It runs on Apple's servers, so you'll need to be online.
            imageUrl: /courses/ai-your-life-admin-00/build-use-model.webp
        - type: text
          title: "Build it: copy your prompt"
          subtitle: Your instruction to the AI
          content:
            body: |-
              Next comes the **prompt**: the instruction you give the AI. This one tells it to sort whatever you say into the **same three categories as your notes**: *Logistics*, *Food & Household*, and *Misc*. You can reword it or add your own categories later, as long as your notes use the same names.
              
              Copy it now:

              ```
              Sort what I say into a dictionary with exactly these keys: Logistics, Food & Household, Misc.

              - Food & Household: anything to buy, get, or restock, including food, drink, and household supplies.
              - Logistics: appointments, bookings, and calls to make (not shopping).
              - Misc: anything that doesn't fit the other two.

              Each value is a list, one item per entry. Trim filler words, but keep the details that make each item make sense on its own later: what it is, why, and any time or day. Don't add anything I didn't say.

              Here is what I said:
              
              ```

              Your shortcut will drop **what you said** in under that last line. You don't type a word.
        - type: text
          title: "Build it: paste your prompt in"
          subtitle: Where your words go
          content:
            body: |-
              Now give **Use Model** your prompt. When you added it, its text box already picked up a blue **Dictated Text** chip. That chip is a **variable**, a placeholder the shortcut fills in with your words each time you run it. You want your prompt to come first, so:

              1. Delete the **Dictated Text** chip to clear the box.
              2. **Paste the prompt** you copied earlier. (Lost it off your clipboard? Grab it again from the [Build the Brain Dump Shortcut](https://littleparrot.app/nest/toolkit/6cb7e7a7-af39-4fe7-b985-6a3fc5f6bbd5) guide.)
              3. Tap to add the **Dictated Text** variable back at the very end, after the last line.

              You don't type your words yourself; that chip is how they flow into the prompt.
            imageUrl: /courses/ai-your-life-admin-00/build-paste-prompt.webp
        - type: text
          title: "Build it: route your first category"
          subtitle: Four actions, one category
          content:
            body: |-
              *Deep breath, this is a chunky step, but you've got this!* Build these four actions once, though, and the other two categories are just the same again.

              Now send one category to its note. Add these **four actions in order**, all for **Logistics**:

              1. **Get Dictionary Value**: type **Logistics** as the **Key**, and set the **Dictionary** field to the **Response** (the AI's answer).
              2. **Combine Text**: it takes the **Dictionary Value** from the block above; set it to combine with **New Lines**, so each item sits on its own line.
              3. **If**: set its condition to **Combined Text**, then tap **is** (already on the action) and change it to **has any value**. Delete the **Otherwise** line. This skips a category when you said nothing that belongs to it.
              4. **Append Checklist Item** (drag it in between the **If** and **End If**): put your **Combined Text** in as the **Name**, and tap the **Note** field and pick your **Logistics** note directly. Each line becomes its own tickable checklist item.
            imageUrl: /courses/ai-your-life-admin-00/build-route-category.webp
        - type: text
          title: "Build it: test it to make sure it works"
          subtitle: Easier to check one block than three
          content:
            body: |-
              Before you build the other two blocks, give this one a run. A mistake is far easier to spot in one block than in three.

              1. Tap the **▶️ play button** at the bottom of the editor.
              2. Say one or two **Logistics** things, like *"call the dentist, book a yoga class"*, then tap the **stop** button (⏹️).
              3. Open your **Logistics** note. Your items should be there as checklist lines.

              If they're there, the whole chain works, so you can move to the next step with confidence. If the note stayed empty, check your **Append Checklist Item** points at your **Logistics** note, and that **Get Dictionary Value** reads from **Response**.
            imageUrl: /courses/ai-your-life-admin-00/build-test-first-block.webp
        - type: text
          title: "Build it: do the same for the others"
          subtitle: Repeat the block
          content:
            body: |-
              That block, **Get Dictionary Value → Combine Text → If (Combined Text has any value) → Append Checklist Item**, is the whole pattern. Build it again for your other two categories, where the only thing that changes is the **category name**.

              Here's the **Food & Household** block, action by action:

              1. **Get Dictionary Value**: Get **Value** for **Food & Household** in **Response**.
              2. **Combine Text**: Combine **Dictionary Value** with **New Lines**.
              3. **If**: condition **Combined Text** → **has any value**, and delete the **Otherwise** line.
              4. **Append Checklist Item** (drag it in between the **If** and **End If**): **Combined Text** as the *Name*, and pick your **Food & Household** note.

              Then do the same for **Misc** (its key and its note both **Misc**). Now your shortcut has three blocks, one per category, each the same four actions.
            imageUrl: /courses/ai-your-life-admin-00/build-repeat-categories.webp
        - type: text
          title: "Build it: skip the accidental taps"
          subtitle: So nothing gets saved when you say nothing
          content:
            body: |-
              One safety net before you finish. If you tap the shortcut by accident and don't say anything, the AI will **invent a random list** to fill the categories (it can't leave them empty). Avoid that by wrapping every action in one check:

              1. Add an **If** action. It comes with an **Otherwise** and an **End If**; delete the **Otherwise** line, since nothing needs to happen when you've said nothing.
              2. Drag the **If** up, so it sits right under **Dictate Text**, and set it to **Dictated Text** → **has any value**.
              3. Drag the **End If** down to the very bottom, so every other action ends up **inside** the If.

              *If the End If won't stay at the bottom* and keeps springing back above your last block: add a new action at the very end (a **Combine Text** will do), drag the **End If** to just above it, then delete that extra action. That leaves the End If sitting right at the bottom.

              Now if you tap the shortcut by mistake and don't say anything, nothing gets saved into your notes.
            imageUrl: /courses/ai-your-life-admin-00/build-if-guard.webp
        - type: text
          title: "Build it: name it"
          subtitle: The finish
          content:
            body: |-
              One last touch. Tap the name at the top and rename it something easy to say, like **Brain Dump**. That becomes its **Siri phrase**, the words you'll use to run it in a moment. Tap the **tick** (✓) on the keyboard to save the name.

              That's your first shortcut built. 💫
            imageUrl: /courses/ai-your-life-admin-00/build-finish.webp
        - type: text
          title: "How to run it"
          subtitle: One tap away
          content:
            body: |-
              Put your Brain Dump shortcut one tap away:

              1. While editing your shortcut, tap the **Share** icon at the **bottom** of the screen and choose **Add to Home Screen**. You can give it a **colour** and a **symbol** to make it easy to spot, then tap **Add**. Now it's an icon you tap like any app. 
              2. Tap that icon to start. Talk, pause and think all you like, then tap the **stop** button (⏹️) when you're finished.

              *One thing to know for a long dump:* keep the screen on while you talk, because if it dims and goes black mid-dictation, it won't save your thoughts. Challenge 4 adds other ways to start your dictation.
            imageUrl: /courses/ai-your-life-admin-00/run-the-shortcut.webp
        - type: free-text-exercise
          title: Run it, then ask anything
          content:
            description: |-
              Your turn. Tap your Brain Dump to start it (from your Home Screen, or in the Shortcuts app), and when it starts listening, talk about everything on your mind right now, in any order. A messy ramble is fine, take your time, it keeps listening until you tap the stop button (⏹️). 
              
              Then open your **Mental Load** folder and see everything sorted into tickable checklists.

              If something is not working as you've expected, or doesn't make sense, ask here and you'll get an answer.
            subDescription: Ask anything you're unsure about. And if it worked, tell us how your first brain dump went.
            placeholder: e.g. I got the following error...
            systemPrompt: 'You are a warm, knowledgeable mentor for a new mum taking a course. In this first challenge she builds an iPhone Shortcut called Brain Dump that sorts what she says into category notes, each an Apple Notes checklist. First she makes a Mental Load folder with one note per category, each note first line matching a category exactly: Logistics, Food & Household, Misc. The shortcut is: Dictate Text (Language set, Stop Listening on On Tap so it waits until she taps the stop button (the square)), then Use Model set to Private Cloud Compute with Output set to Dictionary, using a prompt that sorts what she says into a dictionary with keys Logistics, Food & Household, Misc (Misc catches anything that does not fit), with the Dictated Text variable at the end; then, for each category, a block of: Get Dictionary Value (that key, reading from the Response), Combine Text (New Lines), and an If that checks the Combined Text has any value, with an Append Checklist Item inside that If (the checklist item is the Combined Text, and the note is that category''s note, picked directly in the note field, no Find Notes action needed). Everything after Dictate Text is wrapped in an outer If that checks Dictated Text has any value, so an accidental tap with no speech does nothing. She runs it by tapping the shortcut. She may report something not working or ask about any step. Common causes to check for: a category note not made yet, or the wrong note picked in an Append Checklist Item, so items land in the wrong place or nowhere; Apple Intelligence not turned on in Settings under Apple Intelligence & Siri; the Output not set to Dictionary; a Get Dictionary Value reading from the block above instead of the Response (re-point it to Response); a category that came back empty making Append Checklist Item stop and pop up What checklist item name? (that category''s If, Combined Text has any value, is missing or does not wrap the Append); items landing in the wrong category (a sorting call by the model, tweak the prompt or move the item by hand); the model occasionally returning the wrong shape or a brief error, so nothing sorts (doing the dictation again usually fixes it); dictation not catching everything (make sure Stop Listening is On Tap and she taps the stop button (the square)); a random, invented list appearing, which happens when the shortcut runs on an empty dictation and the forced Dictionary output makes the model fill the categories with made-up items (the If wrapper prevents this, so check it is in place and wraps every action). Answer clearly and warmly in British English, in clear, everyday words for someone non-technical, in at most a few short sentences or bullets. If it falls outside the course, gently point her to Kinga and Tamas in the Discord community. Do not use em dashes. End on an encouraging note. Reply in a markdown format.'
            checkerPrompt: 'The learner is asking a question or sharing how their build went. Accept any genuine question, problem description, or comment. Only flag clearly empty or nonsense input. This is their message:'
        - type: challenge-end
          title: "You built your Brain Dump! 🎉"
          content:
            nextModule: "**Next challenge:** You'll make sure these lists reach your partner, whatever phone they carry, so the mental load is not yours alone to carry, you can hand things off."
            description: You built a working iPhone shortcut from scratch, one that automatically turns a brain dump into three categorised lists of what you're carrying.
            subDescription: |-
              Here's what you can do now:

              ✓ Offload what's on your mind in a few seconds, and let your phone do the sorting.

              ✓ Reshape the prompt any time: rename the categories or add your own to fit your life.

              ✓ Reuse the same pattern for anything else you want sorted.

              Want every step in one place to rebuild it later? The [Build the Brain Dump Shortcut](https://littleparrot.app/nest/toolkit/6cb7e7a7-af39-4fe7-b985-6a3fc5f6bbd5) guide has the lot, and [Troubleshooting Your Shortcuts](https://littleparrot.app/nest/toolkit/f969c32b-5325-49a5-91c5-454f5641c1f9) covers anything that misbehaves.
    - title: Share the Load
      isFree: true
      skills:
        - Apple Notes
        - WhatsApp
        - iPhone Shortcuts
      description: Make sure your partner can see your Mental Load lists, whatever phone they're on, so the load is shared and not yours alone.
      completionTime: '04:00'
      steps:
        - type: text
          title: Out of your head, into the open
          subtitle: Share the load
          content:
            body: |-
              The hardest part of the mental load is that it's **invisible**. It sits in your head, so you're the only one who can see it, and you can't hand off what no one else can see.

              Your Brain Dump already turns it into real, sorted lists. If your partner has an iPhone, you shared the **Mental Load** folder in the last challenge.
              
              This short challenge adds a way to reach a partner on **any other phone** too. Whatever phone they carry, they'll get every new item you add automatically, without you having to manually forward anything.
        - type: text
          title: "How it helps Dalmie"
          subtitle: A quick look
          content:
            body: |-
              Dalmie does her brain dump on the sofa while feeding her baby. Her partner receives a message with the new items on the list. He sees three new things under **Food & Household** and picks them up on the way home. She didn't have to tell him, or write a list, and didn't have to remember to ask.

              It's out of her head now, and into a list they can both see and tick things off.
            imageUrl: /courses/ai-your-life-admin-00/whatsapp-message.webp
        - type: text
          title: "Lay out the message"
          subtitle: Structure what you'll send
          content:
            body: |-
              To reach a partner on any phone, send them the lists as a message. We'll show it with **WhatsApp**; almost any messaging app works the same way (more on that next).
              
              You structure the message once in the Shortcut, so it's clear and well organised when sent:

              1. In your **Brain Dump** shortcut, scroll to the bottom.
              2. Add a **Text** action **after** your **Misc** block's **End If**, and just above the very last **End If**, so it sits inside the outer guard but outside every category's own If.
              3. Build the message inside that **Text** action one category at a time. Start with **Logistics**, then **Food & Household** and **Misc**: 
                - type the **bold heading** (single asterisks make it bold in WhatsApp), e.g. ***Logistics***, 
                - start a new line (hit enter), 
                - tap **Select Variable**, 
                - scroll up to *that category's* **Combined Text** (to identify the right one, you'll see the "Get Value for [category]" action above it),
                - tap the blue **Combined Text**. The blocks look alike, so check you're picking the one from the matching category. It should end up like this:

              ```
              *Logistics*
              [your Logistics Combined Text]

              *Food & Household*
              [your Food & Household Combined Text]

              *Misc*
              [your Misc Combined Text]
              ```
            imageUrl: /courses/ai-your-life-admin-00/build-whatsapp-text.webp
        - type: text
          title: "Add the action that sends it"
          subtitle: Sent automatically to any phone
          content:
            body: |-
              With your message structured, add the action that sends it:

              1. Add WhatsApp's **Send Message** action right after the **Text** action, and before the final **End If**.
              2. Put **only** that **Text** variable in the Message, then tap **Recipients** to set who it goes to.

              If a **To** field doesn't appear when you tap **Recipients** (you get variables instead), delete the **Send Message** action and add it again, it usually comes back right.
            imageUrl: /courses/ai-your-life-admin-00/build-whatsapp-send.webp
        - type: text
          title: "Other messaging apps"
          subtitle: Choose whichever you use the most
          content:
            body: |-
              **Prefer a different app?** Telegram, WeChat, even email all work. Look for that app's own send action instead of WhatsApp's (for email it's **Send Email**), and add the same **Text** variable as the Message.
              
              *One thing to note:* WhatsApp and Telegram show single asterisks as **bold**, but email and some apps don't, so there the `*Logistics*` headings may show the asterisks as-is. The list still goes through well-structured.
        - type: free-text-exercise
          title: Check if it was sent, then ask anything
          content:
            description: |-
              Do a quick brain dump, then check it was sent to your partner. If you used WhatsApp to send the list, check if it appears in your WhatsApp conversation.

              If the message doesn't show up, or a step wasn't clear, ask here and you'll get an answer.
            subDescription: No question is too small. And if it worked, tell us how it felt to hand something off.
            placeholder: e.g. I cannot see the message in WhatsApp...
            systemPrompt: 'You are a warm, knowledgeable mentor for a new mum taking a course. She has built an iPhone Shortcut called Brain Dump that sorts what she says into category notes (Logistics, Food & Household, Misc) inside a folder called Mental Load, each an Apple Notes checklist. In the previous challenge, if her partner has an iPhone she already shared the Mental Load folder (long-press the folder, Share Folder, invite by Messages or Mail; a folder is always a live collaboration, so there is no Send Copy option), and those lists are already on the partner''s phone and update live. This challenge is for a partner who is not on an iPhone: she adds a WhatsApp send to the Brain Dump shortcut. Inside the If, she adds a Text action that lays out each category as a bold heading (single asterisks for WhatsApp bold) with that category''s Combined Text underneath, then a Send Message action (contributed by WhatsApp, sometimes shown as Send Message via WhatsApp, and found under the Apps tab if a search does not show it) containing only that Text result. WhatsApp is shown as the example, but the same works with other messaging apps such as Telegram or WeChat, or email via a Send Email action; note that single-asterisk bold only renders in WhatsApp and Telegram, so in email or some apps the asterisks may show as plain characters (the list still reads clearly). The layout is typed by hand, not asked of the model, because Private Cloud Compute sorts reliably but formats poorly. The framing is that the load is hers to offload, not a shared inbox she adds more to. She may report something not working or ask about any step. Common causes to check for: for the folder share, the partner not accepting the invite yet, or not signed in to iCloud with Notes turned on; for the WhatsApp send, WhatsApp not installed, the Send Message action sitting under the Apps tab rather than in search, the message pointing at the wrong Text or carrying extra variables (it should hold only the assembled Text), or the first send asking to confirm; an empty category showing just a bold heading with nothing under it in the message, which is harmless. Answer clearly and warmly in British English, in clear, everyday words for someone non-technical, in at most a few short sentences or bullets. If it falls outside the course, gently point her to Kinga and Tamas in the Discord community. Do not use em dashes. End on an encouraging note. Reply in a markdown format.'
            checkerPrompt: 'The learner is asking a question or sharing how it went. Accept any genuine question, problem description, or comment. Only flag clearly empty or nonsense input. This is their message:'
        - type: challenge-end
          title: "You shared the mental load! 👏🏼"
          content:
            nextModule: "**Next challenge:** You'll reuse this same pattern (talk, ask AI, save) to build a Baby Log: record what you keep track of, the feeds and amounts, nappies, naps and weights, and each is recorded as one organised, timestamped line in a running note you can scroll back through or show your doctor."
            description: The mental load isn't only yours to hold now, your partner can see it and pick things up, whatever phone they carry.
            subDescription: |-
              Here's what you can do now:

              ✓ Reach your partner on any phone: the shared folder on iPhone, or an automatic message on any other.

              ✓ Every brain dump gets to them on its own, without you having to forward anything.

              Want the sending steps in one place? The [Send Your List to Your Partner](https://littleparrot.app/nest/toolkit/69103a0a-1e68-4db2-ad24-4ff619f10d52) guide walks through the message and the send action with screenshots.
    - title: The Baby Log
      isFree: true
      skills:
        - iPhone Shortcuts
        - AI Prompting
        - Apple Notes
      description: Build a second shortcut that turns a few spoken words into neat, timestamped entries in a running note.
      completionTime: '07:00'
      steps:
        - type: text
          title: You already know the pattern
          subtitle: Now add timestamps
          content:
            body: |-
              You're not a beginner any more. This one uses the **same three moves**: talk, ask AI, then file the answer.

              And it's a lighter build than your first. Instead of sorting into several category notes, this shortcut turns what you say into **neat, timestamped lines** and saves them to one running note. Build it once and you'll have a record that grows on its own.
        - type: text
          title: "How Dalmie's log builds up"
          subtitle: A quick look
          content:
            body: |-
              Across an afternoon, Dalmie taps Baby Log whenever something happens. Each tap adds a timestamped session to the note, with her activities skimmable underneath:

              **07/08/2026 | 09:30**
              - **Feed**: 120 mL, settled well

              **07/08/2026 | 13:36**
              - **Feed**: 200 mL
              - **Mood**: a bit fussy after eating
              - **Nap**: went down to sleep

              She didn't format a thing. She spoke, and the prompt turned it into those tidy lines, time and all.
        - type: text
          title: Why a log is useful
          subtitle: What it's for
          content:
            body: |-
              The early weeks are a blur of feeds, naps and nappies, and your memory is doing enough already. A log helps in three ways:

              - **It catches what foggy days lose.** How much she fed, when she last slept, how today compares to yesterday.
              - **It shows how your baby's developing.** Feeds, weights and naps stacked up over days make the trend easy to see, instead of lost to memory.
              - **It speaks for you at appointments.** An organised record of amounts, weights and timings is something concrete to show your doctor or health visitor.

              And because it's voice, you can have your hands full while you dictate it.
        - type: text
          title: "Build it: make the note first"
          subtitle: One running note
          content:
            body: |-
              Open the **Notes** app and create one new note with **Baby Log** as its first line.

              It only needs to **exist**, because you'll point your shortcut at it in a moment, and it can't add to a note that isn't there yet.
            imageUrl: /courses/ai-your-life-admin-00/make-baby-log-note.webp
        - type: text
          title: "Build it: turn on ChatGPT"
          subtitle: A one-time setup
          content:
            body: |-
              For the Baby Log we'll use **ChatGPT**, because it's more consistent than Apple's own model at laying out neat, categorised lines. It's built into your phone, there's nothing to download, and you don't need an account. Switch it on:

              1. Go to **Settings → Apple Intelligence & Siri → Extensions → ChatGPT**.
              2. Tap **Set Up**, tap **Next**, then tap **Enable ChatGPT**.
              3. You see that **Use ChatGPT** is now toggled on. You're ready to go.

              If you'd like to have your dictations also show up among your ChatGPT chats, choose *Use ChatGPT with an Account* and sign in instead. Either works here.
            imageUrl: /courses/ai-your-life-admin-00/turn-on-chatgpt.webp
        - type: text
          title: The Baby Log prompt
          subtitle: Tell the AI how to log it
          content:
            body: |-
              Same idea as before: the AI needs telling how to format what you say. This one does a bit more, splitting what you say into **separate activities** under a single **timestamp**. Copy this prompt:

              ```
              You are a baby care log parser. Turn the voice entry below into clean, scannable log lines.

              The date and time now is: 

              Rules:
              - Begin with the date and time above on its own line, in bold, with a | between the date and the time, like: **07/08/2026 | 13:36**
              - Under it, add one line per activity I mention, formatted as: - **Category**: details.
              - Use whichever of these categories fit: Feed, Nappy, Nap, Mood, Weight, Milestone. Use Note if none fit.
              - Keep the real details I gave and drop the filler. Don't invent anything.
              - If I didn't mention anything worth logging, reply with nothing.
              - Reply with just the heading and the lines, nothing else.

              Here is what I said:

              ```

              This time you drop **two** things into the prompt when you build it: the **time** goes after "*now is:*", and **what you said** goes after that last line. The next steps show you where.
        - type: text
          title: "Build it: talk, stamp the time, then sort"
          subtitle: The thinking part
          content:
            body: |-
              Open **Shortcuts**, start a new shortcut, and add these blocks in order:

              1. **Dictate Text.** Tap the blue arrow to open its settings, set your *Language*, and set *Stop Listening* to **After Pause**, since a log entry is short and can end on its own without a tap.
              2. **Date**. Its variable is already set to **Current Date**, which is what you want.
              3. **Format Date**. Tap the blue arrow on *Format Date* and set both *Date Format* and *Time Format* to **Short**, so you get today's date and the time in an easy-to-read format.
              4. **Use Model.** Tap the model and choose **ChatGPT** (leave its *Output* on *Automatic*). Delete the *Formatted Date* chip that appears in the text box.
              5. Paste your Baby Log prompt into the *Use Model* block's text box. Then place the **Dictated Text** chip at the very end, after "*Here is what I said:*", and add the **Formatted Date** chip right after "*The date and time now is:*".

              That's the thinking part built: it hears you, knows the time, and turns what you said into clear lines.
            imageUrl: /courses/ai-your-life-admin-00/build-babylog-model.webp
        - type: text
          title: "Build it: save each line to your note"
          subtitle: One last block
          content:
            body: |-
              One last block sends it to your note. Add **Append to Note** in the Shortcut:

              - For the **Text**, insert the **Response** from *Use Model*.
              - For the **Note**, shortly tap the *Note* field and pick your **Baby Log** note.

              *Append to Note* adds to the **bottom** of the note, so your sessions stack up in order, newest last. Rename the shortcut **Baby Log** and tap the **tick** (✓) on the keyboard.

              You can also add your shortcut to your **Home Screen**: tap the **Share** icon at the bottom of the editor, choose **Add to Home Screen**, pick a colour and symbol, then tap **Add**. Now it's an icon you tap like any app.
            imageUrl: /courses/ai-your-life-admin-00/build-babylog-append.webp
        - type: free-text-exercise
          title: Try it now, then ask anything
          content:
            description: |-
              **Try it right now, before you move on.** Tap your **Baby Log** shortcut and say whatever's freshest: the last feed and how much, a nappy, a nap, or just how your baby seems. Speak normally, however it comes out.
              
              Then open your **Baby Log** note and see the entry sitting there, timestamped.

              If something went wrong, or anything about this build is unclear, ask here and you'll get an answer.
            subDescription: Even one entry starts a record you can scroll back through. Ask about anything that's unclear.
            placeholder: e.g. My entry isn't showing up in the note...
            systemPrompt: 'You are a warm, knowledgeable mentor for a new mum taking a course where she builds an iPhone Shortcut called Baby Log. The shortcut is: Dictate Text (Language set, Stop Listening set to After Pause), then Current Date, then Format Date (Date Format Short and Time Format Short), then Use Model set to ChatGPT with Output on Automatic, using a baby-care-log-parser prompt that outputs a bold date-and-time heading (the date, a pipe, then the time, from the inserted Formatted Date) followed by one line per activity in the form "- **Category**: details" (categories Feed, Nappy, Nap, Mood, Weight, Milestone, or Note). Each run of the shortcut appends one such timestamped session. In the prompt, the Formatted Date chip is placed after "the date and time now is:" and the Dictated Text chip is at the very end. Then Append to Note, with the Baby Log note picked directly in the note field (no Find Notes needed), appending the Use Model Response. Before building, she made a note in the Notes app whose first line is Baby Log, and turned on the ChatGPT extension (Settings, then Apple Intelligence & Siri, then Extensions, then ChatGPT, Set Up, then Enable ChatGPT with no account, or Use ChatGPT with an Account to keep a history). ChatGPT is the model used here because it lays out neat categorised lines; the course does not cover swapping it, but if she asks about keeping things private, Private Cloud Compute is a fully private alternative she could pick in the Use Model block, though it formats less reliably. She may report something not working or ask about any step. Common causes to check for: the Baby Log note never created, so there is nothing to append to; the wrong note picked in Append to Note, or its note field left empty; Append to Note missing the Response variable; the Formatted Date chip not placed in the prompt, so lines have no time; the Dictated Text chip missing, so the model has nothing to read; the ChatGPT extension not set up; dictation ending too soon or too late (After Pause suits short entries; On Tap if she prefers to tap when she''s done); if she swapped to Private Cloud Compute, lines may come out less tidy since it formats less reliably. Answer clearly and warmly in British English, in clear, everyday words for someone non-technical, in at most a few short sentences or bullets. If it falls outside the course, gently point her to Kinga and Tamas in the Discord community. Do not use em dashes. End on an encouraging note. Reply in a markdown format.'
            checkerPrompt: 'The learner is asking a question or sharing how their logging went. Accept any genuine question, problem description, or comment. Only flag clearly empty or nonsense input. This is their message:'
        - type: challenge-end
          title: "You built your Baby Log! 📝"
          content:
            nextModule: "**Next challenge:** Two shortcuts is great, but opening an app to run them defeats the point when your hands are full. Last up: triggers that fire your shortcuts by voice, a tap on the back of your phone, or a single button."
            description: You built a second shortcut from scratch, one that turns a few spoken words into a clear, timestamped entry in one running note, hands-free.
            subDescription: |-
              Here's what you can do now:

              ✓ Log a feed, nappy or nap by voice, even with your hands full, and it's recorded timestamped in your Notes app.

              ✓ Scroll back through the whole record any time, or show it to your doctor or health visitor.

              ✓ Reuse the talk, ask AI, save pattern, with a prompt you can reshape, for any running log you want.

              Want to rebuild it or check a step? The [Build the Baby Log Shortcut](https://littleparrot.app/nest/toolkit/d959a2f5-39c5-4867-84d9-58de57ba075e) guide walks through every block with screenshots.
    - title: Make It Effortless
      isFree: true
      skills:
        - Shortcuts Triggers
        - iPhone Accessibility
        - Siri
      description: Set up hands-free ways to fire your shortcuts, by voice, a tap on the back of your phone, or a single button.
      completionTime: '05:00'
      steps:
        - type: text
          title: The last bit of friction
          subtitle: Run your shortcuts effortlessly
          content:
            body: |-
              You've built both shortcuts. But if running one means unlocking your phone, finding the app and tapping around, you won't reach for it in the moment you need it, when the baby's on you and your hands are full.

              These last few steps fix that. By the end, you'll be able to fire either shortcut **without looking**.
        - type: text
          title: Add it to your Lock Screen
          subtitle: Reach it before you unlock
          content:
            body: |-
              You already added your shortcuts to the **Home Screen**. Adding them to the **Lock Screen** makes them more accessible, ready before you even unlock:

              1. Touch and hold your **Lock Screen**, tap **Customise**.
              2. Tap the **widget area** below the clock, and choose the **Shortcuts** widget.
              3. Tap that widget again to assign the exact shortcut you want (your **Brain Dump** or **Baby Log**).
              4. Tap **Done** to save.

              *(Apple shuffles these screens around between updates, so if a label looks different, look for **Customise**, then the widgets under the clock.)*
            imageUrl: /courses/ai-your-life-admin-00/lock-screen-widget.webp
        - type: text
          title: Run them without even looking
          subtitle: Back Tap, Action Button, or Siri
          content:
            body: |-
              A few ways to run your shortcuts when your **phone is locked**:

              - **Back Tap:** go to *Settings* → *Accessibility* → *Touch* → *Back Tap*. Choose *Double Tap* or *Triple Tap* and scroll down to pick your shortcut. Now a **firm** tap on the **back of your phone** runs it.
              - **The Action Button:** your iPhone has the small button above the volume keys, set it in *Settings* → *Action Button* to run your shortcut with one long press.
              - **Hey Siri:** Siri needs to be on first, so in *Settings* → *Apple Intelligence & Siri*, tap **Talk & Type to Siri**, then choose **Hey Siri** and follow the voice setup. Then say *"Hey Siri, Baby Log"* (or any shortcut's name) and Siri runs it by name.
        - type: text
          title: Two things about the dictation
          subtitle: Whatever starts it
          content:
            body: |-
              However you launch a shortcut, two things decide whether your dictation reaches your note:

              - **Keep the screen on.** If it dims or goes black mid-sentence, it cuts your dictation off. Give it a tap to keep it awake if you're taking your time, and don't set the phone down until it's finished.
              - **Mind the stop setting.** Your **Baby Log** ends on a pause, so a breath finishes it, which is perfect for a quick log. Your **Brain Dump** waits for your tap instead, so it keeps listening through your pauses; end it with the **stop** button (⏹️) when you're done.
        - type: text
          title: When something's too big for a dump
          subtitle: A quick pointer
          content:
            body: |-
              Some things on your mind are whole projects: *"sort out childcare"*, *"plan the christening"*. Your Brain Dump will file these into a category note (likely Logistics or Misc), which is exactly right.

              When you're ready to tackle one, open an **AI chat assistant**, like ChatGPT or Claude, and prompt it to ask you questions to break the task into small steps. You can do this by talking to it, and it will transcribe your words into text. That's a different skill from these shortcuts, so we'll leave it as a pointer.
        - type: free-text-exercise
          title: Make it yours
          content:
            description: |-
              You built these two shortcuts around downloading your mental load, but the pattern, talk, let AI sort or log it, then save, works for almost anything.

              So tell us: what's one job in your life you'd love your phone to take off you next? And is there anything you wish these shortcuts could also do? We'll help you figure it out.
            subDescription: Whatever you're picturing, share it and we'll suggest a way to set it up.
            placeholder: e.g. I'd love one for my work to-do list, and I wish it could add reminders...
            systemPrompt: 'You are a warm, knowledgeable mentor for a new mum who has just finished a course where she built two iPhone Shortcuts: a Brain Dump (she talks, Apple''s Private Cloud Compute sorts it into category checklist notes, Logistics, Food & Household, Misc, in a shared Mental Load folder) and a Baby Log (she talks, ChatGPT turns it into timestamped, categorised lines in one running note). Both follow the same pattern: talk, let AI sort or format it, then save it to Notes. This closing exercise invites her to name one job in her life she''d love her phone to take off her next, and anything she wishes the shortcuts could also do. Your job is to help her shape that, concretely and specifically to what she said, not with generic praise. If her idea fits the Brain Dump, tell her which categories to change in the prompt (for example a work brain dump with keys like Emails, Calls, Admin, or a meal-planning one). If it fits the Baby Log, suggest duplicating that shortcut and rewording the prompt for the new log (a feeding-and-symptom log, a gratitude log, a toddler milestones log). If what she wants is beyond these shortcuts, such as setting reminders or calendar events (the course deliberately left those out because they were too fiddly to be reliable), say so kindly and point her to an AI chat assistant like the free ChatGPT app for the bigger planning jobs. If she only shares a wish or a comment rather than a use case, acknowledge it warmly and offer the nearest workaround you honestly can, without overpromising. Thank her briefly, since what she shares helps shape future courses. Answer clearly and warmly in British English, in clear, everyday words for someone non-technical, in at most a few short sentences or bullets. Do not use em dashes. End on an encouraging note. Reply in a markdown format.'
            checkerPrompt: 'The learner is describing what she''d like to use this for, a wish, or a comment. Accept any genuine response. Only flag clearly empty or nonsense input. This is their message:'
        - type: course-end
          title: You've handed the mental load to your phone! 🎉
          content:
            nextModule: "**Where to go next:** You just used AI to structure your mental load. If you've got an idea for building something else with AI, you can do it without any coding. Our [Build Your First App with Lovable](https://littleparrot.app/5e86e580-264c-442c-8cc4-be5645f13e87/course-overview) course walks you through how to turn your idea into a working website. For now though, the win is on your phone, go and use it. 🤗"
            description: Look at what you can do now.
            subDescription: |-
              ✓ **The Brain Dump:** talk, and it's sorted into categorised checklists, in a folder you share with your partner so the load is visible.

              ✓ **The Baby Log:** record feeds and amounts, nappies, naps and weights as tidy, timestamped lines you can look back over or show your doctor.

              ✓ **Your two prompts:** reusable, and yours to reword for anything else you want sorted or logged.

              ✓ **Quick triggers:** voice, back tap, the action button, home and lock screen.

              ✓ **Talk however it comes out:** any language, tired and messy, and your phone still makes sense of it.

              **Remember:** you now offload the mental load by voice, in the seconds you have. Now go and forget something on purpose. Your phone's got it. 💪
  titleSplit:
    - "Hand Off the Mental Load:"
    - Use AI to Turn a Brain Dump into a List
  description: "Talk, and let AI turn the running list in your head into an organised list on your phone. Made for mums, for the days when your hands are full and your brain is keeping track of far too much. In about 20 minutes you'll build two voice shortcuts: one sorts a spoken brain dump into checklists your partner can tick off, the other logs your baby's feed, nappy or nap as a timestamped line. It all uses tools already on your iPhone, with nothing new to subscribe to."
