script: |-
  You did the thing everyone tells you to do. You wrote the whole list down: every appointment, every reorder, every birthday. And for about a day, you felt lighter.

  Then a fortnight passed and half of it wasn't true any more. New things keep arriving, and they arrive while you're driving, or mid-feed, or halfway through something else. So they go straight back into your head, because that's the only place you can put them without stopping.

  Keeping the list current is the hard part, not writing it. So instead of sitting down with a notebook, you say the thing out loud the moment it occurs to you, and your phone drops it onto the right list. Ten seconds of talking, and it's on the list instead of in your head.

  That's the Brain Dump. You build it yourself in our course, Hand Off the Mental Load. It uses Apple's built-in AI, so you'll need an iPhone 15 Pro or newer.

  The whole course is free until the 30th of August. Head to littleparrot.app and build yours.
caption: |-
  You write the whole list down and it's a relief to see it. Every appointment, every reorder, every birthday, finally out of your head. You feel lighter for about a day.

  Then a fortnight passes and it's out of date. New things keep arriving, and they turn up while you're driving, mid-feed, or halfway through something else, so they go straight back into your head.

  That's why paper lists go stale so fast. A notebook needs both hands free and a pen nearby exactly when you rarely have either.

  So we built a list you talk to. You say the thing out loud the moment it occurs to you, and your phone drops it onto the right list, worded properly. Ten seconds of talking instead of a sit-down session.

  You build it yourself by tapping a few blocks together in the Shortcuts app that's already on your phone. It uses Apple Intelligence, so it needs an iPhone 15 Pro or newer, with nothing to download. We made it for mums.

  The whole course is free until 30 August at littleparrot.app. Follow along, and save this for the next time your list falls behind.
title: "Why your written list goes out of date"
