script: |-
  It's two in the morning. The baby's finally asleep on you, both arms full, and your brain picks now to remind you the six-week check still isn't booked.

  You can't write it down, so it goes back into your head and keeps you awake until six.

  There's another way to put it down. You say it out loud, and your phone sorts it onto the right list for you. We call it the Brain Dump, and you build it yourself by tapping a few blocks together in the Shortcuts app that's already on your phone.

  Then, half asleep, you just say: "I need to book the six-week check." A few seconds later it's on your list, worded properly, and you go back to sleep.

  It's the first thing you make in our course, Hand Off the Mental Load. It uses Apple's built-in AI, so you'll need an iPhone 15 Pro or newer.

  The whole course is free until the 30th of August. Head to littleparrot.app and build yours.
caption: |-
  The thoughts don't wait for a good time. They arrive at two in the morning with a baby on you, the ones that would normally keep you awake until six.

  If you're a mum, you know the feeling: both hands full, no way to write anything down, so it goes back into your head because that's the only place you can put it without waking the baby.

  So we built a shortcut you can talk to. You say the thing out loud, and your phone sorts it onto the right list, worded properly. We call it the Brain Dump, and you build it yourself by tapping a few blocks together in the Shortcuts app that's already on your phone.

  It uses Apple Intelligence, so it works on an iPhone 15 Pro or newer, and there's nothing to download. We made it for mums, so the examples are nappies, feeds and health visitors, and you can reword them to fit your own household.

  The whole course is free until 30 August at littleparrot.app. Follow along, and save this for the next two in the morning.
title: "The 2am thought that keeps you awake"
