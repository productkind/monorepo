script: |-
  Talk for twenty seconds, and watch your phone sort everything in your head into a tidy list.

  Like this: "Right, we're out of nappies, wipes and barrier cream, I keep meaning to book the six-week check, the health visitor's coming Tuesday at eleven, and we need bananas."

  A few seconds later it's sorted. Logistics: book the check, health visitor Tuesday at eleven. Food and household: nappies, wipes, barrier cream, bananas. You didn't type a word, and you didn't open an app.

  That's the Brain Dump, and you build it yourself by tapping a few blocks together in the Shortcuts app that's already on your phone. It's the first thing you make in our course, Hand Off the Mental Load. It uses Apple's built-in AI, so you'll need an iPhone 15 Pro or newer.

  The whole course is free until the 30th of August. Head to littleparrot.app and build yours.
caption: |-
  Talk for twenty seconds, however it comes out, and let your phone sort the ramble into a tidy list.

  Say something like: "We're out of nappies, wipes and barrier cream, I keep meaning to book the six-week check, the health visitor's coming Tuesday at eleven, and we need bananas." A few seconds later it's two clean lists, one for logistics and one for food and household, each line worded properly and ready to tick off. No typing, no app to open.

  This is the Brain Dump, the first shortcut you build in our course. You make it yourself by tapping a few blocks together in the Shortcuts app that's already on your phone. It uses Apple Intelligence, so it needs an iPhone 15 Pro or newer, with nothing to download. We made it for mums, and you can reword the categories to fit your own household.

  The whole course is free until 30 August at littleparrot.app. Follow along for more, and save this to build it later.
title: "Talk for twenty seconds, get a sorted list"
