name: Checks

# Every push to main, whatever it touched. Trunk-based development means each push is already
# production-bound, so there is no earlier point at which this could run.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older one: only the tip of main matters.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npx vitest run

      - name: Audit dependencies
        run: npm run audit-dependencies
