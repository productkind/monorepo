name: Publish Dungarees to npm

on:
  push:
    branches:
      - main
    paths:
      - 'dungarees/config/version.json'
      - 'dungarees/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npx vitest run

      # Runs through the installed binary, so it also proves the published CLI works.
      - name: Audit dependencies
        run: npm run audit-dependencies

      - name: Publish to npm
        run: npm run publish:dungarees
