# Do not rename this file or the environment below. Every @dungarees package names both in its
# trusted publisher configuration, npm matches them exactly, and those configurations cannot be
# edited — only revoked and recreated. A rename means running `npm run trust:dungarees` again for
# all of them, with publishing broken in between.
name: Publish Dungarees to npm

# Runs off the back of Checks rather than off the push, so the checks are never repeated here.
# `workflow_run` carries no path filter, so this starts after every green push to main — the
# publish itself skips each package whose version is already on the registry, which is a safer
# filter than guessing the push range from `head_sha` and risking a missed version bump.
on:
  workflow_run:
    workflows: ['Checks']
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

# Never cancel a publish in flight, but never run two at once either.
concurrency:
  group: publish-dungarees
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use an npm that can publish over OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm run publish:dungarees
