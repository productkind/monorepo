name: Publish Dungarees to npm

on:
  push:
    branches:
      - main
    paths:
      - 'dungarees/config/version.json'
      - 'dungarees/**'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Audit dependencies
        run: npm run audit-dependencies

      - name: Publish to npm
        run: npm run publish:dungarees
        env:
          # Trusted publishing is configured per package and cannot create one that does not exist
          # yet, so a scope-wide token is what lets a new @dungarees package be published for the
          # first time.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
