caption: |-
  When you ask an AI to do something new – like tagging support tickets – don’t just tell it. Show it.

  ✨ Provide a few examples of input–output pairs that demonstrate the task or style you want.

  Because AI learns from patterns. And examples? They’re ridiculously powerful for guiding the output.

  The better your examples, the better your results.
  Even for haunted mobile apps. 👻📱
alt:
  panels:
    - 'A small chick in a green hoodie stands next to a purple robot. The chick says, “Alright AI, tag this support ticket: ‘The app won’t open unless I whisper to it. I’ve tried everything.’”'
    - 'The robot replies, “Tag: [‘haunting’, ‘voice-activated’, ‘ghost in the shell?’]” while the chick crosses its wings and looks unimpressed.'
    - 'An otter in a pink jumpsuit leans in and says to the chick, “Chick, don’t just ask. Show it what good tagging looks like first.” The chick turns to the robot and says, “Okay! Input: ‘I can’t log in.’ Output: [‘account’].”'
    - 'The robot responds, “Tag: [‘bug’, ‘mobile’, ‘emotional damage’].” Then adds, “Kidding! Real tag: [‘bug’, ‘mobile’].” The otter watches while the chick looks pleased.'
  strip: A four-panel comic featuring a chick in a green hoodie, a purple robot, and an otter in a pink jumpsuit. The chick asks the robot to tag a strange support ticket. The robot gives unhelpful, quirky tags. The otter suggests the chick demonstrate proper tagging first. After an example, the robot responds with a silly tag followed by a corrected, more accurate version. Branding reads “productkind.”
