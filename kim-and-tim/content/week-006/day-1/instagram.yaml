caption: |-
  When prompting AI, try flipping the negatives into clear, positive instructions.

  Instead of "Don’t use jargon," try "Use simple, accessible language."

  While AI models are getting better at handling negative constraints, framing in the positive generally provides better outputs.

  👉🏼 More practical prompting techniques with examples at productkind.substack.com
alt:
  panels:
    - |-
      Tile 1 of a comic strip:
      A purple robot with a kitten photo on its screen says, “Here is a picture of a kitten!” A small chick in a green hoodie stands beside it, looking unimpressed.
    - |-
      Tile 2 of a comic strip:
      An otter in a teal jumpsuit asks, “What happened here?” The chick replies, “I gave it a list of things not to do.” The robot stands beside them, still displaying the kitten photo.
    - |-
      Tile 3 of a comic strip:
      The chick says, “Don’t use jargon! Don’t write fluff! Don’t overcomplicate it!” The robot responds, “Technically, a picture of a kitten follows all those instructions,” with the kitten photo still on its screen. The otter listens silently.
    - |-
      Tile 4 of a comic strip:
      The otter advises, “Try using affirmative directives instead of negative ones. You’ll usually get better results.” The chick listens thoughtfully. The robot still displays the kitten.
  strip: |-
    Four-panel comic:

    The robot says, “Here is a picture of a kitten!” as the chick stands nearby, looking annoyed.
    The otter asks, “What happened here?” The chick answers, “I gave it a list of things not to do.”
    The chick repeats, “Don’t use jargon! Don’t write fluff! Don’t overcomplicate it!” The robot replies, “Technically, a picture of a kitten follows all those instructions.”
    The otter concludes, “Try using affirmative directives instead of negative ones. You’ll usually get better results.”
    In every panel, the robot displays the same kitten photo on its screen.
