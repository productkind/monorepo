caption: |-
  Scrolling through LinkedIn, it feels like everyone builds a product in a day with AI. 💥

  The reality? Yes, you can spin something up fast if you don’t care how it works. But if you want a product that’s robust, designed well, and solves a real problem, it takes clarity and iteration.

  That’s one of the lessons we shared in the article we just published about our vibe coding journey with @lovable.dev. Building Little Parrot was fun, frustrating, and full of learnings – especially about how much thinking you still have to bring yourself. 🦜

  If you’re curious, you can read the full story here:
  🔗 productkind.substack.com

  #productmanagement #ai #promptengineering #buildinpublic #lovable #lovableshipped
