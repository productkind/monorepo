caption: |-
  Ever written a long prompt… only to confuse the AI more? 🤖

  We’ve found that structure beats length every time.
  ✨ Give enough context in your prompts
  ✨ Use markdown or XML tags
  ✨ Be specific about what you want to achieve

  Even machines like clean writing.

  That’s how we’ve been building Little Parrot with @lovable.dev – and these practices really help.

  🦜 Try our first micro-course to master prompting foundations.
  Link in bio.

  #productmanagement #ai #promptengineering #buildinpublic #productdesign #lovable #lovableshipped
alt:
  panels:
    - A cartoon chick in a green hoodie says, “My long prompts just make Lovable confused.” Beside the chick is a friendly snail with a brown shell and green outfit.
    - The snail replies, “Structure them. Markdown, tags, neat sections.” The chick stands next to the snail, listening.
    - The chick asks, “So, tidy prompts… tidy apps?” The snail looks on quietly.
    - A purple robot peeks in from the left. The chick stands beside the snail as the robot says, “Exactly. Even machines like clean writing.”
  strip: A four-panel comic featuring a chick, a snail, and a robot. The chick worries that long prompts confuse Lovable. The snail advises structuring prompts with markdown and neat sections. The chick wonders if tidy prompts lead to tidy apps, and the robot confirms that even machines prefer clean writing.
