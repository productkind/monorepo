posted: 2025-09-21
caption: |-
  When we first built with AI tools, the results felt… average.

  AI fills in the blanks, but it won’t think for you. To get something useful, you need clarity.

  Once we told it exactly which components, layouts, and styles to use, the outputs improved.

  That’s how we built Little Parrot, our micro-learning platform for product people, with @lovable.dev – and we learned a lot along the way.

  We shared more of our learnings in our latest article.

  👉 productkind.substack.com

  #productmanagement #ai #promptengineering #buildinpublic #productdesign #lovable #lovableshipped
alt:
  panels:
    - A cartoon chick in a green hoodie, still partly in its eggshell, says to a purple robot, “Build me something… nice.”
    - 'The purple robot replies, showing a plain website on its screen: “Here’s an average website. Safe fonts, safe layout, safe everything.” The chick stands beside it.'
    - The chick looks annoyed and says, “That’s not what I meant!” while the robot’s screen is blank again.
    - The robot responds, “Then stop outsourcing your thinking.” The chick looks unimpressed, standing next to it.
  strip: Four-panel cartoon with a chick in a hoodie asking a robot to “build something nice.” The robot produces a bland website, the chick complains it’s not what they meant, and the robot concludes, “Then stop outsourcing your thinking.”
