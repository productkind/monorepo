alt:
  panels:
    - |-
      Four-panel comic with a white background, bold purple borders, and friendly cartoon characters outlined in purple. The characters are a small yellow chick wearing a green hoodie (still partly in an eggshell), a cheerful purple robot with an antenna and a square screen on its chest, and a smiling white otter in a pink collared jumpsuit who appears later in the strip.

      Panel 1:
      The robot is speaking in a pixelated font:
      “To improve activation, focus on streamlining the user journey, adding value quickly, and increasing engagement. Consider A/B testing different approaches and leveraging behavioural insights to optimise results.”
      The chick stands beside the robot, listening with a neutral expression.
    - |-
      Panel 2:
      The chick stands beside the robot, arms folded and looking unimpressed. It asks in a casual handwritten font:
      “What does that even mean?”
    - |-
      Panel 3:
      The otter leans in from the right side of the panel, smiling and asking:
      “Did you tell it about the product, what your goal is, and what you’ve tried?”
      The chick replies, glancing slightly away, “Oh... I just said ‘Improve activation.’”
      The robot stands between them, silent.
    - |-
      The robot says:
      “I need context like a plant needs sunlight!”
      A small potted plant emoji floats above its head.
      The chick and otter stand on either side of the robot, both looking at it with slight smiles.

      Each panel includes the “productkind” logo in the corner, with the letter “k” highlighted in a purple square.
