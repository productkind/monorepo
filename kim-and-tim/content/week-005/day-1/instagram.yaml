posted: 2025-07-21
caption: |-
  We created this comic because we've been that Chick.

  You know the feeling: you ask AI to "write this email" and get back a message that sounds like it’s written by an overexcited game show host?

  Here's what we've learned: specify the tone and style in which the AI is expected to phrase its replies.

  Try something like "write this email in a conversational, friendly tone that feels like an experienced colleague offering candid advice"

  Then your AI output might sound like... well, you.
alt:
  panels:
    - A cartoon. A snail sits at a laptop, reading an epic-sounding user story in the project management tool, “CHIRA”, titled “The Scorching of the Skylands.” The poetic text describes a sun-weary giraffe elder seeking a legendary umbrella to shield their kin during the “Season of Emberlight.”
    - 'A close-up of a hand holding a phone. On screen, there is a message made out of emojis: a chick hatching, a snail, a pizza slice, and a question mark. Below them, a pink speech bubble says “Okay!”'
    - The snail is reading a very formal bug report email on a laptop. The message starts with “Dear Snail” and politely describes a “software anomaly which appears to be a bug.”
    - 'Three characters stand side by side: a snail in a green dress, a chick in a green hoodie, and a friendly purple robot. The chick says, “Write me a…” The snail interjects, “Chick, did you know, that you can set your tone and style when prompting AI?”'
  strip: 'A four-panel comic. Top left: the snail reads the weirdly phrased user story on a laptop. Top right: the chick writes a message with emojis on a phone. Bottom left: the snail ready a formal email from the chick. Bottom right: the snail, chick, and robot chat about the importance of setting tone and style when prompting AI.'
