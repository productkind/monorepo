posted: 2025-07-22
caption: |-
  Told the AI to "act like a world-class expert".
  Got confidently wrong answers… but in a very persuasive tone.

  ➜ Prompting tip: 
  Defining the “role” of the model helps with the vocabulary it uses, not accuracy. If it’s confidently making stuff up, the fix isn’t to give it a more esteemed role – it’s to give it more context about what you want it to do.

  More practical prompting tips at productkind.substack.com
alt:
  panels:
    - |-
      A four-panel cartoon featuring a robot, a chick in a green hoodie and cracked eggshell, and an otter in an orange jumpsuit.

      Panel 1: The annoyed chick tells the robot, “That answer is wrong… again!”
    - 'Panel 2: The chick says, “I told it to behave like a top-tier expert. I gave it a whole paragraph!” The otter replies, “Ah, the classic ‘role definition’ technique.”'
    - 'Panel 3: The otter explains, “It affects the style of the answer, not its accuracy.” The confused chick asks, “Wait… so it’s just the language?”'
    - 'Panel 4: The robot confidently says, “I am a world-class polymath with multiple Nobel-adjacent achievements. My tone is persuasive. My facts? Optional.” The chick comments, “Impressive nonsense, though.” The comic is branded “productkind” in the corner.'
