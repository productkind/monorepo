caption: |-
  Identifying error scenarios isn’t a one-person mission. 🕵

  Brainstorm what could go wrong as a team, then you might even avoid implementing the “unknown error: LOL” type of error messages! 🐣🐱🐌

  Dive into the full article for checklists, typical error scenarios, and ways to keep your stories laser-focused on outcomes instead of outputs.

  🔗 productkind.substack.com
alt:
  panels:
    - 'A cartoon chick in a bright green hoodie, still half-inside its eggshell, faces a whiteboard crammed with pink and yellow sticky notes. The chick frets: “Okay, if the user clicks ‘back’ then ‘refresh’ then what happens?!”'
    - 'The same sticky-note board looms above. The chick, now facing us and looking anxious, is met by an otter poking in from the right, wearing a lilac-pink jumpsuit. The otter soothes: “Chick, don’t do this to yourself.”'
    - 'On a plain background the chick turns to the standing otter in its pink jumpsuit. The chick panics: “But what if I miss an error? What if the app explodes?!” The otter smiles reassuringly: “That’s why you have a team, they’ve got your back.”'
    - 'A purple cat with cat-eyed glasses in magenta clothes joins the scene, standing between the chick and a snail wearing a vivid green dress. The cat advises: “You could also update the error message: ‘Unknown error: LOL’ to something more helpful.”'
