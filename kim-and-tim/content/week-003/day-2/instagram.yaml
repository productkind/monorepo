caption: |-
  Sparkly progress bar that changes colour every second? Nice. ✨ A shorter wait time? Nicer. ⚡️
  Ask “What problem are we solving?” before unleashing the glitter.

  We nudge you to start with outcomes, not ornaments:
  1. State the user problem first.
  2. Brainstorm ways with your team to remove pain, not decorate it.
  3. If the solution idea lives in the “fun but pointless” bucket, great – keep it there and ship real value.
alt:
  panels:
    - 'A purple cat with cat-eyed glasses in a bright pink shit and trousers stands between a hoodie-wearing chick still half-in its eggshell and a snail sporting a vivid green dress. Arms wide, the cat suggests: “Let’s add a sparkly progress bar that changes colour every second!” All three characters are smiling.'
    - The cat exclaims, “It’ll make waiting more exciting! Imagine sparkly progress!” An otter – popping in from the left in its trusty lilac jumpsuit – joins the gathering. It asks, “What problem are we solving by doing this?” The chick and the snail look up, pondering.
    - 'All four characters stand shoulder-to-shoulder. The cat ventures, “Erm… boredom? Maybe?” The snail muses back: “Hmm… or we could make the wait shorter instead?” The otter listens calmly; the chick stays quietly attentive.'
    - 'The otter offers gentle guidance: “Let’s focus on real outcomes. Sparkles are nice, but saving time for our users is nicer.” The chick nods: “Got it. I’ll put the sparkly bar in our ‘fun but pointless’ list.” The cat and snail stand by, content with the decision.'
  strip: |-
    A cartoon strip with four panels featuring a chick in a green hoodie (half in its eggshell), an otter in a lilac jumpsuit, a purple cat in pink clothes, and a snail in a bright green dress.

    Panel 1: The cat, standing proudly between the chick and the snail, suggests: “Let’s add a sparkly progress bar that changes colour every second!”
    Panel 2: The cat exclaims excitedly: “It’ll make waiting more exciting! Imagine sparkly progress!” The otter leans in, asking: “What problem are we solving by doing this?” The chick stands between them, thoughtful, with the snail on the end.
    Panel 3: The cat says, “Erm… Boredom? Maybe?” The snail responds, “Hmm… Or we could make the wait shorter instead?” The otter smiles beside them, the chick stays calm.
    Panel 4: The otter gently sums up: “Let’s focus on real outcomes. Sparkles are nice, but saving time for our users is nicer.” The chick replies, “Got it. I’ll put the sparkly bar in our ‘fun but pointless’ list.” The cat and snail stand alongside, satisfied with the plan.
