caption: |-
  Not a line manager, but everyone still looks your way?
  That’s leadership. 🐣✨ 

  It's not about titles or scary boss voices.
  What's important is to listen, empower your team, and be the person they can trust.

  (And if your “scary voice” sounds like a squeaky toy? Don’t worry, demonstrating power never really worked anyway.)

  🤔 Have you ever found yourself leading without "the boss" title?

  Read about practical building blocks in How to Lead Without Authority – link in bio.

  #ProductManagement #LeadershipWithoutAuthority #ProductTeam #ProductHumour #DigitalProducts #WorkHumour #TechLeadership #BuildBetterProducts
