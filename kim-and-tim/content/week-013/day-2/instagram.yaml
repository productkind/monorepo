caption: |-
  We ran a workshop last week, and we felt the nerves just like anyone else. That twist in the stomach, the fear of messing up – it was all there.

  @adamgrant’s advice helped: “Instead of saying ‘I’m here to prove myself,’ say ‘I’m here to improve myself.’ It’s a learning experience.”

  Each talk is just another rep at the gym. 💪🏼
  Growth happens outside the comfort zone.

  Every time you step into something unfamiliar – presenting, or running a workshop – the fear shrinks a little and resilience grows.

  👀 Read The Case For Consistency on productkind.substack.com

  #ProductManagement #ProductTeam #BehaviouralScience #PublicSpeaking #Workshops #LearningInPublic #GrowthMindset #ContinuousLearning #ProfessionalDevelopment #CareerGrowth #LeadershipDevelopment
alt:
  panels:
    - A nervous chick wearing a green hoodie says, “My stomach’s in knots. I think I might faint before this workshop.” An otter in a purple jumpsuit replies, “Perfectly normal. Public speaking is just practice, not magic.”
    - The chick looks worried and asks, “But what if I mess up in front of everyone?” The otter smiles and says, “Every time you do it, the fear shrinks a little.”
    - The chick asks, “So I should keep stepping on stage?” The otter answers, “Yes. Each talk is a rep at the gym.”
    - The chick smiles and says, “That wasn’t so bad.” The otter replies, “See? Stronger already.”
  strip: A short comic strip shows a nervous chick in a green hoodie and an encouraging otter in a purple jumpsuit talking about public speaking. The chick admits to feeling anxious and afraid of mistakes, while the otter reassures them that fear is normal and practice makes it easier. With each step, the chick grows more confident, ending with a smile after realising speaking wasn’t so bad.
