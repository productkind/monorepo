caption: |-
  Ever seen someone do something strange just to keep a streak alive? 🧬

  Tim’s been “learning” languages on Duolingo for 1462 days.
  Except half the time, he’s just tapping random answers to keep the streak going.

  That’s Goodhart’s Law in a nutshell: when a measure becomes a target, it stops being a good measure.

  This week, we reflected on streaks, since we missed publishing an article on Wednesday.
  Consistency is one of the most important ingredients of success, but only if you truly learn in the process.

  📚 Read more on productkind.substack.com

  #productmanagement #workplacelearning #goodhartsLaw #growthmindset #workplaceculture #consistency
