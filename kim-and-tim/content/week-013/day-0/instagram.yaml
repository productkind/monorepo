  strip: A four-panel comic about Goodhart’s Law. In the first panel, a chick in a green hoodie asks for an example of Goodhart’s Law, and an otter in a blue jumpsuit suggests asking Tim. In the second panel, the chick finds a hedgehog in orange dungarees holding a phone, who says, “I’m entering random answers on Duolingo.” In the third panel, the chick asks, “Why would you do that?” In the final panel, the hedgehog explains, “I have a 1462-day streak and I don’t want to lose it!” showing how chasing the metric of streak length replaces real learning.
