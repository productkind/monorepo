posted: 2025-09-09
caption: |-
  Giving feedback takes energy. And some days… you just don’t have it.

  That’s okay. Not every moment has to be a teaching moment.
  Sometimes the best thing you can do is let yourself rest.

  We’ve had a busy couple of weeks preparing for giving a workshop at a conference and launching our first micro-course, so this reminder is for us too.

  What’s your go-to way of cutting yourself some slack when you’re running on empty?

  #productmanagement #workplacewellbeing #teamcommunication #leadershipskills #feedbackculture #growthmindset #careerdevelopment
