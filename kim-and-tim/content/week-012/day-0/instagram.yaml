posted: 2025-09-04
caption: |-
  🥪 Ever tried the "feedback sandwich"? Compliment, criticism, compliment.

  Sounds neat, but it rarely works.
  Some only hear the praise. Others only hear the criticism. The rest? Just noise.

  Better feedback is simple:

  ✅ Be clear about the behaviour
  ✅ Explain the impact
  ✅ Give space to respond

  If your feedback is kind and useful, it doesn’t need wrapping. Read more feedback techniques at productkind.substack.com

  What’s the hardest part of giving feedback for you?

  #productmanagement #workplaceculture #leadershipskills #feedbackculture #teamcommunication #workplacelearning #growthmindset #careerdevelopment #teambuilding #productcommunity
