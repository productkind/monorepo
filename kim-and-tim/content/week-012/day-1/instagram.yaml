caption: |-
  Giving feedback at work can feel harder than it should. 😩
  Do you stay quiet and let the yoghurt thief strike again? Or do you speak up and risk making it awkward?

  Feedback doesn’t need to be wrapped in compliments or avoided until it explodes.

  ✴️ Timing matters: feedback works best when it’s close to the event.
  ✴️ One-on-one setting: avoids embarrassment and keeps it constructive.
  ✴️ Empathy over impatience: curiosity makes feedback easier to give and receive.

  Clear, kind, timely feedback helps everyone grow.

  How do you decide when the right moment is to give feedback?

  (The 🍕 emoji designed by OpenMoji – the open-source emoji and icon project. License: CC BY-SA 4.0)

  #productmanagement #workplaceculture #feedbackculture #leadershipskills #teamcommunication #growthmindset #workplacelearning
alt:
  panels:
    - |-
      Panel 1 – Monday:
      A white background with a purple outline. On the left is a tall fridge drawn in simple purple lines. To the right of the fridge stands a small cartoon chick. The chick’s body is half inside a cracked eggshell, and it’s wearing a bright green hoodie. Its wings are folded across its chest, and its face looks frustrated. Above its head, text reads: “Again?! I need to give him feedback.”
    - |-
      Panel 2 – Tuesday:
      The same chick stands on the left, wings raised angrily, beak open as if shouting. The speech bubble says: “I cannot deal with this behaviour!!!”
      On the right stands a hedgehog character. The hedgehog has purple spines, a white face, and is wearing orange dungarees over a striped shirt. It holds a slice of pizza in one hand and looks calm. The hedgehog’s speech bubble says: “Just give him feedback.”
    - |-
      Panel 3 – Wednesday:
      The chick stands on the left, looking annoyed. A speech bubble from the chick says: “khm… Croc, that’s my yoghurt…”
      On the right is a green crocodile. It wears a white shirt with a red bow tie and red trousers. The crocodile holds a yoghurt pot decorated with two cherries in one hand and a spoon in the other. It looks apologetic and says: “I am terribly sorry, I thought it was office supply…”
    - |-
      Panel 4 – Thursday:
      The fridge is now open, showing shelves full of food. Inside are several yoghurt pots with cherry logos, a jug of milk, a bunch of bananas, an apple, a fish, and a brown takeaway box.
      The chick stands in front of the fridge with wide eyes and heart shapes instead of pupils, looking delighted.
      Next to the fridge, the crocodile stands proudly, pointing towards the shelves. Its speech bubble says: “This is all yours!!!”
  strip: |-
    Panel 5 – Full strip:
    All four panels are shown together in a square comic-strip layout, labelled Monday through Thursday. The story shows the chick upset about someone eating its yoghurt, talking to the hedgehog, confronting the crocodile, and finally receiving a fridge full of yoghurts.
