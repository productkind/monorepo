posted: 2025-06-19
caption: |-
  Ever found yourself overthinking a user story? 🤔

  Should it rhyme? Should it be in emoji Should I channel Shakespeare or just... write the thing?

  This one’s for anyone who’s stared too long at a blank Jira issue.

  User stories aren’t about perfect wording – they’re about starting a conversation in your product team.

  Format is optional. Clarity isn’t.

  (All emojis designed by OpenMoji – the open-source emoji and icon project. License: CC BY-SA 4.0)
alt:
  panels:
    - |-
      A small chick in a green hoodie sits at a laptop, looking thoughtful. Text above reads:
      “Hmm… Should I write this user story like a haiku? Or maybe in emoji?”
      A string of emoji (camel, pizza slice, rainbow) follows. The scene is simple, with a white background and purple outlines.
    - |-
      The chick is still at the laptop. A white otter in blue jumpsuit holds a mug labelled “talk > type” and stands beside it. 
      The otter says:
      “Honestly, chick, don’t sweat the format! The most important thing is to spark a conversation in your product team.”
      The chick responds: “Phew! So I don’t need to write it in iambic pentameter?”
    - |-
      The otter, still holding the mug, smiles as it continues:
      “What’s important to communicate is who wants to achieve what, and why.”
      The chick replies: “Thank you, Kim! I will try that.”
    - |-
      The otter tells the chick:
      “You’re welcome, Chick! User stories are conversations, not documents.”
      The chick, now visibly relieved, says:
      “Thanks, Kim! You’ve saved me from writing a sonnet about button placement.”
      Both are smiling.
  strip: A 4-panel comic strip featuring a chick in a green hoodie at a laptop and an otter in pyjamas with a “talk > type” mug. The chick agonises over how to write a user story –perhaps as a haiku, in emoji, or in iambic pentameter. The otter reassures it that the format doesn’t matter; what’s important is sparking a conversation about who wants to achieve what and why. The strip ends with the chick joking about being spared from writing a sonnet about button placement. The strip is credited to "productkind".
