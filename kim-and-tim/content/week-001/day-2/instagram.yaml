caption: |-
  “Shared documents are not shared understanding.”

  User stories don’t work because we wrote them down.
  They work when everyone gets what they mean.

  That’s what Part 1 of Mastering User Stories is all about: The power of conversations. The ones that happen before anyone even opens a text editor.

  Read it on productkind.substack.com 💬
alt:
  panels:
    - A close-up of two characters from the shoulders down – on the left, a chick in a green hoodie, and on the right, a grey character in a blue sleeve. They’re each holding one end of a small paper filled with writing.
    - The chick in the green hoodie stands on the left, facing a grey rhino wearing a white apron and holding a chocolate cake with purple icing. Both characters look at each other blankly, suggesting confusion or miscommunication.
    - 'A photo of a chocolate sheet cake with purple sprinkles. It’s decorated with the text, “Thanks for a great year in Purple.” The word “Purple” appears to be mistakenly included as literal content, possibly due to a misunderstood instruction. Caption at the bottom reads: “Source: cakewrecks.com.”'
    - Three characters are gathered around a table with the cake. On the left is a cheerful hedgehog in yellow overalls holding a piece of cake. In the centre is the chick smiling, and on the right is a smiling otter in a turquise jumpsuit. The otter says, “Shared documents are not shared understanding!”
  strip: |-
    A 4-panel comic strip:

    1. A chick and a grey character each hold one end of a shared document with squiggles.
    2. The chick stares at a rhino in an apron who presents a chocolate cake, and they both seem puzzled.
    3. A photo of a real cake reads, “Thanks for a great year in Purple,” implying a miscommunication.
    4. At a table with the cake, the chick is flanked by a cheerful hedgehog and a smiling otter who says, “Shared documents are not shared understanding!”

    The strip playfully illustrates how handing over a document doesn’t guarantee mutual understanding – highlighting the pitfalls of assumptions and miscommunication in team settings.
