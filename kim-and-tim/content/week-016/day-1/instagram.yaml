caption: |-
  Sometimes what users ask for isn’t what they really need.
  Before jumping to solutions, dig deeper, ask why.
  That’s where the real problems (and real opportunities) live.

  💡 Keep asking until it makes sense.

  Read how to ideate the features of a new product on productkind.substack.com

  #ProductDesign #UXResearch #ProductManagement #BuildTheRightThing #ProductKind
alt:
  panels:
    - 'A simple cartoon shows a chick in a green hoodie at a laptop saying, “Okay, I’ve defined the user’s problem: ‘They need a button to export their data as a PDF.’” An otter wearing an orange jumpsuit listens beside them.'
    - The same two characters. The otter, still in the orange jumpsuit, says, “That sounds more like a solution. But why do they need a PDF?” The chick replies, “So they can share their progress in the weekly team meeting.”
    - The otter asks, “And why is it important for them to share their progress?” The chick at the laptop answers, “Because they want their team to see the value of their work.”
    - The chick smiles and says, “Oh! So the real need is "to feel recognised and valued by their peers". A PDF is just one way to do that. Maybe there’s a better one!” The otter smiles and replies, “Now we’re solving the real problem.”
  strip: A four-panel comic featuring a chick at a laptop and an otter in a jumpsuit. The conversation moves from defining a user’s problem as needing a PDF export button, to uncovering the deeper need—to feel recognised and valued by their peers. The strip ends with both characters smiling, having identified the true problem.
