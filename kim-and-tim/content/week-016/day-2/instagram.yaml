posted: 2025-10-08
caption: |-
  Have you ever started designing a solution before confirming the problem? 🐣🐱🐌

  Sometimes the simplest fix hides in plain sight.
  Asking “what’s the user really trying to do?” can turn a week-long project into a quick afternoon task.

  Simple for the user. Simple for the team.

  Read our article on how to define the problem on productkind.substack.com

  #productdesign #ux #productmanagement #productcomic #buildinpublic #teambuilding #productthinking
alt:
  panels:
    - A cartoon chick in a green hoodie and a purple cat in a pink jumpsuit stand before a wall covered in sticky notes. The chick says, “To solve this, we’ll need a new database table, a custom front-end interface, and a three-step validation process…” The cat replies, “That sounds complicated for the user. And for us.”
    - The chick and cat stand before the same wall of sticky notes. A green snail in a dress leans in from the side and asks, “Sorry to interrupt... what was the original user problem you’re trying to solve?”
    - The trio stands together in front of the wall. The chick says, “Oh, they just want a way to quickly find all their projects from last year.” The cat responds, “Hmm. What if we just improved the existing search? I could add a date-range option this afternoon.”
    - The chick looks surprised and says, “You can do that? This afternoon?” The cat smiles and says, “That’s brilliant! Simpler for the user, and faster for us.” The snail stands nearby, pleased.
  strip: A four-panel comic showing a chick, a cat, and a snail discussing a product solution. Initially, the team overcomplicates the task with technical plans. The snail asks what user problem they’re solving, leading the team to realise a simple search update will do. They end happy with the easier, faster solution.
