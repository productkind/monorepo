caption: |-
  Brainstorming without a clear user problem feels like throwing post-its into the wind. 🌬️

  When you start from the user’s challenge — who they are, what they’re trying to do, and what’s in their way — you have a higher chance of building something that ends up being valuable for them.

  It’s not fewer ideas you need, just better-framed ones.

  Read how to ideate a new product at productkind.substack.com 💡

  #productmanagement #designthinking #productdiscovery #ux #productteam #problemsolving #brainstorming #usercentric
alt:
  panels:
    - Four cartoon animals—a white otter in a purple jumpsuit, a purple cat in pink, a chick in green, and a snail in lime green—stand in front of a whiteboard covered in pink and yellow sticky notes. The cat says, “We’ve got so many ideas!” and the otter replies, “For what?”.
    - The same four characters stand before the sticky note-covered board. The cat and chick now have spiral eyes, looking confused. The snail asks, “What problem are we actually solving?”
    - 'The four animals stand in front of a board with a list that reads: “Who’s the user? What are they trying to achieve? What’s stopping them? What’s the root of the problem? What’s their emotion?” The otter holds a pencil, looking thoughtful.'
    - The group stands in front of the sticky note board again, now smiling. The chick says, “We started from the user problem, and our new ideas make sense now!”
  strip: A four-panel comic combining the previous scenes. It shows the team’s journey from having many unfocused ideas to clarifying the user problem and feeling confident in their solutions.
