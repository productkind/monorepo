caption: |-
  Ever caught yourself writing one of those monster user stories with far too many user actions?

  Watch out for the “and”s – each one’s a clue you’re slipping in extra work.

  More “and”s mean more scope creep and more headaches for your devs.

  Keep your stories small. One user action at a time means faster to test, clearer to build, and easier to fix.

  Small stories, happy teams.
