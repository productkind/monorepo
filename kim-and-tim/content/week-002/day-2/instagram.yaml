    - |-
      A simple cartoon shows a chick in a green hoodie at a laptop, talking to a smiling otter wearing a green jumpsuit and holding a mug labelled ‘curiosity’.

      The chick says, “Right… so the user should log in and upload a photo and update their profile and…” The otter listens patiently.
    - The otter says, “Chick, that ‘and’ is a red flag. Each ‘and’ means you’re cramming in extra activities.” The chick replies, “So… I shouldn’t do ‘and, and, and’?”
    - The otter responds, “Exactly! Break it down. One user activity per story keeps your scope clear and your devs sane.” The chick says, “Got it. One step at a time, no ‘and’ storms.”
    - |-
      A close-up shows the chick looking at a screen with a user story: “CHIRA ANML-20481: As Chick, I want to write fewer ‘and’s so my team doesn’t run away.”

