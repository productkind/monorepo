posted: 2025-06-30
caption: |-
  Your devs shouldn’t need a Rosetta Stone to read your backlog. 🗿✨

  Save the "As a [persona], I want to…" for the description – your team will thank you.
  A good title just says who does what, simply: "[Persona] can view courses."

  Clear titles make scanning easy, conversations smoother, and your backlog far less of a maze.
alt:
  panels:
    - A computer screen displays a project management tool labelled “CHIRA”. The task list shows multiple items starting with “ANML-20455 - As Giraffe, I want t...”. A character’s round yellow head and hair tuft peeks up at the bottom.
    - A small chick wearing a green hoodie sits at a laptop. Next to the chick, an otter wearing a yellow jumpsuit holds a mug labelled “curiosity” and says, “Chick, save the full story for the description”. The chick asks, “So I shouldn’t copy it all into the title?”.
    - The otter in the yellow jumpsuit says, “Exactly. Good titles say who does what, simply. ‘Giraffe can view courses’ is clear and easy to scan.” The chick replies, “Oh, my Chira board will finally make sense!” while sitting at the laptop.
    - Back to the computer screen, now the same “CHIRA” task list shows clear emoji icons instead of long titles – giraffes and simple symbols replace the repetitive text. The chick’s head is still peeking up.
  strip: 'A four-panel comic featuring the above scenes in order: a cluttered “CHIRA” board, the chick, wearing a green hoodie, and an otter, wearing a yellow jumpsuit, discuss how to write good titles, and the improved, clear board.'
