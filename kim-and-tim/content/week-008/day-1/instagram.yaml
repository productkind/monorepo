caption: |-
  When we share challenging news, our instinct is to jump straight into problem-solving mode.

  But when people get hit with bad news, they don’t need a solution right away.
  They need a moment to process it.

  You can try these steps:
  ☕ Pause
  ☕ Acknowledge the reaction
  ☕ Give space to emotions

  Even if the news is about the most important machine in the office ☕💔
alt:
  panels:
    - 'Three cartoon characters are standing side by side: a chick wearing a green hoodie, a purple cat in bright pink shirt and trousers set, and glasses, and a snail in a green dress. The chick is speaking gently, saying, “I’m afraid I’ve got some bad news… The coffee machine’s broken, no coffee today.” The cat and the snail look perplexed. The background is white with a thick purple border.'
    - 'Same three characters in the same positions. This time, the snail is reacting dramatically. It shouts in shock: “What?! The coffee machine’s broken?? NO COFFEE TODAY???” The cat’s expression is still perplexed — eyes as X shapes behind glasses. The chick remains calm.'
    - |-
      This panel is titled “What you feel like doing:”
      The chick responds with a pragmatic idea: “But we can walk to the nearest coffee shop!” The cat looks slightly annoyed or unimpressed, with narrowed eyes. The chick stays calm. The snail, standing on the right, now looks properly irritated — eyes narrowed in a flat, unimpressed stare.
    - This panel is titled “What you should do:” The chick looks quietly supportive as it says gently, “I hear you… It’s tough.” The cat has softened its expression. A small blue tear is under its eye, and the snail is also crying now. The characters are expressing empathy and shared disappointment.
  strip: A full comic strip combining the four panels from above in a 2x2 grid layout. The top row has the first two panels (the bad news and the shocked reaction). The bottom row shows the chick's first instinct to fix the problem, followed by a more emotionally supportive response. Each panel is outlined in purple, and the comic has a light-hearted but kind tone. The bottom right of each panel features the logo productkind.
