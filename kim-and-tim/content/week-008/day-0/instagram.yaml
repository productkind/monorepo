caption: |-
  No one loves sharing bad news… But it's part of being a leader.

  Here’s a simple way to do it well: Brace. Hit. Hold.

  🔹 Brace: Signal clearly that you’ve got tough news.
  🔹 Hit: Be honest, don’t sugar-coat or delay.
  🔹 Hold: Give people space. Don’t rush to fix.

  Even if it’s “the coffee machine’s broken” ☕💔

  What’s the hardest update you’ve had to share?

  👀 Read more at productkind.substack.com
