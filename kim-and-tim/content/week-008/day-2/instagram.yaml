posted: 2025-08-12
caption: |-
  When something goes wrong, we often feel temptation to spin it. 
  Make it sound like a good idea, or distract with humour. Anything but owning the issue.
  But spin erodes trust.

  The brave move?
  👉 Be honest.
  👉 Be direct.
  👉 Say sorry.

  People can handle the truth. What they won’t forgive is being misled.

  Read how to share bad news and handle the aftermath 👉 productkind.substack.com
alt:
  panels:
    - |-
      A cartoon bunny in a shirt and tie holds a folded umbrella and looks panicked, with spirals for eyes and an X for a mouth. They say, “The last batch of umbrellas won’t open, and we’ve already sent them out.”
      Next to them, a smiling cartoon mouse in a bright orange shirt and purple trousers replies calmly, “No worries, I’ll handle it…” The mouse seems unfazed, while the bunny is clearly overwhelmed.
    - |-
      A social media post from Animal Inc is shown on a laptop screen. The post reads:
      “If you’ve got one of our latest umbrellas, you might find it doesn’t open properly. On the bright side, it’s perfect for re-enacting your favourite sword-fighting scenes.”
      The back of the mouse's head is visible in front of the laptop, suggesting they are typing the message. The tone of the message is overly cheerful and avoids owning the issue.
    - |-
      The mouse is now seated at a desk, smiling at their laptop. The otter — wearing a green jumpsuit — stands beside them and says:
      “When delivering bad news, don’t try to spin it. It just makes people trust you less. Be clear, honest, and direct.”
      The otter offers calm, kind advice while the mouse listens.
    - |-
      Another social media post from Animal Inc is shown on a laptop. This one reads simply:
      “We f*cked up. Sorry!”
      Again, we see the back of the mouse's head as they face the screen, this time delivering a direct and honest message.
  strip: |-
    A four-panel comic strip summarising the previous scenes.
    Top left: The bunny panics about faulty umbrellas, and the mouse promises to handle it.
    Top right: The mouse posts a playful, evasive message online about the faulty product.
    Bottom left: The otter offers guidance, saying not to spin bad news.
    Bottom right: The mouse posts a blunt and honest apology from the company.
    The comic ends with a message about building trust through honesty.
    The comic is branded with the "productkind" logo.
