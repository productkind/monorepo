    - The otter holds up the book Continuous Discovery Habits and says, “Continuous Discovery Habits by Teresa Torres. It teaches you a structured way to do product discovery, so you can figure out what to build.” The chick looks interested.
    - Now the otter holds User Story Mapping while the chick holds Continuous Discovery Habits. The otter says, “User Story Mapping by Jeff Patton will help you to break big ideas into manageable pieces your team can actually build, and to make sure everyone understands the big picture.”
  strip: |-
    A simple comic strip featuring a small, confused chick and a friendly otter mentor. The chick wears a green hoodie and looks overwhelmed, with swirly eyes at times. The otter always wears a teal jumpsuit.

    In the first panel, the chick admits they feel lost with too many resources on product management and don’t know where to start. The otter gently asks, “What do you want to learn?”
    In the second panel, the chick exclaims, “Everything!” The otter calmly suggests starting with just two books that have practical advice to use right away.
    In the third panel, the otter shows Continuous Discovery Habits by Teresa Torres, explaining it teaches a structured way to do product discovery, so the chick can figure out what to build.
    In the fourth panel, the otter adds User Story Mapping by Jeff Patton, describing how it helps break big ideas into smaller, buildable parts and makes sure everyone sees the big picture. The chick now holds both books and looks more hopeful.

    The comic ends with the otter’s supportive guidance helping the chick feel less overwhelmed about learning product management.
