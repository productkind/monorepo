caption: |-
  Feeling overwhelmed by all the product management advice out there? You’re not alone.

  We recommend starting with just two books that have practical advice you can use right away:

  📘 Continuous Discovery Habits by Teresa Torres: teaches you a structured way to do product discovery, so you can figure out what to build.
  📗 User Story Mapping by Jeff Patton: teaches you how to break big ideas into manageable pieces your team can actually build, and how to keep everyone clear on the big picture.

  What was the product book you found the most useful?
