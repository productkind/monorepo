caption: |-
  Too busy to read? 🎧✨

  If you’d rather learn on the go, here are three product management podcasts we love:
   ⭐ Product Thinking with @melissaperri 
   🔥 Lenny’s Podcast @lennyspodcast 
   🧩 All Things Product with Teresa and Petra @strongproductpeople 

  Tune in when you’re walking, commuting, or waiting for your coffee. Small moments add up.

  Got any favourites to add?
alt:
  panels:
    - A cartoon chick in a green hoodie asks, “Hey Kim, I don’t have much time to read… could you recommend some podcasts to help me get better at product management?” Next to the chick, an otter wearing a teal jumpsuit replies, “Absolutely!” The ‘productkind’ logo is in the bottom right corner.
    - An illustration of a podcast player on a phone screen shows the cover art for “Product Thinking with Melissa Perri”. The player has play and skip buttons below the artwork. The ‘productkind’ logo appears in the bottom right corner.
    - A podcast player on a phone displays the cover art for “Lenny’s Podcast”, which shows a campfire with two marshmallows on sticks. Play and skip buttons are underneath. The ‘productkind’ logo sits in the bottom right corner.
    - A podcast player on a phone shows the cover art for “All Things Product with Teresa and Petra”, featuring an abstract network of connected dots and lines. Play and skip buttons are below. The ‘productkind’ logo is in the bottom right corner.
  strip: |-
    A four-panel comic strip:

    The chick asks Kim the otter for podcast recommendations to learn product management.
    Kim suggests “Product Thinking with Melissa Perri”.
    Kim also suggests “Lenny’s Podcast”.
    Kim adds “All Things Product with Teresa and Petra”.
