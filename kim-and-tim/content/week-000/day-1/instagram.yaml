caption: |-
  Meet the stakeholders of our product company 🐊🐰🐭🦉

  A CEO who’s regularly running late from meetings, a sales manager who would sell anything, a snack-fuelled marketer, and a well-hydrated HR manager.

  Everyone adds their own strengths (and their own challenges).
  It still works – because they work together.

  Which one do you work with? Or... are you one of them?
