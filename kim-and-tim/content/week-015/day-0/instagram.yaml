caption: |-
  Building an MVP is a bit like making half a sandwich 🥪

  You don’t need the whole thing, but you do need the right ingredients.

  And the only way to find out if those ingredients work? Ask for feedback.

  👩🏽‍🏫 Read about our learnings from carving out an MVP for Little Parrot: productkind.substack.com

  (The sandwich emoji designed by OpenMoji – the open-source emoji and icon project. License: CC BY-SA 4.0)

  #MVP #productdevelopment #softwaredevelopment #buildingproducts #productteam #experimenting
alt:
  panels:
    - 'A small chick in a green hoodie stands next to an otter in an indigo jumpsuit, who is holding half a sandwich. The otter says: “Building an MVP is like making half a sandwich. You don’t need the whole thing, but you still need the essential ingredients.”'
    - The chick asks, “How do you know if the ingredients are right?” The otter, still holding the sandwich, replies, “You need to give it to the people whose problem you want to solve.” They stand at a table.
    - The chick asks, “Then what?” The otter replies, “You have to get feedback from them.”
    - A hedgehog in an orange dungaree joins the chick and otter, saying, “There was a great half sandwich in the kitchen. Do you know something about the other half?” The otter smiles.
  strip: 'A four-panel comic featuring a chick, an otter in a jumpsuit, and later a hedgehog. The otter uses a sandwich metaphor to explain how building a minimum viable product works: you only need half a sandwich with the essential ingredients, you must test it with the right people, and then gather feedback. The joke ends with the hedgehog looking for the missing half of the sandwich.'
