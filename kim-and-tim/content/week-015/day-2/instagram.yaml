caption: |-
  MVPs always feel too small.
  But here’s the secret: they’re meant to.

  When Jeff Bezos launched Amazon, the MVP wasn’t a slick all-in-one marketplace. 
  It was just books. Books were easy to source, cheap to ship, and had global demand.

  Behind the scenes, Amazon’s MVP used a Wizard of Oz approach.
  Customers ordered online, but Bezos himself purchased the books from a shop and had them shipped manually.

  That tiny, scrappy MVP turned into… well, you know.

  So if your MVP feels embarrassingly small, you’re on the right track. 

  👉 Read about how to scope an MVP at productkind.substack.com

  #ProductManagement #MVP #ProductDesign #Startups #ProductStrategy
