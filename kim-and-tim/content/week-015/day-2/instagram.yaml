  panels:
    - A chick in a green hoodie sits at a laptop, saying, “MVPs always feel too small.” Next to them, an otter in a pink jumpsuit listens.
    - The chick points at a computer screen showing an early Amazon homepage, saying, “Look! Even Amazon had many functionalities early on!”
    - The otter smiles, now standing closer to chick and the laptop. Points at the screen and says, “This was their actual MVP”.
    - The computer shows a very simple early Amazon webpage. The chick says, “Thanks… that makes MVPs feel less scary.”
  strip: A comic strip where a chick and an otter discuss how MVPs (minimum viable products) often feel too small. The chick compares MVPs to an early Amazon homepage, but the otter explains that Amazon’s true MVP was much simpler. The chick realises this makes MVPs less intimidating.
