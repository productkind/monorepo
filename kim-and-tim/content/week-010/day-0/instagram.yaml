caption: |-
  🪄 Ever tried vibe coding? It feels magical: describe an app in plain English, and AI builds it for you. ✨

  But ask for “a way to get from A to B” and you might end up with… a hamster-powered car. 🐹🚗

  AI can create shiny things fast.

  What it can’t do is tell you if they’re actually valuable to your users.

  That’s still the role of product teams: making sure what gets built isn’t just impressive… but truly useful.

  Read more in our latest piece → What AI Can’t Do for Product Teams (link in bio).

  #ProductManagement #ProductTeams #FutureOfWork #DigitalProducts #AIProductManagement #ProductThinking #ProductDesign #PMlife
alt:
  panels:
    - |-
      A four-panel comic about “vibe coding” in product management.
      Panel 1: A Reddit post from r/ProductManagement asks: “Vibe coding is real — are PMs the new builders?” A PM explains they’ve worked for 7 years helping to build products.
    - 'Panel 2: Inspired by the Reddit thread, a small yellow chick wearing a green hoodie sits at a laptop, thinking: “Hmm, I should really try this vibe coding on this user story.”'
    - 'Panel 3: The chick is looking at a user story: “As a traveler, I want to get from A to B, so that I can reach my destination efficiently and safely.”'
    - 'Panel 4: The chick stands next to an otter in a teal jumpsuit. Behind them is an over-engineered contraption: a car body connected to a hamster-powered bicycle on a conveyor belt. The chick says: “I mean, it gets you from A to B, but…”'
  strip: 'Four-panel comic about vibe coding in product management. A Reddit post asks if PMs are the new builders. A chick in a green hoodie thinks about trying vibe coding on a user story. The chick is looking at a user story: “As a traveler, I want to get from A to B, so that I can reach my destination efficiently and safely.” The final panel shows the chick and an otter in a teal jumpsuit look at an over-engineered machine – a hamster-powered bike attached to a car – with the chick saying it gets you from A to B, but…'
