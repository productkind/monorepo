caption: |-
  🪞 The "Encourage Self-Criticism" prompting technique helps AI improve its own answers by reflecting on what could be better.

  💡 Tip: After the first draft, try asking:
  “Critique your solution thoroughly, and improve it using your own critique.”

  You’ll often get a second version that’s sharper, simpler, and more human, without needing to wrangle it for ages.

  🔖 Read other practical prompting techniques at productkind.substack.com
alt:
  panels:
    - A simple, playful cartoon scene shows a mouse character in a bright orange shirt and purple trousers, standing next to a friendly-looking purple robot with a conveyor belt base. The mouse says, “Let’s go. Blog post on ‘why we redesigned the dashboard’. Time to sound smart and strategic.”
    - Continuing the scene, the robot announces, “Draft complete! Includes a bold opening, four alliterations, and a reference to Greek mythology.” The mouse, now looking unimpressed, replies, “Hmm. This sounds like I’m trying too hard at a dinner party.”
    - The mouse, back to looking normal, asks, “What if I asked you to critique your own draft? Be honest, what would you fix?” The robot responds, “I’d simplify the intro, drop the Hercules bit, and clarify the user benefit in paragraph three.”
    - The mouse looks genuinely impressed and says, “Wow. That’s… actually very good. Why didn’t you just say that the first time?” The robot replies, “I try to impress on the first go. I improve on the second.”
  strip: A four-panel comic strip showing a humorous exchange between a mouse character and a robot as they draft and refine a blog post about a product redesign. The comic gently critiques generating blog posts with AI while showing the value of the "Encourage self-criticism" prompting technique. Branding in the bottom right reads “productkind”.
