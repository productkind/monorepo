caption: |-
  Prompting isn’t a one-shot game, it’s a process.

  The most effective technique? Iterate and Refine.
  Try something, see what works, adjust, and try again. That loop is where the magic happens.

  There are several other useful techniques as well, but no matter where you start, refining is what gets you to quality.

  Prompting is about being curious and exercising critical thinking while working with the AI.

  🔗 Useful prompting techniques at productkind.substack.com

  What’s your go-to move when prompting AI?
