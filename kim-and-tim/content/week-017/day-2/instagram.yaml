caption: |-
  Many of us set goals like “get promoted” or “move up.”
  But when we pause to ask why, we often find something deeper underneath, just like in product management.

  Coaching helps uncover that layer.
  It’s not just about chasing titles, but about growing into the kind of person who leads with clarity and confidence.

  Read more about mentoring at productkind.substack.com

  #productmanagement #careerdevelopment #productcoach #growthmindset #leadership #productkind
alt:
  panels:
    - A white otter in a blue jumpsuit smiles and greets a small yellow chick wearing a green hoodie. The otter says, “Welcome, chick! Before we dive in, what’s your main goal for our sessions together?”
    - The chick in a green hoodie replies to the otter, saying, “I’d like to get a promotion to Senior Product Manager.” The otter listens with a friendly expression.
    - The otter, still smiling, says, “That’s a great goal. Can I ask, what will getting that role do for you?” The chick looks thoughtful and replies, “What will it… do for me? I haven’t really thought about it like that.”
    - The chick responds, “I suppose I want to feel more confident in my decisions and lead a product I truly believe in…” The otter replies warmly, “Excellent. Now we know where to start.”
  strip: A four-panel comic featuring the otter in a blue jumpsuit coaching the chick in a green hoodie. The otter asks about the chick’s goals, prompting the chick to reflect. The chick realises they want confidence and purpose, and the otter affirms this as a starting point.
