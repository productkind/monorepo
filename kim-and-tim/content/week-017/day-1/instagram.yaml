posted: 2025-10-13
caption: |-
  Mentoring isn’t about creating a copy of yourself.
  It’s about helping someone grow into their own strengths.

  A good mentor doesn’t hand out instructions; they ask questions that help you find your own path.

  Read about how to get started with mentoring on productkind.substack.com

  #mentoring #leadership #productmanagement #careerdevelopment #learningculture #productkind #comic
alt:
  panels:
    - A cartoon chick in a green hoodie holds a pen and notepad, speaking eagerly to an otter wearing a peach jumpsuit. The chick says, “Right, first mentoring session! Tell me everything I need to do to become just like you.”
    - The otter in a peach jumpsuit smiles kindly at the chick in a green hoodie, replying, “That’s very flattering, chick, but this isn’t a cloning factory.”
    - The otter in a peach jumpsuit continues the mentoring conversation, saying, “My goal is to ask you questions that bring you closer to creating yourself and help you find the tools.” The chick listens attentively, still holding a notepad and pen.
    - The chick in the green hoodie looks thoughtful and says, “Oh! So I can still be me, but… a me with a better roadmap?” The otter smiles warmly in response.
  strip: A four-panel comic depicting the mentoring conversation between the chick and the otter, both wearing their respective green hoodies and peach jumpsuits. The dialogue progresses from the chick wanting to be like the otter, to the otter explaining that mentoring is about self-discovery, ending with the chick realising they can still be themselves, with a better roadmap.
