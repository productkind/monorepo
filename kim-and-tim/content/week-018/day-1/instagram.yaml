caption: |-
  When your job title changes, it’s easy to wonder if your identity has too.

  But often, your why stays the same; you’re still helping people think, learn, and grow.
  That’s the product manager mindset in action, whatever your role is called.

  Read more about building a resilient identity on productkind.substack.com

  #productmanagement #productcoach #productcareer #productmindset #productleadership #careerjourney #productkindcomics
alt:
  panels:
    - A hedgehog wearing orange overalls is talking to an otter in a green jumpsuit. The otter says, “Since I am a ‘Product coach’, I am not a Product Manager anymore…” The hedgehog replies, “That is not necessarily true.”
    - The hedgehog asks, “What do you actually do all day?” The otter replies, “I help PMs get curious. I ask questions about why they’re building something and what problem they’re solving for the user.”
    - The hedgehog asks, “So… you’re focusing on value, questioning assumptions, and connecting people to a shared purpose?” The otter smiles and says, “When you put it like that… yes!”
    - The hedgehog says, “Your ‘what’ changed, but your ‘why’ is the same. Sounds like the PM state of mind to me.” The otter, smiling with closed eyes, replies, “You’re right. My values haven’t changed. It’s still who I am.”
  strip: A four-panel comic strip featuring the hedgehog in orange overalls and the otter in a green jumpsuit. The sequence covers their full conversation about how being a product coach still embodies the mindset and values of a product manager.
