caption: |-
  It’s easy to build our sense of self around achievements, titles, awards, and recognition.
  They feel great in the moment, but they’re fleeting.

  When those external markers fade, it can leave us wondering who we are without them.

  That’s why it helps to dig deeper.
  Ask why you do what you do.
  Your why, your values, motivation, and purpose create a steadier kind of identity.

  Read more about how to find your identity on productkind.substack.com

  #productkind #selfawareness #growthmindset #careerdevelopment #leadership #valuesdriven #workculture #motivation #reflection
alt:
  panels:
    - A cartoon mouse and rabbit stand side by side. The rabbit says, “I didn’t win the ‘Sales Manager of the Year’ award…” and the mouse replies, “Oh, Rabbit. That’s rough.” The mouse wears a bright orange shirt and purple trousers; the rabbit wears a white shirt, blue trousers, and an orange tie.
    - The mouse asks, “But why did you want the award so much? You’re already our top salesperson.” The rabbit replies, “It’s not the trophy… It’s the recognition!” They’re in the same positions, smiling slightly.
    - A giraffe joins the mouse and rabbit, smiling warmly. The giraffe says, “Rabbit! I had to find you. That new product you sold me? It’s been a total game-changer!” The rabbit looks surprised and replies, “It has?”
    - The giraffe says, “Yes! You’ve helped my business so much. Thank you!” The rabbit smiles and says, “I am glad to hear that! Would you get that engraved on a plaque?” The mouse smiles beside them.
  strip: 'A four-panel comic showing the same mouse, rabbit, and giraffe sequence: the rabbit is disappointed about not winning an award, explains it’s about recognition, then receives heartfelt thanks from a giraffe customer, ending with a light-hearted joke about engraving it on a plaque.'
