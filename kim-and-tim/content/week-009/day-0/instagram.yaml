posted: 2025-08-14
caption: |-
  When bad news hits a team, rushing into “fix mode” can backfire. 😤
  In our well-being workshop, we started with something simple but powerful: space to vent.

  Two minutes each to complain, rage, or sigh before shifting to solutions we actually could control.

  Sometimes the best productivity hack is letting people process their emotions.

  Our guide might help if you have to process difficulties with your product team → "How to Run a Team Well-being Workshop" at productkind.substack.com 😌
