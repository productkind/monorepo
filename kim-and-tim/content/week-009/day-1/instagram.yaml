posted: 2025-08-18
caption: |-
  🧖🏽‍♀️ A well-being workshop isn’t about having a spa day, it's about taking control.

  We recommend splitting it into two parts:
   🔶 Problem space → get everything bothering us out in the open (yes, even the indoor pigeon).
   🔶 Solution space → find solutions for the most pressing problems we identified.

  This way, the team leaves with clarity, actions, and maybe… with the hope of a coffee machine that works. ☕️

  Read more about "How to Run a Team Well-being Workshop" at productkind.substack.com
alt:
  panels:
    - An otter in a turquoise jumpsuit leans into the scene, asking a chick in a green hoodie, a purple cat in a magenta outfit, and a snail in a green dress, “What’s the progress with your team well-being workshop, folks?” In the background, a whiteboard is covered in sticky notes, and a pigeon perches on top.
    - 'The same scene, but the chick responds, listing possible improvements: “Well… we could start yoga, fix the coffee machine, deal with the squeaky chairs, find who keeps hiding the office snacks, and do something about the indoor pigeon.”'
    - 'The otter says, “Okay, let’s bring some structure. Problem space: what are the problems we want to solve?” The chick answers, “Broken coffee machine, squeaky chairs, snack theft, indoor pigeon.” The pigeon is now perched on the wall.'
    - 'The otter says, “Great. Now, solution space: let’s come up with fixes for our top problems.” The chick replies, “New coffee machine, oil the chairs, lock the biscuits… and give the pigeon a proper desk.” In the background on the whiteboard, there is a drawing of the pigeon at a desk using a laptop. The real-life pigeon is still perched on top of the whiteboard, looking at the drawing.'
  strip: |-
    Four-panel cartoon featuring an otter in a turquoise jumpsuit, a chick in a green hoodie, a purple cat in a magenta outfit, a snail in a green dress, and a pigeon.
    Panel 1: The otter asks about progress on the team well-being workshop.
    Panel 2: The chick lists possible improvements, including yoga, fixing the coffee machine, dealing with squeaky chairs, stopping snack theft, and addressing the indoor pigeon.
    Panel 3: The otter suggests defining the problem space, and the chick lists the same four issues, but framed as problems.
    Panel 4: The otter moves to the solution space, and the chick proposes specific fixes, including giving the pigeon a desk, shown in the background using a laptop.
