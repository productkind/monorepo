script: |-
  If you're the one remembering what needs buying, booking, doing, and when the baby last ate, build this.

  Just say everything that's on your mind. It doesn't need to be organised.

  Your phone sorts it into neat checklists…

  And the same idea works for all those tiny things you need to keep track of with a baby.

  Feeds, naps, nappies, just say it, and your phone logs it.

  In our Hand Off the Mental Load course, you build both shortcuts yourself in about 20 minutes.

  The whole course is free until the 30th of August, link in comments to build your shortcuts.  
caption: |-
  When everything lives in your head, even the small things add up.

  In our Hand Off the Mental Load course, you build two simple iPhone shortcuts:

  🧠 Brain Dump - talk through everything on your mind and let AI turn it into organised checklists you can share with your partner.

  👶 Baby Log - log feeds, naps and nappies just by speaking.

  Both use the AI already on your phone, and you can build them yourself in about 20 minutes.

  The course is free until 30 August, so more mums can try it. Link in comments.

  If there’s a mum in your life who could use this, send it to her. 💛
title: "Build this to hand off some of the mental load"
