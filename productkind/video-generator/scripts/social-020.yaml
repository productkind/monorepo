script: |-
  Why are you the only one who knows you're out of nappies?

  You spot it, you remember it, and then you text someone to pick some up. That reminder is just more of the same work, and it still lives in your head.

  Here's what you can build instead. You say what's on your mind out loud, and a shortcut sorts it into lists. The first shortcut is the Brain Dump. From there the course sets up shared lists you both tick off, and it can even message the new items to your partner, so nobody has to write out the reminder by hand.

  It doesn't decide who does what. It makes the work visible, so it isn't just you carrying it in your head. What happens next is up to the two of you.

  You build it all in our course, Hand Off the Mental Load. It uses Apple's built-in AI, so you'll need an iPhone 15 Pro or newer.

  The whole course is free until the 30th of August. Head to littleparrot.app and build yours.
caption: |-
  Somehow you became the only person in the house who knows when the nappies run out. You notice it, you carry it, and then you send the reminder text, which is one more job on top of the noticing.

  So we built something that shares the knowing, not just the errand. You say what's on your mind out loud, and a shortcut sorts it into lists. Later in the course you set up shared lists you both tick off, and it can message the new items to your partner, so nobody has to write out the reminder by hand.

  It doesn't decide who does what, and it won't sort out an uneven split on its own. What it does is make the work visible, so it isn't sitting in one person's head. What happens next is up to the two of you.

  You build the first shortcut by tapping a few blocks together in the Shortcuts app that's already on your phone. It uses Apple Intelligence, so it needs an iPhone 15 Pro or newer, with nothing to download. We made it for mums.

  The whole course is free until 30 August at littleparrot.app. Follow along, and save this for the next "who's buying nappies?"
title: "Why are you the only one who knows?"
