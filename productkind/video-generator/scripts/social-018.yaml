script: |-
  There's a list in your house that runs everything, and only one person can see it. You.

  It's knowing the nappies are low, that the check needs booking, whose birthday is a fortnight on Thursday, and that someone has to be home for the boiler. It's invisible work, which is what makes it so heavy. Nobody can see it, so nobody can share it.

  Writing it down is how it stops being invisible. The trouble is paper goes out of date fast, because you're usually holding a baby or driving when the next thing pops into your head.

  So you build a list you can talk to instead. You say it out loud, and your phone sorts it onto the right list. That's the Brain Dump, the first thing you build in our course. From there the course sets up sharing, so your partner sees the same lists on their own phone.

  It uses Apple's built-in AI, so you'll need an iPhone 15 Pro or newer.

  The whole course is free until the 30th of August. Head to littleparrot.app and build yours.
caption: |-
  The mental load is the work of keeping track: the nappies running low, the appointment that needs booking, the birthday a fortnight on Thursday, the boiler service nobody else is thinking about.

  It's invisible work, which is what makes it so heavy. Nobody can see it, so nobody can share it, and you can't hand off what nobody else knows about.

  Writing it down is how it stops being invisible. The trouble is that paper goes out of date fast, because you're usually holding a baby or driving when the next thing pops into your head.

  So we made a shortcut you can talk to. You say it out loud, your phone sorts it onto the right list, and later in the course you set it up so your partner sees the same lists on their own phone. It makes the work visible. What happens next is up to the two of you.

  You build the first shortcut by tapping a few blocks together in the Shortcuts app that's already on your phone. It uses Apple Intelligence, so it needs an iPhone 15 Pro or newer, with nothing to download. We made it for mums.

  The whole course is free until 30 August at littleparrot.app. Follow along, and save this for when the list is only in your head.
title: "The list in your house only you can see"
