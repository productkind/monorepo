<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Off the Mental Load — the build on two iPhones (single slide)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; padding: 0; }
  body.single { overflow: hidden; }
  body.single #strip { padding: 0 !important; gap: 0 !important; background: none !important; min-height: 0 !important; }
  body.single section { display: none; }
  body.single section.current { display: block; }
  body:not(.crop) .cropguide { display: none; }
  @media print {
    #strip { padding: 0 !important; gap: 0 !important; background: none !important; min-height: 0 !important; display: block !important; }
    section { page-break-after: always; break-after: page; }
    @page { size: 1080px 1350px; margin: 0; }
  }

  /* Little Parrot brand tokens (inlined from brands/little-parrot.css) */
  :root {
    --grad: linear-gradient(120deg, #ffb65b, #fdd825, #fbfb00, #8efd23, #00ed70);
    --grad-wash: linear-gradient(120deg, #ffb65b20, #fdd82520, #fbfb0020, #8efd2320, #00ed7020), #ffffff;
    --font-display: 'Space Mono', monospace;
    --font-copy: 'Inter', sans-serif;
    --font-plain: 'Inter', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --weight-headline: 700;
    --weight-copy: 400;
    --ink: #080809;
    --ink-secondary: #4a4a50;
  }

  /* Shared carousel design system (subset used by this slide) */
  section.slide { flex: none; width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--grad-wash); box-sizing: border-box; }
  .card { position: absolute; top: 100px; left: 100px; width: 880px; height: 1150px; box-sizing: border-box;
    background: #ffffff; border: 12px solid var(--ink); box-shadow: 12px 12px 0 rgba(8,8,9,0.25); display: flex; flex-direction: column; }
  .gradbar { flex: none; height: 24px; background: var(--grad); }
  .inner { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 56px 72px 64px; box-sizing: border-box; }
  .slidebody { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .header { display: flex; justify-content: space-between; align-items: center;
    font-family: var(--font-display); font-weight: 700; letter-spacing: 0.06em; color: var(--ink); }
  .header .handle { font-size: 32px; }
  .headline { margin: 0; font-family: var(--font-display); font-weight: var(--weight-headline); line-height: 1.45; color: var(--ink); text-wrap: pretty; }
  .copy { margin: 0; font-family: var(--font-copy); font-weight: var(--weight-copy); font-size: 34px; line-height: 1.45; color: var(--ink); text-wrap: pretty; }
  .headline, .copy { text-align: center; }
  /* .mono puts a copy line in the display face (Space Mono), like the headline */
  .copy.mono { font-family: var(--font-display); font-weight: 700; }
  .hl { background: var(--grad); background-position: 0 50%; background-size: 100% 90%; background-repeat: no-repeat;
    padding: 0 0.12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .badge { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.06em; border: 4px solid var(--ink);
    box-shadow: 12px 12px 0 rgba(8,8,9,0.25); padding: 20px 36px; color: var(--ink); background: #ffffff; }

  /* iPhone mockup (from the design system). The dictation screenshot carries
     its own status bar and dynamic island; the lists phone uses the drawn
     status bar, in white, because its screen is Notes in dark mode. */
  .phone { --phone-w: 420px; --phone-ink: #08080f; position: relative; flex: none;
    width: var(--phone-w); aspect-ratio: 393 / 852; box-sizing: border-box;
    padding: calc(var(--phone-w) * 0.034);
    border-radius: calc(var(--phone-w) * 0.142);
    background: linear-gradient(148deg, #6e6e78 0%, #2c2c31 16%, #8b8b95 38%, #26262b 58%, #5b5b65 78%, #2f2f35 100%);
    box-shadow: 0 24px 48px rgba(8,8,9,0.30), 0 6px 14px rgba(8,8,9,0.18); }
  .phone::before, .phone::after { content: ''; position: absolute;
    width: calc(var(--phone-w) * 0.011); border-radius: calc(var(--phone-w) * 0.006);
    background: linear-gradient(180deg, #33333a, #74747e); }
  .phone::before { left: calc(var(--phone-w) * -0.009); top: 24%; height: 13%; }
  .phone::after { right: calc(var(--phone-w) * -0.009); top: 26%; height: 9%; }
  .phone .phonescreen { position: relative; width: 100%; height: 100%; overflow: hidden;
    background: #000000; border-radius: calc(var(--phone-w) * 0.108);
    box-shadow: 0 0 0 calc(var(--phone-w) * 0.016) #0a0a0c; }
  .phone .phonescreen img.photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Slide-specific: the two phones with the curly arrow between them, and
     the note slices stacked on the second screen. Every slice is a full-width
     crop of a real screenshot from the same phone, so at width:100% the text
     lines up pixel for pixel with the note underneath it. Tops are set as a
     share of 2556px, the screenshot's own height. */
  .phonepair { display: flex; align-items: center; justify-content: center; gap: 2px; }
  .curlyarrow { flex: none; display: block; }
  .noteslice { position: absolute; z-index: 2; left: 0; width: 100%; height: auto; display: block; }

  .cropguide { position: absolute; left: 0; top: 135px; width: 1080px; height: 1080px;
    border-top: 2px dashed rgba(8,8,9,0.5); border-bottom: 2px dashed rgba(8,8,9,0.5); pointer-events: none; box-sizing: border-box; }
</style>
</head>
<body>
<div id="strip" style="min-height:100vh; background:#c9c9cf; display:flex; gap:64px; padding:64px; overflow-x:auto; align-items:flex-start; box-sizing:border-box; font-family:var(--font-plain);">

  <!-- SINGLE SLIDE — course title, then the build on two real iPhones:
       the spoken brain dump, a curly arrow, the lists it wrote -->
  <section class="slide" data-screen-label="01 Mental load on two iPhones">
    <div class="card">
      <div class="gradbar"></div>
      <div class="inner">
        <div class="slidebody" style="gap:20px; align-items:center; justify-content:flex-start; padding-top:8px;">
          <h1 class="headline" style="font-size:44px;">Hand Off the <span class="hl">Mental Load</span></h1>
          <p class="copy mono" style="font-size:28px; max-width:620px;">Turn a spoken brain dump into a list your partner gets automatically</p>

          <div class="phonepair">
            <!-- phone 1: the brain dump being spoken -->
            <div class="phone" style="--phone-w:250px;">
              <div class="phonescreen">
                <img class="photo" src="uploads/brain-dump-dictation.png" alt="A spoken brain dump in the shortcut's dictation panel, over the home screen">
              </div>
            </div>

            <!-- curly arrow: what was spoken becomes the lists -->
            <svg class="curlyarrow" width="150" height="120" viewBox="0 0 150 120" fill="none" aria-hidden="true">
              <g stroke="#ffb65b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <path d="M8 58 C 32 58, 46 60, 54 74 C 60 86, 44 92, 38 80 C 32 66, 54 52, 76 56 C 96 60, 104 56, 122 56"/>
                <path d="M104 40 L130 56 L104 72"/>
              </g>
            </svg>

            <!-- phone 2: the lists it wrote, in Notes -->
            <div class="phone" style="--phone-w:250px;">
              <div class="phonescreen">
                <img class="photo" src="uploads/note-food-household.png" alt="The shared Food &amp; Household checklist, six items">
                <img class="noteslice" src="uploads/slice-logistics.png" style="top:44.75%;" alt="The shared Logistics checklist, two items">
                <img class="noteslice" src="uploads/slice-misc.png" style="top:61.54%;" alt="The shared Misc checklist, one item">
              </div>
            </div>
          </div>

          <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
            <p class="copy" style="font-size:26px; color:var(--ink-secondary);">Two iPhone voice shortcuts for mums</p>
            <p class="copy" style="font-size:26px; color:var(--ink-secondary);">Build the first one in 6 minutes on</p>
            <div class="badge" style="font-size:24px; margin-top:6px;">LittleParrot.app</div>
            <p class="copy mono" style="font-size:24px; margin-top:18px;"><span class="hl">Free until 30 August</span></p>
          </div>
        </div>
      </div>
    </div>
    <div class="cropguide"></div>
  </section>

</div>
<script>
  const params = new URLSearchParams(location.search);
  const n = parseInt(params.get('slide'), 10);
  const slides = document.querySelectorAll('#strip > section');
  if (n >= 1 && n <= slides.length) {
    document.body.classList.add('single');
    slides[n - 1].classList.add('current');
  }
  if (params.get('crop') === '1') document.body.classList.add('crop');
</script>
</body>
</html>
