<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="labels-title labels-description">
  <title id="labels-title">Confirmed, suspected and unknown in a bug report</title>
  <desc id="labels-description">One confident sentence, the payment API is broken, sends the investigation towards a single system before the evidence supports it. The same saved-card evidence sorted into three labels instead. Confirmed: the server rejected the request because a required field was missing, backed by the reproduction and the 400 response. Suspected: the saved-card form may not add the current billing address to the request, which still needs a test that proves it. Unknown: which change introduced it, when it began in production and how many customers are affected, each needing an owner and a date. The label tells the next person how much confidence to place in the line.</desc>

  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="28%" stop-color="#fdd825"/>
      <stop offset="52%" stop-color="#fbfb00"/>
      <stop offset="76%" stop-color="#8efd23"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <linearGradient id="brand-gradient-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="50%" stop-color="#fbfb00"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080809" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#080809"/>
    </marker>
    <style>
      .display { font-family: "Space Mono", Menlo, Consolas, monospace; fill: #080809; }
      .copy { font-family: Inter, Arial, sans-serif; fill: #080809; }
      .muted { fill: #4a4a50; }
      .card-title { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; fill: #080809; }
      .sec { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #080809; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 21px; fill: #080809; }
      .gloss { font-family: Inter, Arial, sans-serif; font-size: 20px; fill: #4a4a50; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #4a4a50; }
      .label { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #4a4a50; letter-spacing: 0.5px; }
      .mini { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #4a4a50; letter-spacing: 1px; }
      .pill { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
      .code { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 18px; fill: #080809; }
      .connector { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .stem { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .bracket { fill: none; stroke: #b4b3aa; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #e0dfd6; stroke-width: 2; }
      .band { fill: #ffffff; stroke: #e6e5df; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="930" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1400" height="14" fill="url(#brand-gradient)"/>
  <text x="50" y="84" class="display" font-size="36" font-weight="700">Confirmed, suspected and unknown</text>
  <text x="50" y="124" class="copy muted" font-size="22">The same evidence, sorted so the next person knows what to trust.</text>
  <rect x="420" y="180" width="560" height="118" rx="24" fill="#f4f3ef" stroke="#c9c8c1" stroke-width="3" stroke-dasharray="10 9"/>
  <text x="460" y="222" class="mini">ONE CONFIDENT SENTENCE, WRITTEN AS A FACT</text>
  <text x="460" y="266" class="card-title" style="fill:#4a4a50">"The payment API is broken."</text>
  <path d="M700 298 V338" class="connector"/>
  <text x="726" y="328" class="small">sorts into three</text>
  <g filter="url(#card-shadow)">
    <rect x="60" y="360" width="412" height="330" rx="24" fill="#eafff4" stroke="#00ed70" stroke-width="3"/>
    <rect x="60" y="358" width="412" height="18" rx="9" fill="#00ed70"/>
  </g>
  <rect x="92" y="400" width="122" height="38" rx="19" fill="#00ed70"/>
  <text x="153" y="424" text-anchor="middle" class="pill" style="fill:#080809">CONFIRMED</text>
  <text x="92" y="490" class="body" font-size="20">The server rejected the</text>
  <text x="92" y="520" class="body" font-size="20">request because a required</text>
  <text x="92" y="550" class="body" font-size="20">field was missing.</text>
  <line x1="92" y1="600" x2="440" y2="600" class="divider"/>
  <text x="92" y="634" class="mini">BACKED BY</text>
  <text x="92" y="666" class="small">The reproduction and the 400 response</text>
  <g filter="url(#card-shadow)">
    <rect x="494" y="360" width="412" height="330" rx="24" fill="#fff8d9" stroke="#fdd825" stroke-width="3"/>
    <rect x="494" y="358" width="412" height="18" rx="9" fill="#fdd825"/>
  </g>
  <rect x="526" y="400" width="122" height="38" rx="19" fill="#fdd825"/>
  <text x="587" y="424" text-anchor="middle" class="pill" style="fill:#080809">SUSPECTED</text>
  <text x="526" y="490" class="body" font-size="20">The saved-card form may not</text>
  <text x="526" y="520" class="body" font-size="20">add the current billing</text>
  <text x="526" y="550" class="body" font-size="20">address to the request.</text>
  <line x1="526" y1="600" x2="874" y2="600" class="divider"/>
  <text x="526" y="634" class="mini">STILL NEEDS</text>
  <text x="526" y="666" class="small">A test that proves it</text>
  <g filter="url(#card-shadow)">
    <rect x="928" y="360" width="412" height="330" rx="24" fill="#fff3e6" stroke="#ffb65b" stroke-width="3"/>
    <rect x="928" y="358" width="412" height="18" rx="9" fill="#ffb65b"/>
  </g>
  <rect x="960" y="400" width="101" height="38" rx="19" fill="#ffb65b"/>
  <text x="1011" y="424" text-anchor="middle" class="pill" style="fill:#080809">UNKNOWN</text>
  <text x="960" y="490" class="body" font-size="20">Which change introduced it,</text>
  <text x="960" y="520" class="body" font-size="20">when it began in production,</text>
  <text x="960" y="550" class="body" font-size="20">how many are affected.</text>
  <line x1="960" y1="600" x2="1308" y2="600" class="divider"/>
  <text x="960" y="634" class="mini">NEXT STEP</text>
  <text x="960" y="666" class="small">An owner and a date for each</text>
  <rect x="60" y="740" width="1280" height="110" rx="24" fill="#1a0044"/>
  <rect x="60" y="740" width="14" height="110" rx="7" fill="url(#brand-gradient-v)"/>
  <text x="104" y="780" class="display" font-size="20" font-weight="700" style="fill:#ffd79a">THE LABEL TELLS THE NEXT PERSON HOW MUCH TO TRUST THE LINE</text>
  <text x="104" y="814" class="copy" font-size="21" style="fill:#ffffff">Hypotheses are welcome. An unlabelled one can narrow the investigation too early.</text>
  <text x="1340" y="900" text-anchor="end" class="label">LittleParrot.app</text>
</svg>
