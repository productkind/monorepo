<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320" role="img" aria-labelledby="anatomy-title anatomy-description">
  <title id="anatomy-title">Anatomy of a bug report</title>
  <desc id="anatomy-description">The nine parts of a bug report, grouped by the question each one answers for the next person. The title names one problem: can I tell what is wrong from the title alone. Context and conditions plus steps to reproduce make it repeatable: can I create the same conditions and make it happen. Expected behaviour beside actual behaviour shows the gap: what should have happened, and what happened instead. Evidence proves it: which evidence can another person go and look at. User impact and workaround, the confirmed, suspected and unknown labels, and related information set the stakes: what the user cannot do, and what is still open. One observable problem belongs in each report.</desc>

  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="28%" stop-color="#fdd825"/>
      <stop offset="52%" stop-color="#fbfb00"/>
      <stop offset="76%" stop-color="#8efd23"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <linearGradient id="brand-gradient-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="50%" stop-color="#fbfb00"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080809" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#080809"/>
    </marker>
    <style>
      .display { font-family: "Space Mono", Menlo, Consolas, monospace; fill: #080809; }
      .copy { font-family: Inter, Arial, sans-serif; fill: #080809; }
      .muted { fill: #4a4a50; }
      .card-title { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 26px; font-weight: 700; fill: #080809; }
      .sec { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #080809; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 21px; fill: #080809; }
      .gloss { font-family: Inter, Arial, sans-serif; font-size: 20px; fill: #4a4a50; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 18px; fill: #4a4a50; }
      .label { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #4a4a50; letter-spacing: 0.5px; }
      .mini { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: #4a4a50; letter-spacing: 1px; }
      .pill { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
      .code { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 18px; fill: #080809; }
      .connector { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .stem { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .bracket { fill: none; stroke: #b4b3aa; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #e0dfd6; stroke-width: 2; }
      .band { fill: #ffffff; stroke: #e6e5df; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="1320" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1400" height="14" fill="url(#brand-gradient)"/>
  <text x="50" y="84" class="display" font-size="36" font-weight="700">Anatomy of a bug report</text>
  <text x="50" y="124" class="copy muted" font-size="22">Every section answers a question the next person will ask.</text>
  <g filter="url(#card-shadow)">
    <rect x="60" y="210" width="620" height="904" rx="24" fill="#ffffff" stroke="#e6e5df" stroke-width="2"/>
    <path d="M60 234 a24 24 0 0 1 24 -24 h572 a24 24 0 0 1 24 24 v32 h-620 z" fill="#f4f3ef"/>
  </g>
  <text x="88" y="248" class="mini">BUG REPORT</text>
  <circle cx="640" cy="238" r="6" fill="#d8d7ce"/>
  <circle cx="618" cy="238" r="6" fill="#d8d7ce"/>
  <rect x="84" y="302" width="6" height="72" rx="3" fill="#ffb65b"/>
  <text x="108" y="328" class="sec" font-size="23"># Observed behaviour</text>
  <text x="108" y="360" class="sec" font-size="23" style="fill:#4a4a50">when [condition]</text>
  <line x1="84" y1="390" x2="656" y2="390" class="divider"/>
  <rect x="84" y="406" width="6" height="56" rx="3" fill="#fdd825"/>
  <text x="108" y="426" class="sec">Context and conditions</text>
  <rect x="108" y="442" width="380" height="9" rx="4.5" fill="#e9e8e0"/>
  <rect x="108" y="458" width="250" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="478" x2="656" y2="478" class="divider"/>
  <rect x="84" y="494" width="6" height="56" rx="3" fill="#fdd825"/>
  <text x="108" y="514" class="sec">Steps to reproduce</text>
  <rect x="108" y="530" width="400" height="9" rx="4.5" fill="#e9e8e0"/>
  <rect x="108" y="546" width="330" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="566" x2="656" y2="566" class="divider"/>
  <rect x="84" y="582" width="6" height="56" rx="3" fill="#b9dc14"/>
  <text x="108" y="602" class="sec">Expected behaviour</text>
  <rect x="108" y="618" width="300" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="654" x2="656" y2="654" class="divider"/>
  <rect x="84" y="670" width="6" height="56" rx="3" fill="#b9dc14"/>
  <text x="108" y="690" class="sec">Actual behaviour</text>
  <rect x="108" y="706" width="350" height="9" rx="4.5" fill="#e9e8e0"/>
  <rect x="108" y="722" width="240" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="742" x2="656" y2="742" class="divider"/>
  <rect x="84" y="758" width="6" height="56" rx="3" fill="#8efd23"/>
  <text x="108" y="778" class="sec">Evidence</text>
  <rect x="108" y="794" width="410" height="9" rx="4.5" fill="#e9e8e0"/>
  <rect x="108" y="810" width="260" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="830" x2="656" y2="830" class="divider"/>
  <rect x="84" y="846" width="6" height="56" rx="3" fill="#00ed70"/>
  <text x="108" y="866" class="sec">User impact and workaround</text>
  <rect x="108" y="882" width="390" height="9" rx="4.5" fill="#e9e8e0"/>
  <rect x="108" y="898" width="300" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="918" x2="656" y2="918" class="divider"/>
  <rect x="84" y="934" width="6" height="56" rx="3" fill="#00ed70"/>
  <text x="108" y="954" class="sec">Confirmed, suspected, unknown</text>
  <rect x="108" y="970" width="420" height="9" rx="4.5" fill="#e9e8e0"/>
  <rect x="108" y="986" width="280" height="9" rx="4.5" fill="#e9e8e0"/>
  <line x1="84" y1="1006" x2="656" y2="1006" class="divider"/>
  <rect x="84" y="1022" width="6" height="56" rx="3" fill="#00ed70"/>
  <text x="108" y="1042" class="sec">Related information</text>
  <rect x="108" y="1058" width="300" height="9" rx="4.5" fill="#e9e8e0"/>
  <path d="M700 296 H712 V380 H700" class="bracket"/>
  <path d="M712 338 H740" class="bracket"/>
  <g filter="url(#card-shadow)">
    <rect x="752" y="288" width="588" height="100" rx="22" fill="#ffffff" stroke="#e6e5df" stroke-width="2"/>
    <rect x="752" y="288" width="8" height="100" rx="4" fill="#ffb65b"/>
  </g>
  <text x="786" y="328" class="label">NAMES ONE PROBLEM</text>
  <text x="786" y="364" class="body">Can I tell what is wrong from the title alone?</text>
  <path d="M700 400 H712 V556 H700" class="bracket"/>
  <path d="M712 478 H740" class="bracket"/>
  <g filter="url(#card-shadow)">
    <rect x="752" y="408" width="588" height="140" rx="22" fill="#ffffff" stroke="#e6e5df" stroke-width="2"/>
    <rect x="752" y="408" width="8" height="140" rx="4" fill="#fdd825"/>
  </g>
  <text x="786" y="448" class="label">MAKES IT REPEATABLE</text>
  <text x="786" y="484" class="body">Can I create the same conditions and</text>
  <text x="786" y="514" class="body">make it happen on my machine?</text>
  <path d="M700 576 H712 V732 H700" class="bracket"/>
  <path d="M712 654 H740" class="bracket"/>
  <g filter="url(#card-shadow)">
    <rect x="752" y="584" width="588" height="140" rx="22" fill="#ffffff" stroke="#e6e5df" stroke-width="2"/>
    <rect x="752" y="584" width="8" height="140" rx="4" fill="#b9dc14"/>
  </g>
  <text x="786" y="624" class="label">SHOWS THE GAP</text>
  <text x="786" y="660" class="body">What should have happened, and what</text>
  <text x="786" y="690" class="body">happened instead?</text>
  <path d="M700 752 H712 V820 H700" class="bracket"/>
  <path d="M712 786 H740" class="bracket"/>
  <g filter="url(#card-shadow)">
    <rect x="752" y="736" width="588" height="100" rx="22" fill="#ffffff" stroke="#e6e5df" stroke-width="2"/>
    <rect x="752" y="736" width="8" height="100" rx="4" fill="#8efd23"/>
  </g>
  <text x="786" y="776" class="label">PROVES IT</text>
  <text x="786" y="812" class="body">Which evidence can another person look at?</text>
  <path d="M700 840 H712 V1084 H700" class="bracket"/>
  <path d="M712 962 H740" class="bracket"/>
  <g filter="url(#card-shadow)">
    <rect x="752" y="892" width="588" height="140" rx="22" fill="#ffffff" stroke="#e6e5df" stroke-width="2"/>
    <rect x="752" y="892" width="8" height="140" rx="4" fill="#00ed70"/>
  </g>
  <text x="786" y="932" class="label">SETS THE STAKES</text>
  <text x="786" y="968" class="body">What can the user not do, and what is</text>
  <text x="786" y="998" class="body">still unknown?</text>
  <rect x="60" y="1150" width="1280" height="95" rx="24" fill="#1a0044"/>
  <rect x="60" y="1150" width="14" height="95" rx="7" fill="url(#brand-gradient-v)"/>
  <text x="104" y="1190" class="display" font-size="20" font-weight="700" style="fill:#ffd79a">ONE OBSERVABLE PROBLEM PER REPORT</text>
  <text x="104" y="1224" class="copy" font-size="21" style="fill:#ffffff">Combining unrelated symptoms in one ticket makes ownership, testing and closure harder.</text>
  <text x="1340" y="1292" text-anchor="end" class="label">LittleParrot.app</text>
</svg>
