<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="condition-title condition-description">
  <title id="condition-title">Why a comparison changes one condition at a time</title>
  <desc id="condition-description">Two ways to run the same comparison on a saved-card checkout failure. On the left, three conditions change together: the account moves from an existing account to a new account, the browser from Safari to Chrome, and the payment method from a saved card to a newly entered card. The attempt succeeds, but three conditions moved, so the result does not say which one affected it. On the right, the account and the browser are kept the same and only the payment method changes, from a saved card to a newly entered card. The attempt succeeds, and because one condition moved the failure is connected to the saved-card journey. Run the same steps twice before changing anything, so the team knows the result is consistent.</desc>

  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="28%" stop-color="#fdd825"/>
      <stop offset="52%" stop-color="#fbfb00"/>
      <stop offset="76%" stop-color="#8efd23"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <linearGradient id="brand-gradient-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="50%" stop-color="#fbfb00"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080809" flood-opacity="0.08"/>
    </filter>
    <style>
      .display { font-family: "Space Mono", Menlo, Consolas, monospace; fill: #080809; }
      .copy { font-family: Inter, Arial, sans-serif; fill: #080809; }
      .muted { fill: #4a4a50; }
      .panel-title { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 27px; font-weight: 700; fill: #080809; }
      .cond { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 19px; font-weight: 700; fill: #080809; }
      .detail { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #4a4a50; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 21px; fill: #080809; }
      .label { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #4a4a50; letter-spacing: 0.5px; }
      .pill { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: 1.2px; }
      .row { fill: #ffffff; stroke: #e0dfd6; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1400" height="14" fill="url(#brand-gradient)"/>

  <text x="50" y="84" class="display" font-size="36" font-weight="700">Change one condition at a time</text>
  <text x="50" y="124" class="copy muted" font-size="22">The same successful attempt says different things, depending on how much moved.</text>

  <!-- Panel A -->
  <g filter="url(#card-shadow)">
    <rect x="50" y="190" width="640" height="590" fill="#fff3e6" stroke="#ffb65b" stroke-width="3"/>
    <rect x="50" y="188" width="640" height="18" fill="#ffb65b"/>
  </g>
  <text x="86" y="248" class="label">TELLS THE TEAM NOTHING</text>
  <text x="86" y="290" class="panel-title">Change three at once</text>

  <rect x="86" y="310" width="568" height="74" class="row"/>
  <text x="112" y="342" class="cond">Account</text>
  <text x="112" y="368" class="detail">existing account, then a new account</text>
  <rect x="478" y="330" width="150" height="34" fill="#1a0044"/>
  <text x="553" y="353" class="pill" text-anchor="middle" style="fill:#ffffff">CHANGED</text>

  <rect x="86" y="392" width="568" height="74" class="row"/>
  <text x="112" y="424" class="cond">Browser</text>
  <text x="112" y="450" class="detail">Safari, then Chrome</text>
  <rect x="478" y="412" width="150" height="34" fill="#1a0044"/>
  <text x="553" y="435" class="pill" text-anchor="middle" style="fill:#ffffff">CHANGED</text>

  <rect x="86" y="474" width="568" height="74" class="row"/>
  <text x="112" y="506" class="cond">Payment method</text>
  <text x="112" y="532" class="detail">saved card, then a newly entered card</text>
  <rect x="478" y="494" width="150" height="34" fill="#1a0044"/>
  <text x="553" y="517" class="pill" text-anchor="middle" style="fill:#ffffff">CHANGED</text>

  <rect x="86" y="572" width="568" height="72" fill="#1a0044"/>
  <rect x="86" y="572" width="10" height="72" fill="url(#brand-gradient-v)"/>
  <text x="122" y="600" class="label" style="fill:#ffb65b">RESULT</text>
  <text x="122" y="630" class="copy" font-size="21" style="fill:#ffffff">The attempt succeeds.</text>

  <text x="86" y="686" class="label">WHAT WE LEARNED</text>
  <text x="86" y="716" class="body">Three conditions moved. A successful attempt</text>
  <text x="86" y="746" class="body">does not say which one affected the result.</text>

  <!-- Panel B -->
  <g filter="url(#card-shadow)">
    <rect x="710" y="190" width="640" height="590" fill="#eafff4" stroke="#00ed70" stroke-width="3"/>
    <rect x="710" y="188" width="640" height="18" fill="#00ed70"/>
  </g>
  <text x="746" y="248" class="label">NARROWS THE AREA</text>
  <text x="746" y="290" class="panel-title">Change one at a time</text>

  <rect x="746" y="310" width="568" height="74" class="row"/>
  <text x="772" y="342" class="cond">Account</text>
  <text x="772" y="368" class="detail">the same existing account</text>
  <rect x="1138" y="330" width="150" height="34" fill="#eeede6" stroke="#cfcec4" stroke-width="2"/>
  <text x="1213" y="353" class="pill" text-anchor="middle" style="fill:#4a4a50">KEPT SAME</text>

  <rect x="746" y="392" width="568" height="74" class="row"/>
  <text x="772" y="424" class="cond">Browser</text>
  <text x="772" y="450" class="detail">the same Safari session</text>
  <rect x="1138" y="412" width="150" height="34" fill="#eeede6" stroke="#cfcec4" stroke-width="2"/>
  <text x="1213" y="435" class="pill" text-anchor="middle" style="fill:#4a4a50">KEPT SAME</text>

  <rect x="746" y="474" width="568" height="74" fill="#ffffff" stroke="#00ed70" stroke-width="3"/>
  <text x="772" y="506" class="cond">Payment method</text>
  <text x="772" y="532" class="detail">saved card, then a newly entered card</text>
  <rect x="1138" y="494" width="150" height="34" fill="#1a0044"/>
  <text x="1213" y="517" class="pill" text-anchor="middle" style="fill:#ffffff">CHANGED</text>

  <rect x="746" y="572" width="568" height="72" fill="#1a0044"/>
  <rect x="746" y="572" width="10" height="72" fill="url(#brand-gradient-v)"/>
  <text x="782" y="600" class="label" style="fill:#8efd23">RESULT</text>
  <text x="782" y="630" class="copy" font-size="21" style="fill:#ffffff">The attempt succeeds.</text>

  <text x="746" y="686" class="label">WHAT WE LEARNED</text>
  <text x="746" y="716" class="body">One condition moved. The failure is connected</text>
  <text x="746" y="746" class="body">to the saved-card journey.</text>

  <!-- Closing note -->
  <rect x="50" y="830" width="8" height="86" fill="url(#brand-gradient-v)"/>
  <text x="82" y="858" class="label">NEITHER RESULT IS A ROOT CAUSE</text>
  <text x="82" y="894" class="copy" font-size="22">Repeat the same steps once before changing anything, so you know the result is consistent.</text>

  <text x="1350" y="964" text-anchor="end" class="label">LittleParrot.app</text>
</svg>
