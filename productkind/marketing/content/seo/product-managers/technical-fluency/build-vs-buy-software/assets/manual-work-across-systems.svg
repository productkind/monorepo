<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1050" viewBox="0 0 1300 1050" role="img" aria-labelledby="systems-title systems-description">
  <title id="systems-title">One customer question answered across four separate systems</title>
  <desc id="systems-description">Before the replacement, a colleague answering one question about a customer had to check customer records, order records, payment records and licence records in four separate systems. The records could disagree with each other, and the company created between 85 and 170 invoices manually each month.</desc>

  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="28%" stop-color="#fdd825"/>
      <stop offset="52%" stop-color="#fbfb00"/>
      <stop offset="76%" stop-color="#8efd23"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <linearGradient id="brand-gradient-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb65b"/>
      <stop offset="50%" stop-color="#fbfb00"/>
      <stop offset="100%" stop-color="#00ed70"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080809" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#080809"/>
    </marker>
    <style>
      .display { font-family: "Space Mono", Menlo, Consolas, monospace; fill: #080809; }
      .copy { font-family: Inter, Arial, sans-serif; fill: #080809; }
      .muted { fill: #4a4a50; }
      .card-title { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; fill: #080809; }
      .card-copy { font-family: Inter, Arial, sans-serif; font-size: 22px; fill: #4a4a50; }
      .label { font-family: "Space Mono", Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; fill: #4a4a50; letter-spacing: 0.4px; }
      .connector { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .stem { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .icon { fill: none; stroke: #080809; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1300" height="1050" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1300" height="14" fill="url(#brand-gradient)"/>

  <text x="60" y="84" class="display" font-size="36" font-weight="700">One customer question, four systems</text>
  <text x="60" y="124" class="copy muted" font-size="22">No single system held the current picture of a customer.</text>

  <!-- The question -->
  <g filter="url(#card-shadow)">
    <rect x="60" y="340" width="330" height="300" rx="26" fill="#fff3e6" stroke="#ffb65b" stroke-width="3"/>
    <rect x="60" y="338" width="330" height="18" rx="9" fill="#ffb65b"/>
  </g>
  <g transform="translate(92 384)">
    <circle cx="22" cy="22" r="18" class="icon"/>
    <path d="M35 35 L54 54" class="icon"/>
  </g>
  <text x="164" y="414" class="label">THE QUESTION</text>
  <text x="92" y="474" class="card-title">What does this</text>
  <text x="92" y="508" class="card-title">customer use</text>
  <text x="92" y="542" class="card-title">today?</text>
  <text x="92" y="586" class="card-copy">Asked before changing</text>
  <text x="92" y="614" class="card-copy">a subscription.</text>

  <!-- Fan-out -->
  <path d="M390 490 H500" class="stem"/>
  <path d="M500 245 V731" class="stem"/>
  <path d="M500 245 H604" class="connector"/>
  <path d="M500 407 H604" class="connector"/>
  <path d="M500 569 H604" class="connector"/>
  <path d="M500 731 H604" class="connector"/>

  <!-- Customer records -->
  <g filter="url(#card-shadow)">
    <rect x="612" y="175" width="628" height="140" rx="24" fill="#fff3e6" stroke="#ffb65b" stroke-width="3"/>
    <rect x="612" y="173" width="628" height="18" rx="9" fill="#ffb65b"/>
  </g>
  <g transform="translate(644 221)">
    <circle cx="22" cy="14" r="12" class="icon"/>
    <path d="M2 46 C2 30 42 30 42 46" class="icon"/>
  </g>
  <text x="716" y="233" class="card-title">Customer records</text>
  <text x="716" y="273" class="card-copy">Who they are and which account they use</text>

  <!-- Order records -->
  <g filter="url(#card-shadow)">
    <rect x="612" y="337" width="628" height="140" rx="24" fill="#fff8d9" stroke="#f1c000" stroke-width="3"/>
    <rect x="612" y="335" width="628" height="18" rx="9" fill="#fdd825"/>
  </g>
  <g transform="translate(648 383)">
    <rect x="0" y="0" width="40" height="48" rx="6" class="icon"/>
    <path d="M10 14 H30 M10 25 H30 M10 36 H22" class="icon"/>
  </g>
  <text x="716" y="395" class="card-title">Order records</text>
  <text x="716" y="435" class="card-copy">What they bought and when</text>

  <!-- Payment records -->
  <g filter="url(#card-shadow)">
    <rect x="612" y="499" width="628" height="140" rx="24" fill="#efffe8" stroke="#8efd23" stroke-width="3"/>
    <rect x="612" y="497" width="628" height="18" rx="9" fill="#8efd23"/>
  </g>
  <g transform="translate(644 549)">
    <rect x="0" y="0" width="52" height="38" rx="6" class="icon"/>
    <path d="M0 13 H52 M10 27 H24" class="icon"/>
  </g>
  <text x="716" y="557" class="card-title">Payment records</text>
  <text x="716" y="597" class="card-copy">Whether the invoice was actually paid</text>

  <!-- Licence records -->
  <g filter="url(#card-shadow)">
    <rect x="612" y="661" width="628" height="140" rx="24" fill="#eafff4" stroke="#00ed70" stroke-width="3"/>
    <rect x="612" y="659" width="628" height="18" rx="9" fill="#00ed70"/>
  </g>
  <g transform="translate(644 707)">
    <circle cx="12" cy="24" r="11" class="icon"/>
    <circle cx="12" cy="24" r="3.5" class="icon"/>
    <path d="M23 24 H52 M43 24 V34 M50 24 V31" class="icon"/>
  </g>
  <text x="716" y="719" class="card-title">Licence records</text>
  <text x="716" y="759" class="card-copy">Which subscription or perpetual licence is active</text>

  <!-- Conflict note -->
  <rect x="60" y="826" width="8" height="56" rx="4" fill="url(#brand-gradient-v)"/>
  <text x="90" y="850" class="label">RECORDS COULD DISAGREE</text>
  <text x="90" y="880" class="copy" font-size="22">An order could stay marked unpaid after its invoice had been paid.</text>

  <!-- Manual work band -->
  <rect x="60" y="910" width="1180" height="95" rx="24" fill="#1a0044"/>
  <rect x="60" y="910" width="14" height="95" rx="7" fill="url(#brand-gradient-v)"/>
  <text x="104" y="948" class="display" font-size="21" font-weight="700" style="fill:#ffffff">85 TO 170 INVOICES CREATED MANUALLY EACH MONTH</text>
  <text x="104" y="980" class="copy" font-size="21" style="fill:#ffffff">A wire transfer meant checking the bank, finding the order and marking it paid by hand.</text>

  <text x="1240" y="1032" text-anchor="end" class="label">LittleParrot.app</text>
</svg>
